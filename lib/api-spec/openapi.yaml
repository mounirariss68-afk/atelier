components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ChatMessage:
      type: object
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, minLength: 1, maxLength: 4000 }
      required: [role, content]
    ChatRequest:
      type: object
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 24
          items:
            $ref: "#/components/schemas/ChatMessage"
        language:
          type: string
          enum: [en, ar]
          default: en
      required: [messages]
    ChatSuggestion:
      type: object
      properties:
        kind: { type: string, enum: [service, insight, assessment, industry, page] }
        href: { type: string }
        label: { type: string }
      required: [kind, href, label]
    ChatStreamEvent:
      type: object
      properties:
        type: { type: string, enum: [token, done, error] }
        token: { type: string }
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/ChatSuggestion"
        message: { type: string }
      required: [type]
    ChatError:
      type: object
      properties:
        error: { type: string }
        retryAfterSeconds: { type: number }
      required: [error]

    # ===================== ATELIER =====================
    AtelierError:
      type: object
      properties:
        error: { type: string }
        reason: { type: ["string", "null"] }
        readiness: { type: ["string", "null"] }
      required: [error]

    # ----- v2 CRM Accounts (Task #238) -----
    AtelierAccountTier:
      type: string
      enum: [A, B, C, D]
    AtelierAccountStatus:
      type: string
      enum: [active, dormant, archived]
    AtelierContactDisposition:
      type: string
      enum: [champion, supporter, neutral, skeptic, blocker, unknown]
    AtelierContactSeniority:
      type: string
      enum: [board_chair, board_member, c_suite, vp, director, manager, ic, unknown]
    AtelierBuyerPersona:
      type: string
      enum: [CEO, COO, CIO, CDO, CXO, business_head, procurement, technical_evaluator, other]

    AtelierSourceSignal:
      type: object
      required: [kind, title, url]
      properties:
        kind: { type: string, enum: [news, linkedin, press, filing, manual] }
        title: { type: string }
        url: { type: string }
        summary: { type: ["string", "null"] }
        publishedAt: { type: ["string", "null"] }
        confidence: { type: ["string", "null"], enum: [green, amber, red, null] }
        # Task #9 — true when the URL was backfilled from raw search citations
        # rather than cited by the model against a specific claim. Rendered as
        # "uncorroborated source"; never presented as claim evidence.
        uncorroborated: { type: boolean }

    AtelierProfileUpdateProposal:
      type: object
      required: [id, proposedBy, proposedAt, field, fromValue, toValue, rationale, status]
      properties:
        id: { type: string }
        proposedBy: { type: string }
        proposedAt: { type: string }
        field: { type: string }
        fromValue: {}
        toValue: {}
        rationale: { type: string }
        oppId: { type: ["string", "null"] }
        status: { type: string, enum: [pending, approved, rejected] }
        # Task #568 — side-channel data the applier needs (e.g. strategic
        # priority citation refs, contact reportsToName) + partner inline-edit
        # provenance. All optional.
        meta: { type: ["object", "null"], additionalProperties: true }
        editedAt: { type: ["string", "null"] }
        editedBy: { type: ["string", "null"] }
        originalToValue: {}
        decidedAt: { type: ["string", "null"] }
        decidedBy: { type: ["string", "null"] }

    AtelierProfileUpdateDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        note: { type: ["string", "null"] }
        # Task #568 — partner-edited value to apply instead of the AI's
        # proposed toValue (approve-with-edit). Ignored on reject.
        editedValue: {}

    AtelierBulkDecideProfileUpdatesInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        # When omitted, the decision applies to every currently-pending
        # proposal on the account.
        updateIds:
          type: array
          items: { type: string }

    AtelierCreateAccountInput:
      type: object
      required:
        - name
        - sector
        - country
        - tier
        - status
        - primaryCurrency
        - primaryLanguage
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Legal name (stored in `name`).
        brandName:
          type: ["string", "null"]
          maxLength: 200
          description: Optional display label; overrides `name` on cards/headers.
        sector: { type: string, minLength: 1, maxLength: 120 }
        country: { type: string, minLength: 1, maxLength: 120 }
        hqCity: { type: ["string", "null"], maxLength: 120 }
        size:
          type: ["string", "null"]
          enum: [enterprise, large, mid, small, null]
        tier: { $ref: "#/components/schemas/AtelierAccountTier" }
        status: { $ref: "#/components/schemas/AtelierAccountStatus" }
        primaryCurrency:
          type: string
          minLength: 3
          maxLength: 3
          pattern: "^[A-Z]{3}$"
        primaryLanguage:
          type: string
          enum: [en, ar]
        partnerOwnerId: { type: ["string", "null"] }
        parentAccountId: { type: ["string", "null"] }
        allowDuplicate:
          type: boolean
          default: false
          description: |
            Explicit override for duplicate detection (Task #38). When a
            non-archived account in the org has a matching normalized name,
            the create is rejected with 409 unless this flag is true.
        strategicPriorities:
          type: array
          maxItems: 5
          items: { type: string, minLength: 1, maxLength: 200 }
        cogniriseHypothesis:
          type: ["string", "null"]
          maxLength: 600
        notes:
          type: ["string", "null"]
          maxLength: 2000
        # Task #601 — firmographic enrichment captured from the Cartographer
        # research/Review-&-Create flow. All optional; figures are never
        # fabricated (blank when unknown).
        employeeCount:
          type: ["integer", "null"]
          minimum: 0
          maximum: 100000000
          description: Total headcount; null when unknown (never inferred blindly).
        annualRevenue:
          oneOf:
            - $ref: "#/components/schemas/AtelierAccountAnnualRevenue"
            - type: "null"
        holdingStructure:
          oneOf:
            - $ref: "#/components/schemas/AtelierAccountHoldingStructure"
            - type: "null"
        countryPresence:
          type: array
          maxItems: 40
          items: { $ref: "#/components/schemas/AtelierAccountCountryPresence" }
        entityRole:
          type: ["string", "null"]
          enum: [hq, subsidiary, branch, office, null]
          description: Role of this legal entity within its group (HQ vs branch).
        # Task #587 — reviewed Cartographer research carried over verbatim from
        # the chat `account_proposal` card. When present, the server persists
        # this research directly (firmographic codes, refreshed summary, brief,
        # signals, priority refs) and seeds contacts from the supplied
        # decision-makers, SKIPPING the wasteful second full Cartographer run.
        research:
          oneOf:
            - $ref: "#/components/schemas/AtelierCreateAccountResearch"
            - type: "null"

    # Task #601 — firmographic enrichment value objects.
    AtelierAccountAnnualRevenue:
      type: object
      properties:
        amount:
          type: ["number", "null"]
          minimum: 0
        currency:
          type: ["string", "null"]
          minLength: 3
          maxLength: 3
          pattern: "^[A-Z]{3}$"
        asOf: { type: ["string", "null"], maxLength: 120 }
        sourceUrl: { type: ["string", "null"], maxLength: 500 }
        note: { type: ["string", "null"], maxLength: 200 }

    AtelierAccountHoldingStructure:
      type: object
      required: [isHoldingCompany, isMultiBrand, brands]
      properties:
        isHoldingCompany: { type: boolean }
        isMultiBrand: { type: boolean }
        brands:
          type: array
          maxItems: 24
          items: { type: string, minLength: 1, maxLength: 200 }
        note: { type: ["string", "null"], maxLength: 200 }

    AtelierAccountCountryPresence:
      type: object
      required: [country]
      properties:
        country: { type: string, minLength: 1, maxLength: 120 }
        role:
          type: ["string", "null"]
          enum: [hq, subsidiary, branch, office, null]
        note: { type: ["string", "null"], maxLength: 200 }

    AtelierContactCareerEntry:
      type: object
      required: [role, company]
      properties:
        role: { type: string }
        company: { type: string }
        period: { type: ["string", "null"] }
        highlight: { type: ["string", "null"] }

    AtelierContactEducationEntry:
      type: object
      required: [institution]
      properties:
        institution: { type: string }
        programme: { type: ["string", "null"] }
        year: { type: ["string", "null"] }

    AtelierResearchDecisionMaker:
      type: object
      required: [fullName, confidence]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 200 }
        title: { type: ["string", "null"], maxLength: 200 }
        # Entity-scope fix — which entity this person's title sits at, so a
        # subsidiary/brand exec is never flattened into group leadership. A
        # subsidiary CEO is stored with entityScope:"subsidiary" + entityName,
        # never promoted to the group apex.
        entityName: { type: ["string", "null"], maxLength: 200 }
        entityScope:
          type: ["string", "null"]
          enum: [parent_group, subsidiary, division, standalone, null]
        seniority:
          type: ["string", "null"]
          enum: [board_chair, board_member, c_suite, vp, director, manager, ic, null]
        buyerPersona: { type: ["string", "null"], maxLength: 120 }
        sourceUrl: { type: ["string", "null"], maxLength: 2000 }
        confidence: { type: string, enum: [verified, inferred] }
        # Manager's full name as researched; resolved to a reports_to edge
        # after the contacts are seeded.
        reportsToName: { type: ["string", "null"], maxLength: 200 }
        rationale: { type: ["string", "null"], maxLength: 2000 }
        # Task #589 — deeper person profile (Step 4 of the research method).
        timeInRole: { type: ["string", "null"], maxLength: 120 }
        careerHistory:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/AtelierContactCareerEntry" }
        education:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/AtelierContactEducationEntry" }

    AtelierCreateAccountResearch:
      type: object
      description: |
        Reviewed Account Cartographer output captured in chat. All fields are
        optional; the server persists whatever is supplied and seeds contacts
        from `decisionMakers`.
      properties:
        # Refreshed one-paragraph firm summary; written to `notes` only when the
        # account has none.
        refreshedSummary: { type: ["string", "null"], maxLength: 4000 }
        industryCode: { type: ["string", "null"], maxLength: 64 }
        subIndustryCode: { type: ["string", "null"], maxLength: 64 }
        # Sourced strategic priorities (text + citation URLs). Matches the DB
        # `strategic_priority_refs` shape — NOT a research-brief fact (no
        # `evidence`), so a reviewed payload validates without one.
        strategicPriorityRefs:
          type: array
          maxItems: 5
          items:
            type: object
            required: [text, sourceUrls]
            properties:
              text: { type: string }
              sourceUrls:
                type: array
                items: { type: string }
        sourceSignals:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/AtelierSourceSignal" }
        researchBrief:
          oneOf:
            - $ref: "#/components/schemas/AtelierResearchBrief"
            - type: "null"
        decisionMakers:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/AtelierResearchDecisionMaker" }

    AtelierAccountObjective:
      type: object
      required: [id, text]
      properties:
        id: { type: string }
        text: { type: string, minLength: 1, maxLength: 400 }
        # Measurable target, free text so it fits revenue, headcount, NPS,
        # etc. (e.g. "$4M ARR", "3 active engagements").
        targetValue: { type: ["string", "null"], maxLength: 200 }
        # Timeline / target date — free text or ISO date (e.g. "Q4 2026").
        targetDate: { type: ["string", "null"], maxLength: 120 }

    AtelierAccountStrategy:
      type: object
      required: [objectives, targetServiceLines, winHypothesis, keyPlays]
      properties:
        objectives:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/AtelierAccountObjective" }
        targetServiceLines:
          type: array
          maxItems: 12
          items: { type: string, minLength: 1, maxLength: 160 }
        winHypothesis: { type: string, maxLength: 1200 }
        keyPlays:
          type: array
          maxItems: 12
          items: { type: string, minLength: 1, maxLength: 400 }

    AtelierAccountCompetitor:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 200 }
        # What footprint the competitor/incumbent currently holds.
        holds: { type: ["string", "null"], maxLength: 600 }
        # Cognirise's angle to displace or differentiate against them.
        displacementAngle: { type: ["string", "null"], maxLength: 600 }

    AtelierResearchBriefFact:
      type: object
      required: [text, evidence, sourceUrls]
      properties:
        text: { type: string }
        evidence: { type: string }
        sourceUrls:
          type: array
          items: { type: string }

    AtelierResearchBrief:
      type: object
      required:
        [whatsChanging, executiveTensions, serviceLineFit, partnerEcosystem, mandateAngles, whyNowHypothesis, openQuestions, singleMostImportant]
      properties:
        whatsChanging:
          type: array
          items: { $ref: "#/components/schemas/AtelierResearchBriefFact" }
        executiveTensions:
          type: array
          items: { $ref: "#/components/schemas/AtelierResearchBriefFact" }
        serviceLineFit:
          type: array
          items:
            type: object
            required: [serviceLine, signal, sourceUrls]
            properties:
              serviceLine: { type: string }
              signal: { type: string }
              sourceUrls:
                type: array
                items: { type: string }
        partnerEcosystem:
          type: array
          items:
            type: object
            required: [partner, relationship, sourceUrls]
            properties:
              partner: { type: string }
              relationship: { type: string }
              serviceLineGap: { type: ["string", "null"] }
              sourceUrls:
                type: array
                items: { type: string }
        businessUnits:
          type: array
          items:
            type: object
            required: [name, brands]
            properties:
              name: { type: string }
              brands:
                type: array
                items: { type: string }
              note: { type: ["string", "null"] }
        mandateAngles:
          type: array
          items:
            type: object
            required: [title, serviceLines, tension, whyNow, entryStakeholder, sourceUrls]
            properties:
              title: { type: string }
              serviceLines:
                type: array
                items: { type: string }
              tension: { type: string }
              whyNow: { type: string }
              entryStakeholder: { type: string }
              sourceUrls:
                type: array
                items: { type: string }
        whyNowHypothesis: { type: string }
        openQuestions:
          type: array
          items: { type: string }
        singleMostImportant: { type: string }
        stressTest:
          $ref: "#/components/schemas/AtelierResearchStressTest"

    AtelierResearchStressTest:
      type: object
      description: |
        Step 3 of the Cognirise account-research method — a stress-test of the
        origination hypothesis. Optional; absent on briefs created before the
        4-step method shipped.
      required:
        [failureScenarios, assumptions, likelyObjections, evidenceToStrengthen, revisedHypothesis]
      properties:
        failureScenarios:
          type: array
          items: { type: string }
        assumptions:
          type: object
          required: [evidenced, untestedButLikely, uncertain]
          properties:
            evidenced:
              type: array
              items: { type: string }
            untestedButLikely:
              type: array
              items: { type: string }
            uncertain:
              type: array
              items: { type: string }
        likelyObjections:
          type: array
          items: { type: string }
        evidenceToStrengthen:
          type: array
          items:
            type: object
            required: [evidence, whereToFind]
            properties:
              evidence: { type: string }
              whereToFind: { type: string }
        revisedHypothesis: { type: string }

    AtelierAccountHierarchyRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        brandName: { type: ["string", "null"] }
        tier: { $ref: "#/components/schemas/AtelierAccountTier" }

    AtelierUpdateAccountInput:
      type: object
      description: |
        Partner-editable account fields. Only the keys present are written
        (PATCH semantics). `parentAccountId: null` unlinks the parent.
      properties:
        notes: { type: ["string", "null"], maxLength: 2000 }
        parentAccountId: { type: ["string", "null"] }
        accountStrategy:
          oneOf:
            - $ref: "#/components/schemas/AtelierAccountStrategy"
            - type: "null"
        competitors:
          type: array
          maxItems: 25
          items: { $ref: "#/components/schemas/AtelierAccountCompetitor" }
        # Task #608 — firmographic enrichment, partner-editable after create so
        # stale research can be corrected by hand. Mirrors the create dialog's
        # firmographic block; all optional, figures never fabricated.
        employeeCount:
          type: ["integer", "null"]
          minimum: 0
          maximum: 100000000
        annualRevenue:
          oneOf:
            - $ref: "#/components/schemas/AtelierAccountAnnualRevenue"
            - type: "null"
        holdingStructure:
          oneOf:
            - $ref: "#/components/schemas/AtelierAccountHoldingStructure"
            - type: "null"
        countryPresence:
          type: array
          maxItems: 40
          items: { $ref: "#/components/schemas/AtelierAccountCountryPresence" }
        entityRole:
          type: ["string", "null"]
          enum: [hq, subsidiary, branch, office, null]

    AtelierAccountDuplicateError:
      type: object
      required: [error, existingAccountId]
      properties:
        error: { type: string, enum: [duplicate-name] }
        existingAccountId: { type: string }
        existingAccountName: { type: ["string", "null"] }
        # Task #38 — fuzzy near-matches that rode along with the exact block.
        similar:
          type: array
          items: { $ref: "#/components/schemas/AtelierAccountDuplicateCandidate" }
        message: { type: ["string", "null"] }

    # Task #632 — fuzzy duplicate detection (warn-and-link, never merges).
    AtelierDuplicateConfidence:
      type: string
      enum: [high, medium, low]

    AtelierCheckAccountDuplicatesInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        brandName: { type: ["string", "null"], maxLength: 200 }
        country: { type: ["string", "null"], maxLength: 120 }
        # When editing an existing account, exclude it from its own matches.
        excludeAccountId: { type: ["string", "null"] }

    AtelierAccountDuplicateCandidate:
      type: object
      required: [id, name, confidence, score]
      properties:
        id: { type: string }
        name: { type: string }
        brandName: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        tier: { type: ["string", "null"] }
        confidence: { $ref: "#/components/schemas/AtelierDuplicateConfidence" }
        score: { type: number, minimum: 0, maximum: 1 }
        exact:
          type: boolean
          description: |
            True when the normalized names are identical (Task #38 — exact
            matches block account creation without an explicit override).

    AtelierAccountDuplicateCandidates:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          items: { $ref: "#/components/schemas/AtelierAccountDuplicateCandidate" }

    AtelierCheckContactDuplicatesInput:
      type: object
      required: [fullName]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 160 }
        excludeContactId: { type: ["string", "null"] }

    AtelierContactDuplicateCandidate:
      type: object
      required: [id, fullName, confidence, score]
      properties:
        id: { type: string }
        fullName: { type: string }
        title: { type: ["string", "null"] }
        seniority: { type: ["string", "null"] }
        confidence: { $ref: "#/components/schemas/AtelierDuplicateConfidence" }
        score: { type: number, minimum: 0, maximum: 1 }

    AtelierContactDuplicateCandidates:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          items: { $ref: "#/components/schemas/AtelierContactDuplicateCandidate" }

    # Task #640 — record merge. The survivor is the path id; the body names the
    # duplicate to fold in. `counts` is a per-table tally of re-pointed rows.
    AtelierMergeAccountsInput:
      type: object
      required: [duplicateAccountId]
      properties:
        duplicateAccountId: { type: string, minLength: 1 }

    AtelierMergeContactsInput:
      type: object
      required: [duplicateContactId]
      properties:
        duplicateContactId: { type: string, minLength: 1 }

    AtelierMergeCounts:
      type: object
      additionalProperties: { type: integer }

    AtelierMergeAccountResult:
      type: object
      required: [ok, status, workspace]
      properties:
        ok: { type: boolean }
        status: { type: string, description: "merged | already_merged" }
        counts: { $ref: "#/components/schemas/AtelierMergeCounts" }
        workspace: { $ref: "#/components/schemas/AtelierAccountWorkspace" }

    AtelierMergeContactResult:
      type: object
      required: [ok, status]
      properties:
        ok: { type: boolean }
        status: { type: string, description: "merged | already_merged" }
        counts: { $ref: "#/components/schemas/AtelierMergeCounts" }

    # Task #632 — rolled-up family metrics across an account + its subsidiaries.
    AtelierAccountHierarchyRollup:
      type: object
      required:
        [accountCount, subsidiaryCount, openOpportunityCount, financialsRedacted]
      properties:
        accountCount: { type: integer, description: Family size incl. this account. }
        subsidiaryCount: { type: integer, description: Descendant accounts only. }
        openOpportunityCount: { type: integer }
        # Monetary figures + health honour the account-financials gate; null
        # (with financialsRedacted=true) for personas without financial authority.
        openPipelineUsd: { type: ["number", "null"] }
        totalRevenueUsd: { type: ["number", "null"] }
        health:
          oneOf:
            - $ref: "#/components/schemas/AtelierAccountHealth"
            - type: "null"
        financialsRedacted: { type: boolean }

    AtelierAccountSummary:
      type: object
      required: [id, name, country, sector, tier, status, relationshipStrength]
      properties:
        id: { type: string }
        name: { type: string }
        brandName: { type: ["string", "null"] }
        country: { type: string }
        sector: { type: string }
        tier: { $ref: "#/components/schemas/AtelierAccountTier" }
        status: { $ref: "#/components/schemas/AtelierAccountStatus" }
        size: { type: ["string", "null"] }
        hqCity: { type: ["string", "null"] }
        primaryCurrency: { type: string }
        primaryLanguage: { type: string }
        partnerOwnerId: { type: ["string", "null"] }
        partnerOwnerName: { type: ["string", "null"] }
        # Task #601/#607 — firmographic enrichment surfaced on the account
        # page. All nullable; figures are never fabricated (blank when unknown).
        employeeCount: { type: ["integer", "null"] }
        # Headline annual revenue + key financials. Honours the account-
        # financials access gate: `null` (with annualRevenueRedacted=true) for
        # personas not allowed to see money surfaces.
        annualRevenue:
          oneOf:
            - $ref: "#/components/schemas/AtelierAccountAnnualRevenue"
            - type: "null"
        # True when annualRevenue was withheld by the financials gate
        # (distinguishes "redacted" from "unknown / not disclosed").
        annualRevenueRedacted: { type: boolean }
        # True when the current persona has account-wide financial authority
        # and may therefore VIEW and EDIT the annual revenue figure (same gate
        # that governs annualRevenue visibility). Lets the edit dialog hide the
        # revenue inputs for personas who cannot change money surfaces.
        canEditFinancials: { type: boolean }
        holdingStructure:
          oneOf:
            - $ref: "#/components/schemas/AtelierAccountHoldingStructure"
            - type: "null"
        countryPresence:
          type: array
          items: { $ref: "#/components/schemas/AtelierAccountCountryPresence" }
        # Whether THIS account row represents the group HQ, a subsidiary, or a
        # branch. Null until set.
        entityRole:
          type: ["string", "null"]
          enum: [hq, subsidiary, branch, office, null]
        relationshipStrength: { type: number }
        openOpportunityCount: { type: integer }
        activeEngagementCount: { type: integer }
        lastTouchAt: { type: ["string", "null"] }
        enrichedAt: { type: ["string", "null"] }
        pendingUpdateCount: { type: integer }
        cartographerStatus:
          type: ["string", "null"]
          enum: [running, failed, null]
          description: |
            Transient flag set while an auto-triggered Account Cartographer
            run is in flight (or after it has failed). `null` once the run
            resolves successfully and `enrichedAt` is set.
        cartographerPhase:
          type: ["string", "null"]
          description: |
            Current live phase label of an in-flight Account Cartographer run
            (e.g. "Searching the web (2)", "Read 7 sources",
            "Synthesising the brief… (42s)"). Present only while
            `cartographerStatus` is `running`; `null` otherwise. Lets the
            account page show a meaningful, updating status instead of a bare
            spinner during the long background research run.

    AtelierContact:
      type: object
      required: [id, accountId, fullName, disposition, influenceScore, confidence]
      properties:
        id: { type: string }
        accountId: { type: string }
        fullName: { type: string }
        title: { type: ["string", "null"] }
        seniority: { type: ["string", "null"], enum: [board_chair, board_member, c_suite, vp, director, manager, ic, unknown, null] }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        linkedinUrl: { type: ["string", "null"] }
        buyerPersona: { type: ["string", "null"] }
        # Entity-scope fix — surfaced as a "Group" vs "Subsidiary · X" badge so a
        # subsidiary executive is never read as group leadership.
        entityName: { type: ["string", "null"] }
        entityScope:
          type: ["string", "null"]
          enum: [parent_group, subsidiary, division, standalone, null]
        influenceScore: { type: integer, minimum: 1, maximum: 5 }
        disposition: { $ref: "#/components/schemas/AtelierContactDisposition" }
        lastContactAt: { type: ["string", "null"] }
        contactOwnerId: { type: ["string", "null"] }
        # Task #567 — resolved display name of the Cognirise-side
        # relationship owner (atelier_users.name for contactOwnerId).
        contactOwnerName: { type: ["string", "null"] }
        # Task #567 — our relationship strength with this person (0–100),
        # distinct from influenceScore (their internal clout, 1–5).
        relationshipStrength: { type: integer, minimum: 0, maximum: 100 }
        # Task #567 — next-touch prompt for contact cadence.
        nextTouchAt: { type: ["string", "null"] }
        # Task #567 — lightweight relationship/sentiment trend history.
        relationshipTrend:
          type: array
          items: { $ref: "#/components/schemas/AtelierContactTrendPoint" }
        notes: { type: ["string", "null"] }
        # Task #589 — deep stakeholder profile (account-research Step 4).
        timeInRole: { type: ["string", "null"] }
        careerHistory:
          type: array
          items: { $ref: "#/components/schemas/AtelierContactCareerEntry" }
        education:
          type: array
          items: { $ref: "#/components/schemas/AtelierContactEducationEntry" }
        # Task #275 — cartographer provenance.
        sourceUrl: { type: ["string", "null"] }
        confidence:
          type: string
          enum: [verified, inferred]
          description: |
            "verified" when at least one citation directly names the
            person; "inferred" when the contact came from a heuristic
            (title pattern, org chart inference) without a direct cite.

    AtelierContactTrendPoint:
      type: object
      required: [at, strength]
      properties:
        at: { type: string, description: ISO timestamp of the snapshot. }
        strength: { type: integer, minimum: 0, maximum: 100 }
        disposition: { type: ["string", "null"] }
        note: { type: ["string", "null"] }

    AtelierContactRelationship:
      type: object
      required: [id, accountId, fromContactId, toContactId, type]
      properties:
        id: { type: string }
        accountId: { type: string }
        fromContactId: { type: string }
        toContactId: { type: string }
        type: { type: string, enum: [reports_to, partners_with, blocks] }
        notes: { type: ["string", "null"] }

    AtelierContactGraph:
      type: object
      required: [contacts, relationships]
      properties:
        contacts:
          type: array
          items: { $ref: "#/components/schemas/AtelierContact" }
        relationships:
          type: array
          items: { $ref: "#/components/schemas/AtelierContactRelationship" }

    AtelierContactDispositionInput:
      type: object
      required: [disposition]
      properties:
        disposition: { $ref: "#/components/schemas/AtelierContactDisposition" }
        note: { type: ["string", "null"] }

    AtelierCreateContactInput:
      type: object
      required: [fullName]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 160 }
        title: { type: ["string", "null"] }
        seniority: { type: ["string", "null"], enum: [board_chair, board_member, c_suite, vp, director, manager, ic, unknown, null] }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        linkedinUrl: { type: ["string", "null"] }
        buyerPersona: { type: ["string", "null"] }
        influenceScore: { type: ["integer", "null"], minimum: 1, maximum: 5 }
        disposition: { $ref: "#/components/schemas/AtelierContactDisposition" }
        # Task #567 — relationship depth fields.
        relationshipStrength: { type: ["integer", "null"], minimum: 0, maximum: 100 }
        contactOwnerId: { type: ["string", "null"] }
        lastContactAt: { type: ["string", "null"] }
        nextTouchAt: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }

    AtelierUpdateContactInput:
      type: object
      properties:
        fullName: { type: string, minLength: 1, maxLength: 160 }
        title: { type: ["string", "null"] }
        seniority: { type: ["string", "null"], enum: [board_chair, board_member, c_suite, vp, director, manager, ic, unknown, null] }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        linkedinUrl: { type: ["string", "null"] }
        buyerPersona: { type: ["string", "null"] }
        influenceScore: { type: ["integer", "null"], minimum: 1, maximum: 5 }
        disposition: { $ref: "#/components/schemas/AtelierContactDisposition" }
        # Task #567 — relationship depth fields.
        relationshipStrength: { type: ["integer", "null"], minimum: 0, maximum: 100 }
        contactOwnerId: { type: ["string", "null"] }
        lastContactAt: { type: ["string", "null"] }
        nextTouchAt: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }

    AtelierCreateContactRelationshipInput:
      type: object
      required: [fromContactId, toContactId, type]
      properties:
        fromContactId: { type: string, minLength: 1 }
        toContactId: { type: string, minLength: 1 }
        type: { type: string, enum: [reports_to, partners_with, blocks] }
        notes: { type: ["string", "null"] }

    AtelierAccountOpportunityRef:
      type: object
      required: [id, name, salesStage, dealValueUsd]
      properties:
        id: { type: string }
        name: { type: string }
        salesStage: { $ref: "#/components/schemas/SalesStage" }
        dealValueUsd: { type: number }
        winProbabilityPct: { type: ["number", "null"] }
        leadName: { type: ["string", "null"] }
        nextMilestone: { type: ["string", "null"] }

    AtelierAccountEngagementRef:
      type: object
      required: [id, title, status]
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string }
        leadName: { type: ["string", "null"] }
        startedAt: { type: ["string", "null"] }

    AtelierWhitespaceCell:
      type: object
      required: [offering, persona, state]
      properties:
        offering: { type: string }
        persona: { type: string }
        state: { type: string, enum: [empty, identified, qualified, won] }
        note: { type: ["string", "null"] }
        oppId: { type: ["string", "null"] }
        rationale: { type: ["string", "null"] }

