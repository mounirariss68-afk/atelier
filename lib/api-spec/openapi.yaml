            schema: { $ref: "#/components/schemas/AtelierMarginPolicyInput" }
      responses:
        "200":
          description: Updated policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierMarginPolicy" }
  /atelier/opportunities/{oppId}/pricing:
    get:
      operationId: atelierGetDealPricing
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deal pricing + policy + rate-card rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierDealPricingEnvelope" }
    put:
      operationId: atelierUpdateDealPricing
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtelierDealPricingInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierDealPricingEnvelope" }
  /atelier/opportunities/{oppId}/pricing/whatif:
    post:
      operationId: atelierWhatifDealPricing
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtelierDealPricingInput" }
      responses:
        "200":
          description: Computed (no persistence)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierDealPricingComputed" }
  /atelier/opportunities/{oppId}/pricing/strategist:
    post:
      operationId: atelierRunPricingStrategist
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtelierPricingStrategistInput" }
      responses:
        "200":
          description: Strategist brief with primary + 2-3 alternatives
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierPricingStrategistResult" }
  /atelier/opportunities/{oppId}/pricing/override:
    post:
      operationId: atelierOverridePricing
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtelierMarginOverrideInput" }
      responses:
        "200":
          description: Override recorded
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /atelier/opportunities/{oppId}/pricing/countersign:
    post:
      operationId: atelierCountersignPricing
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtelierMarginOverrideInput" }
      responses:
        "200":
          description: Countersign recorded
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ChatMessage:
      type: object
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, minLength: 1, maxLength: 4000 }
      required: [role, content]
    ChatRequest:
      type: object
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 24
          items:
            $ref: "#/components/schemas/ChatMessage"
        language:
          type: string
          enum: [en, ar]
          default: en
      required: [messages]
    ChatSuggestion:
      type: object
      properties:
        kind: { type: string, enum: [service, insight, assessment, industry, page] }
        href: { type: string }
        label: { type: string }
      required: [kind, href, label]
    ChatStreamEvent:
      type: object
      properties:
        type: { type: string, enum: [token, done, error] }
        token: { type: string }
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/ChatSuggestion"
        message: { type: string }
      required: [type]
    ChatError:
      type: object
      properties:
        error: { type: string }
        retryAfterSeconds: { type: number }
      required: [error]

    # ===================== ATELIER =====================
    AtelierError:
      type: object
      properties:
        error: { type: string }
        reason: { type: ["string", "null"] }
        readiness: { type: ["string", "null"] }
      required: [error]

    # ----- v2 CRM Accounts (Task #238) -----
    AtelierAccountTier:
      type: string
      enum: [A, B, C, D]
    AtelierAccountStatus:
      type: string
      enum: [active, dormant, archived]
    AtelierContactDisposition:
      type: string
      enum: [champion, supporter, neutral, skeptic, blocker, unknown]
    AtelierContactSeniority:
      type: string
      enum: [c_suite, vp, director, manager, ic, unknown]
    AtelierBuyerPersona:
      type: string
      enum: [CEO, COO, CIO, CDO, CXO, business_head, procurement, technical_evaluator, other]

    AtelierSourceSignal:
      type: object
      required: [kind, title, url]
      properties:
        kind: { type: string, enum: [news, linkedin, press, filing, manual] }
        title: { type: string }
        url: { type: string }
        summary: { type: ["string", "null"] }
        publishedAt: { type: ["string", "null"] }
        confidence: { type: ["string", "null"], enum: [green, amber, red, null] }

    AtelierProfileUpdateProposal:
      type: object
      required: [id, proposedBy, proposedAt, field, fromValue, toValue, rationale, status]
      properties:
        id: { type: string }
        proposedBy: { type: string }
        proposedAt: { type: string }
        field: { type: string }
        fromValue: {}
        toValue: {}
        rationale: { type: string }
        oppId: { type: ["string", "null"] }
        status: { type: string, enum: [pending, approved, rejected] }

    AtelierProfileUpdateDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        note: { type: ["string", "null"] }

    AtelierCreateAccountInput:
      type: object
      required:
        - name
        - sector
        - country
        - tier
        - status
        - primaryCurrency
        - primaryLanguage
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Legal name (stored in `name`).
        brandName:
          type: ["string", "null"]
          maxLength: 200
          description: Optional display label; overrides `name` on cards/headers.
        sector: { type: string, minLength: 1, maxLength: 120 }
        country: { type: string, minLength: 1, maxLength: 120 }
        hqCity: { type: ["string", "null"], maxLength: 120 }
        size:
          type: ["string", "null"]
          enum: [enterprise, large, mid, small, null]
        tier: { $ref: "#/components/schemas/AtelierAccountTier" }
        status: { $ref: "#/components/schemas/AtelierAccountStatus" }
        primaryCurrency:
          type: string
          minLength: 3
          maxLength: 3
          pattern: "^[A-Z]{3}$"
        primaryLanguage:
          type: string
          enum: [en, ar]
        partnerOwnerId: { type: ["string", "null"] }
        parentAccountId: { type: ["string", "null"] }
        strategicPriorities:
          type: array
          maxItems: 5
          items: { type: string, minLength: 1, maxLength: 200 }
        aicoHypothesis:
          type: ["string", "null"]
          maxLength: 600
        notes:
          type: ["string", "null"]
          maxLength: 2000

    AtelierAccountDuplicateError:
      type: object
      required: [error, existingAccountId]
      properties:
        error: { type: string, enum: [duplicate-name] }
        existingAccountId: { type: string }
        message: { type: ["string", "null"] }

    AtelierAccountSummary:
      type: object
      required: [id, name, country, sector, tier, status, relationshipStrength]
      properties:
        id: { type: string }
        name: { type: string }
        brandName: { type: ["string", "null"] }
        country: { type: string }
        sector: { type: string }
        tier: { $ref: "#/components/schemas/AtelierAccountTier" }
        status: { $ref: "#/components/schemas/AtelierAccountStatus" }
        size: { type: ["string", "null"] }
        hqCity: { type: ["string", "null"] }
        primaryCurrency: { type: string }
        primaryLanguage: { type: string }
        partnerOwnerId: { type: ["string", "null"] }
        partnerOwnerName: { type: ["string", "null"] }
        relationshipStrength: { type: number }
        openOpportunityCount: { type: integer }
        activeEngagementCount: { type: integer }
        lastTouchAt: { type: ["string", "null"] }
        enrichedAt: { type: ["string", "null"] }
        pendingUpdateCount: { type: integer }
        cartographerStatus:
          type: ["string", "null"]
          enum: [running, failed, null]
          description: |
            Transient flag set while an auto-triggered Account Cartographer
            run is in flight (or after it has failed). `null` once the run
            resolves successfully and `enrichedAt` is set.

    AtelierContact:
      type: object
      required: [id, accountId, fullName, disposition, influenceScore, confidence]
      properties:
        id: { type: string }
        accountId: { type: string }
        fullName: { type: string }
        title: { type: ["string", "null"] }
        seniority: { type: ["string", "null"], enum: [c_suite, vp, director, manager, ic, unknown, null] }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        linkedinUrl: { type: ["string", "null"] }
        buyerPersona: { type: ["string", "null"] }
        influenceScore: { type: integer, minimum: 1, maximum: 5 }
        disposition: { $ref: "#/components/schemas/AtelierContactDisposition" }
        lastContactAt: { type: ["string", "null"] }
        contactOwnerId: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        # Task #275 — cartographer provenance.
        sourceUrl: { type: ["string", "null"] }
        confidence:
          type: string
          enum: [verified, inferred]
          description: |
            "verified" when at least one citation directly names the
            person; "inferred" when the contact came from a heuristic
            (title pattern, org chart inference) without a direct cite.

    AtelierContactRelationship:
      type: object
      required: [id, accountId, fromContactId, toContactId, type]
      properties:
        id: { type: string }
        accountId: { type: string }
        fromContactId: { type: string }
        toContactId: { type: string }
        type: { type: string, enum: [reports_to, partners_with, blocks] }
        notes: { type: ["string", "null"] }

    AtelierContactGraph:
      type: object
      required: [contacts, relationships]
      properties:
        contacts:
          type: array
          items: { $ref: "#/components/schemas/AtelierContact" }
        relationships:
          type: array
          items: { $ref: "#/components/schemas/AtelierContactRelationship" }

    AtelierContactDispositionInput:
      type: object
      required: [disposition]
      properties:
        disposition: { $ref: "#/components/schemas/AtelierContactDisposition" }
        note: { type: ["string", "null"] }

    AtelierAccountOpportunityRef:
      type: object
      required: [id, name, plmStage, dealValueUsd]
      properties:
        id: { type: string }
        name: { type: string }
        plmStage: { $ref: "#/components/schemas/PlmStage" }
        dealValueUsd: { type: number }
        winProbabilityPct: { type: ["number", "null"] }
        leadName: { type: ["string", "null"] }
        nextMilestone: { type: ["string", "null"] }

    AtelierAccountEngagementRef:
      type: object
      required: [id, title, status]
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string }
        leadName: { type: ["string", "null"] }
        startedAt: { type: ["string", "null"] }

    AtelierWhitespaceCell:
      type: object
      required: [offering, persona, state]
      properties:
        offering: { type: string }
        persona: { type: string }
        state: { type: string, enum: [empty, identified, qualified, won] }
        note: { type: ["string", "null"] }
        oppId: { type: ["string", "null"] }
        rationale: { type: ["string", "null"] }

    AtelierWhitespaceCanvas:
      type: object
      required: [accountId, offerings, personas, cells]
      properties:
        accountId: { type: string }
        offerings:
          type: array
          items: { type: string }
        personas:
          type: array
          items: { type: string }
        cells:
          type: array
          items: { $ref: "#/components/schemas/AtelierWhitespaceCell" }
        priorityMoves:
          type: array
          items: { type: string }
        generatedAt: { type: ["string", "null"] }

    AtelierQbrSection:
      type: object
      required: [heading, body]
      properties:
        heading: { type: string }
        body: { type: string }

    AtelierQbrCanvas:
      type: object
      required: [accountId, periodLabel, sections]
      properties:
        accountId: { type: string }
        periodLabel: { type: string }
        sections:
          type: array
          items: { $ref: "#/components/schemas/AtelierQbrSection" }
        riskFlags:
          type: array
          items: { type: string }
        nextMoves:
          type: array
          items: { type: string }
        generatedAt: { type: ["string", "null"] }

    AtelierAuditEventLite:
      type: object
      required: [id, action, actorLabel, createdAt]
      properties:
        id: { type: string }
        action: { type: string }
        actorType: { type: string }
        actorLabel: { type: string }
        payloadSummary: { type: ["string", "null"] }
        createdAt: { type: string }

    AtelierAccountWorkspace:
      type: object
      required:
        [account, contacts, relationships, opportunities, engagements, audit]
      properties:
        account:
          allOf:
            - $ref: "#/components/schemas/AtelierAccountSummary"
            - type: object
              properties:
                notes: { type: ["string", "null"] }
                strategicPriorities:
                  type: array
                  items: { type: string }
                # Task #275 — sourced strategic priorities. Mirrors
                # `strategicPriorities` 1:1 with citation URLs per entry.
                strategicPriorityRefs:
                  type: array
                  items:
                    type: object
                    required: [text, sourceUrls]
                    properties:
                      text: { type: string }
                      sourceUrls:
                        type: array
                        items: { type: string }
                aicoHypothesis: { type: ["string", "null"] }
                sourceSignals:
                  type: array
                  items: { $ref: "#/components/schemas/AtelierSourceSignal" }
                pendingProfileUpdates:
                  type: array
                  items:
                    $ref: "#/components/schemas/AtelierProfileUpdateProposal"
        contacts:
          type: array
          items: { $ref: "#/components/schemas/AtelierContact" }
        relationships:
          type: array
          items: { $ref: "#/components/schemas/AtelierContactRelationship" }
        opportunities:
          type: array
          items: { $ref: "#/components/schemas/AtelierAccountOpportunityRef" }
        engagements:
          type: array
          items: { $ref: "#/components/schemas/AtelierAccountEngagementRef" }
        audit:
          type: array
          items: { $ref: "#/components/schemas/AtelierAuditEventLite" }
        whitespacePreview:
          $ref: "#/components/schemas/AtelierWhitespaceCanvas"
        qbrPreview:
          $ref: "#/components/schemas/AtelierQbrCanvas"

    AtelierCartographerRefreshInput:
      type: object
      properties:
        focusOpportunityId: { type: ["string", "null"] }

    AtelierCredential:
      type: object
      required:
        [id, title, clientName, sector, engagementType, anonymizationStatus, redactedAbstract, outcomeMetrics, evidenceLinks, tags]
      properties:
        id: { type: string }
        title: { type: string }
        accountId: { type: ["string", "null"] }
        clientName: { type: string }
        sector: { type: string }
        engagementType:
          { type: string, enum: [diagnostic, pov, agentic_build, transformation, workshop] }
        anonymizationStatus:
          { type: string, enum: [redacted, attributed, pending] }
        redactedAbstract: { type: string }
        attributedAbstract: { type: ["string", "null"] }
        outcomeMetrics:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: string }
        evidenceLinks:
          type: array
          items:
            type: object
            required: [label, url]
            properties:
              label: { type: string }
              url: { type: string }
        relatedAssetId: { type: ["string", "null"] }
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string }

    AtelierCredentialInput:
      type: object
      required: [title, clientName, sector, engagementType, redactedAbstract]
      properties:
        title: { type: string }
        accountId: { type: ["string", "null"] }
        clientName: { type: string }
        sector: { type: string }
        engagementType: { type: string }
        anonymizationStatus: { type: ["string", "null"] }
        redactedAbstract: { type: string }
        attributedAbstract: { type: ["string", "null"] }
        outcomeMetrics:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: string }
        evidenceLinks:
          type: array
          items:
            type: object
            required: [label, url]
            properties:
              label: { type: string }
              url: { type: string }
        tags:
          type: array
          items: { type: string }
    # ----- end v2 CRM Accounts -----

    AtelierPersonaRole:
      type: string
      enum: [founding_partner, partner, finance, hr, senior_manager, consultant, contractor, partner_firm_resource, board_observer]

    AtelierPersona:
      type: object
      required: [id, name, email, role, roleLabel, title, initials]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/AtelierPersonaRole" }
        roleLabel: { type: string }
        title: { type: string }
        initials: { type: string }
        avatarUrl: { type: ["string", "null"] }

    AtelierPersonaSwitchInput:
      type: object
      required: [personaId]
      properties:
        personaId: { type: string }

    PlmStage:
      type: string
      enum: [identify, shape, pursue, mobilize, deliver, compound, won, lost, no_go, closed]

    SalesStage:
      type: string
      description: |
        Canonical 5-stage funnel + 3 terminals (Task #295). plmStage is
        derived. Working: suspect → prospect → convert → runner → contract.
        Terminals: lost · no_decision · withdrawn.
      enum:
        - suspect
        - prospect
        - convert
        - runner
        - contract
        - lost
        - no_decision
        - withdrawn

    Account:
      type: object
      required: [id, name, country, sector]
      properties:
        id: { type: string }
        name: { type: string }
        country: { type: string }
        sector: { type: string }
        notes: { type: ["string", "null"] }

    Opportunity:
      type: object
      required:
        - id
        - slug
        - name
        - accountId
        - accountName
        - plmStage
        - partnerOwnerName
        - engagementLeadName
        - dealSizeUsd
        - probabilityPct
        - weightedValueUsd
        - daysInStage
        - nextMilestone
        - sourceLead
        - createdAt
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        accountId: { type: string }
        accountName: { type: string }
        plmStage: { $ref: "#/components/schemas/PlmStage" }
        salesStage: { $ref: "#/components/schemas/SalesStage" }
        buyerPersona: { type: ["string", "null"] }
        offeringAnchor: { type: ["string", "null"] }
        partnerOwnerName: { type: string }
        engagementLeadName: { type: string }
        dealSizeUsd: { type: number }
        probabilityPct: { type: number }
        weightedValueUsd: { type: number }
        daysInStage: { type: integer }
        nextMilestone: { type: string }
        nextMilestoneDate: { type: ["string", "null"] }
        sourceLead: { type: string }
        stalled: { type: boolean }
        # Task #295/#296 — sub-status chip for kanban + sticky stage timestamps.
        subStatus: { type: ["string", "null"] }
        runnerEnteredAt: { type: ["string", "null"], format: date-time }
        contractSignedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    OpportunityStageTransition:
      type: object
      required: [id, opportunityId, toStage, transitionedByUserId, createdAt]
      properties:
        id: { type: string }
        opportunityId: { type: string }
        fromStage: { oneOf: [{ $ref: "#/components/schemas/SalesStage" }, { type: "null" }] }
        toStage: { $ref: "#/components/schemas/SalesStage" }
        transitionedByUserId: { type: string }
        transitionedByName: { type: ["string", "null"] }
        rationaleText: { type: ["string", "null"] }
        evidenceArtifactIds:
          type: array
          items: { type: string }
        priorProbabilityPct: { type: ["number", "null"] }
        newProbabilityPct: { type: ["number", "null"] }
        nextMilestone: { type: ["string", "null"] }
        nextMilestoneDate: { type: ["string", "null"] }
        agentRecommended: { type: boolean }
        partnerOverride: { type: boolean }
        createdAt: { type: string, format: date-time }

    AtelierStageTransitionInput:
      type: object
      required: [toStage, rationaleText]
      properties:
        toStage: { $ref: "#/components/schemas/SalesStage" }
        rationaleText: { type: string, minLength: 1 }
        evidenceArtifactIds:
          type: array
          items: { type: string }
          default: []
        newProbabilityPct: { type: ["number", "null"] }
        nextMilestone: { type: ["string", "null"] }
        nextMilestoneDate: { type: ["string", "null"] }
        partnerOverride: { type: boolean, default: false }
        # Task #295 — per-transition gate fields.
        # Sub-status under the new stage (taxonomy in pipeline.ts SUB_STATUS_BY_STAGE).
        subStatus: { type: ["string", "null"] }
        # Convert→Runner gate: named decider + verbal-commit date + signature path.
        decider: { type: ["string", "null"] }
        verbalCommitDate: { type: ["string", "null"] }
        signaturePath: { type: ["string", "null"] }
        # Runner→Contract gate: signed instrument upload (artifact id).
        signedInstrumentFileId: { type: ["string", "null"] }
        # Terminal stage gate: reason code (taxonomy in pipeline.ts TERMINAL_REASON_CODES).
        reasonCode: { type: ["string", "null"] }

    PipelineStageBucket:
      type: object
      required: [stage, count, dealSumUsd, weightedSumUsd, avgDaysInStage]
      properties:
        stage: { $ref: "#/components/schemas/SalesStage" }
        count: { type: integer }
        dealSumUsd: { type: number }
        weightedSumUsd: { type: number }
        avgDaysInStage: { type: number }

    PipelineForecastSummary:
      type: object
      required:
        - totalCount
        - totalDealSumUsd
        - weightedPipelineUsd
        - stalledCount
        - asOf
        - buckets
      properties:
        totalCount: { type: integer }
        totalDealSumUsd: { type: number }
        weightedPipelineUsd: { type: number }
        stalledCount: { type: integer }
        asOf: { type: string, format: date-time }
        buckets:
          type: array
          items: { $ref: "#/components/schemas/PipelineStageBucket" }

    Engagement:
      type: object
      required:
        - id
        - slug
        - name
        - accountId
        - accountName
        - plmStage
        - partnerOwnerName
        - engagementLeadName
        - startDate
        - plannedEndDate
        - raidStatus
        - deliverablesDueThisWeek
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        accountId: { type: string }
        accountName: { type: string }
        plmStage: { $ref: "#/components/schemas/PlmStage" }
        partnerOwnerName: { type: string }
        engagementLeadName: { type: string }
        startDate: { type: string }
        plannedEndDate: { type: string }
        raidStatus: { type: string, enum: [green, amber, red] }
        deliverablesDueThisWeek: { type: integer }

    AgentCatalogEntry:
      type: object
