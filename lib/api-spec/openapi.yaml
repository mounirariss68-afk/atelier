      properties:
        pricing: { $ref: "#/components/schemas/AtelierDealPricing" }
        policy: { $ref: "#/components/schemas/AtelierMarginPolicy" }
        rateCardRows:
          type: array
          items:
            type: object
            required: [seniority, dayRateInternalCost, dayRateClientPrice, overheadPct]
            properties:
              seniority: { type: string }
              dayRateInternalCost: { type: number }
              dayRateClientPrice: { type: number }
              overheadPct: { type: number }
        breakdown:
          type: array
          items:
            type: object
            additionalProperties: true

    AtelierDealPricingInput:
      type: object
      properties:
        teamMix:
          type: array
          items: { $ref: "#/components/schemas/AtelierTeamMixEntry" }
        durationWeeks: { type: number }
        pricingModel: { type: string }
        rateCardId: { type: string }

    AtelierDealPricingComputed:
      type: object
      required: [computedCostUsd, computedPriceUsd, computedMarginPct, marginLockStatus]
      properties:
        computedCostUsd: { type: number }
        computedPriceUsd: { type: number }
        computedMarginPct: { type: number }
        marginLockStatus: { $ref: "#/components/schemas/AtelierMarginLockStatus" }
