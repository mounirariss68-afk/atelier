          description: Updated workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierAccountWorkspace" }
        "403":
          description: Not allowed (insufficient persona)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierError" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierError" }
