        subtype: { type: ["string", "null"] }
        title: { type: string }
        detail: { type: ["string", "null"] }
        actorName: { type: ["string", "null"] }
        date: { type: string }
        # Where this entry can be opened (e.g. opportunity / meeting / run).
        refKind: { type: ["string", "null"] }
        refId: { type: ["string", "null"] }

    AtelierAccountTimeline:
      type: object
      required: [accountId, activities, timeline, openTasks]
      properties:
        accountId: { type: string }
        # The account's first-class activities/tasks (newest-first).
