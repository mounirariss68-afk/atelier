              schema: { $ref: "#/components/schemas/AtelierArtifact" }

  /atelier/accounts:
    get:
      operationId: atelierListAccounts
      tags: [atelier]
      summary: Firm accounts (CRM list, with v2 filters)
      parameters:
        - in: query
          name: tier
          schema: { type: string, enum: [A, B, C, D] }
        - in: query
          name: sector
          schema: { type: string }
        - in: query
          name: ownerId
          schema: { type: string }
        - in: query
          name: status
          description: |
            Lifecycle filter (Task #627). Omitted = active roster (excludes
            archived). `archived` = only archived accounts (the Archived
            filter). `all` = both. Permanently-deleted accounts are never
            returned.
          schema: { type: string, enum: [archived, all] }
      responses:
        "200":
          description: All accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierAccountSummary"
    post:
      operationId: atelierCreateAccount
      tags: [atelier]
      summary: Create a new CRM account (Partner / Engagement Lead only)
      description: |
        Creates a new account in the active org. Server-side stamps `id`,
        `createdAt`, `updatedAt`, and `createdByUserId`. Auto-triggers an
        Account Cartographer run (fire-and-forget) so the workspace lands
        with research already in flight.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierCreateAccountInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierAccountSummary"
        "403":
          description: Not allowed (non-partner / non-lead persona)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierError"
        "409":
          description: An account with this legal name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierAccountDuplicateError"
  /atelier/accounts/check-duplicates:
    post:
      operationId: atelierCheckAccountDuplicates
      tags: [atelier]
      summary: Fuzzy duplicate-account check (warn before create)
      description: |
        Returns likely-duplicate accounts (fuzzy name/brand match, dampened by
        country mismatch) so the create dialog can warn the partner before they
        add a record that already exists. Org-scoped; gated to the same
        Partner / Engagement Lead personas that may create accounts. Never
        mutates or merges — purely advisory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierCheckAccountDuplicatesInput"
      responses:
        "200":
          description: Candidate duplicates (possibly empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierAccountDuplicateCandidates"
        "403":
          description: Not allowed (non-partner / non-lead persona)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierError"
  /atelier/accounts/{accountId}/merge:
    post:
      operationId: atelierMergeAccounts
      tags: [atelier]
      summary: Merge a duplicate account into this (survivor) account
      description: |
        Consolidates a duplicate account into the survivor identified by the
        path. Every child row (contacts, opportunities, engagements, insights,
        activities, audit history, …) is re-pointed to the survivor and the
        duplicate is soft-deleted. The merge is audit-logged and org-scoped.
        Partner / Senior Manager only, and the caller must be able to see BOTH
        accounts. Mirrors the role gating of editing an account.
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierMergeAccountsInput"
      responses:
        "200":
          description: Merge result with the refreshed survivor workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierMergeAccountResult"
        "400":
          description: Invalid body / merging a record into itself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierError"
        "403":
          description: Not allowed (non-partner persona, or an account not visible)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierError"
        "404":
          description: Survivor or duplicate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierError"
  /atelier/accounts/{accountId}:
    get:
      operationId: atelierGetAccountWorkspace
      tags: [atelier]
      summary: Full account workspace payload (Profile + Contacts + Opps + Engs + Audit)
      parameters:
        - in: path
          name: accountId
          required: true
