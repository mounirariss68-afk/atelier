      properties:
        id: { type: string }
        action: { type: string }
        actorType: { type: string }
        actorLabel: { type: string }
        payloadSummary: { type: ["string", "null"] }
        createdAt: { type: string }

    # Task #617 — a single firmographic field edit, surfaced so partners can
    # see who changed what (and when) on the Company Details card and revert an
    # accidental overwrite. `fromValue` / `toValue` carry the raw JSON so the
    # revert can PATCH the previous value straight back; `fromDisplay` /
    # `toDisplay` are pre-formatted for the UI. Annual-revenue entries are
    # redacted (values + displays nulled, `redacted: true`, `canRevert: false`)
    # for personas without financial authority — mirrors the annualRevenue gate.
    AtelierFirmographicChange:
      type: object
      required: [id, field, label, actorType, actorLabel, at, redacted, canRevert]
      properties:
        id: { type: string }
        field: { type: string }
        label: { type: string }
        actorType: { type: string }
        actorLabel: { type: string }
        at: { type: string }
        fromValue: {}
        toValue: {}
        fromDisplay: { type: ["string", "null"] }
        toDisplay: { type: ["string", "null"] }
        redacted: { type: boolean }
        canRevert: { type: boolean }

    AtelierAccountWorkspace:
      type: object
      required:
        [account, contacts, relationships, opportunities, engagements, audit]
      properties:
        account:
          allOf:
            - $ref: "#/components/schemas/AtelierAccountSummary"
            - type: object
              properties:
                # Task #570 — compact composite account health for the record
                # header. Null for personas not allowed to see financials.
                health:
                  oneOf:
                    - $ref: "#/components/schemas/AtelierAccountHealth"
                    - type: "null"
                notes: { type: ["string", "null"] }
                strategicPriorities:
                  type: array
                  items: { type: string }
                # Task #275 — sourced strategic priorities. Mirrors
                # `strategicPriorities` 1:1 with citation URLs per entry.
                strategicPriorityRefs:
                  type: array
                  items:
                    type: object
                    required: [text, sourceUrls]
                    properties:
                      text: { type: string }
                      sourceUrls:
                        type: array
                        items: { type: string }
                cogniriseHypothesis: { type: ["string", "null"] }
                # Task #566 — Cognirise-authored plan of record.
                accountStrategy:
                  oneOf:
                    - $ref: "#/components/schemas/AtelierAccountStrategy"
                    - type: "null"
                # Task #566 — competitive landscape / incumbents.
                competitors:
                  type: array
                  items: { $ref: "#/components/schemas/AtelierAccountCompetitor" }
                # Task #566 — full AI research brief (was persisted but not
                # surfaced); rendered compactly with progressive disclosure.
                researchBrief:
                  oneOf:
                    - $ref: "#/components/schemas/AtelierResearchBrief"
                    - type: "null"
                # Task #9 — deterministic research-quality signals over the
                # persisted brief: completeness checklist/score, narrative→
                # evidence links (section:index fact refs), age + staleness.
                researchQuality:
                  $ref: "#/components/schemas/AtelierAccountResearchQuality"
                # Task #566 — parent / subsidiary hierarchy.
                parentAccountId: { type: ["string", "null"] }
                parent:
                  oneOf:
                    - $ref: "#/components/schemas/AtelierAccountHierarchyRef"
                    - type: "null"
                children:
                  type: array
                  items: { $ref: "#/components/schemas/AtelierAccountHierarchyRef" }
                # Task #632 — rolled-up metrics across this account + its
                # subsidiaries. Null for leaf accounts (no subsidiaries).
                hierarchyRollup:
                  oneOf:
                    - $ref: "#/components/schemas/AtelierAccountHierarchyRollup"
                    - type: "null"
                sourceSignals:
                  type: array
                  items: { $ref: "#/components/schemas/AtelierSourceSignal" }
                pendingProfileUpdates:
                  type: array
                  items:
                    $ref: "#/components/schemas/AtelierProfileUpdateProposal"
                # Task #608 — firmographic enrichment surfaced so the account
                # edit dialog can prefill and partners can correct stale data.
                employeeCount: { type: ["integer", "null"] }
                annualRevenue:
                  oneOf:
                    - $ref: "#/components/schemas/AtelierAccountAnnualRevenue"
                    - type: "null"
                holdingStructure:
                  oneOf:
                    - $ref: "#/components/schemas/AtelierAccountHoldingStructure"
                    - type: "null"
                countryPresence:
                  type: array
                  items: { $ref: "#/components/schemas/AtelierAccountCountryPresence" }
                entityRole:
                  type: ["string", "null"]
                  enum: [hq, subsidiary, branch, office, null]
                # Task #607/#613 — true when annualRevenue was withheld by the
                # financials gate (so the card can show "Restricted").
                annualRevenueRedacted: { type: boolean }
                # Task #613 — true when the persona may view AND edit the
                # revenue figure; the edit dialog hides revenue inputs when false.
                canEditFinancials: { type: boolean }
        contacts:
          type: array
          items: { $ref: "#/components/schemas/AtelierContact" }
        relationships:
          type: array
          items: { $ref: "#/components/schemas/AtelierContactRelationship" }
        opportunities:
          type: array
          items: { $ref: "#/components/schemas/AtelierAccountOpportunityRef" }
        engagements:
          type: array
          items: { $ref: "#/components/schemas/AtelierAccountEngagementRef" }
        audit:
          type: array
          items: { $ref: "#/components/schemas/AtelierAuditEventLite" }
        # Task #617 — recent firmographic field edits (newest-first), surfaced
        # on the Company Details card so partners can review and revert an
        # accidental overwrite without digging through the full audit trail.
        firmographicHistory:
          type: array
          items: { $ref: "#/components/schemas/AtelierFirmographicChange" }
        # Task #569 — multi-author human insight feed (newest-first).
        insights:
          type: array
          items: { $ref: "#/components/schemas/AtelierAccountInsight" }
        # Task #569 — account team (additional members beyond the owner).
        accountTeam:
          type: array
          items: { $ref: "#/components/schemas/AtelierAccountTeamMember" }
        # Task #571 — account planning & execution layer.
        actionPlan:
          type: array
          items: { $ref: "#/components/schemas/AtelierAccountAction" }
        riskRegister:
          type: array
          items: { $ref: "#/components/schemas/AtelierAccountRisk" }
        goalProgress:
          type: array
          items: { $ref: "#/components/schemas/AtelierAccountGoalProgress" }
        whitespacePreview:
          $ref: "#/components/schemas/AtelierWhitespaceCanvas"
        qbrPreview:
          $ref: "#/components/schemas/AtelierQbrCanvas"

    # ================================================================
    # Task #570 — Account 360: financials, history & health.
    # Read-only rollup of existing engagement / invoice / opportunity data.
    # ================================================================
    AtelierAccountFinancials:
      type: object
      required:
        - contractValueUsd
        - activeEngagementValueUsd
        - recognisedRevenueUsd
        - billedUsd
        - collectedUsd
        - costToDateUsd
        - grossMarginPct
        - openPipelineUsd
        - weightedPipelineUsd
        - arOutstandingUsd
        - arOverdueUsd
        - aging
        - invoiceCount
        - overdueInvoiceCount
        - engagementCount
        - activeEngagementCount
        - openOpportunityCount
      properties:
        contractValueUsd: { type: number }
        activeEngagementValueUsd: { type: number }
        recognisedRevenueUsd: { type: number }
        billedUsd: { type: number }
        collectedUsd: { type: number }
        costToDateUsd: { type: number }
        grossMarginPct: { type: number, description: "0–1 fraction." }
        openPipelineUsd: { type: number }
        weightedPipelineUsd: { type: number }
        arOutstandingUsd: { type: number }
        arOverdueUsd: { type: number }
        aging:
          type: object
          required: [current, d30, d60, d90, d90plus]
          properties:
            current: { type: number }
            d30: { type: number }
            d60: { type: number }
            d90: { type: number }
            d90plus: { type: number }
        invoiceCount: { type: integer }
        overdueInvoiceCount: { type: integer }
        engagementCount: { type: integer }
        activeEngagementCount: { type: integer }
        openOpportunityCount: { type: integer }

    AtelierAccountHealthBand:
