      tags: [atelier]
      summary: Firm accounts (CRM list, with v2 filters)
      parameters:
        - in: query
          name: tier
          schema: { type: string, enum: [A, B, C, D] }
        - in: query
          name: sector
          schema: { type: string }
        - in: query
          name: ownerId
          schema: { type: string }
