      description: Per-brief completeness summary so partners can judge research quality at a glance.
      required: [sections, missingSections, factCount, sourcedFactCount, sourcedFactRatio, confidenceMix, score]
      properties:
        sections:
          type: object
          additionalProperties: { type: boolean }
        missingSections:
          type: array
          items: { type: string }
        factCount: { type: integer }
        sourcedFactCount: { type: integer }
