    AtelierUpdateAccountActionInput:
      type: object
      properties:
        title: { type: string }
        detail: { type: ["string", "null"] }
        ownerId: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/AtelierAccountActionStatus" }
        priority: { $ref: "#/components/schemas/AtelierAccountActionPriority" }
        dueDate: { type: ["string", "null"] }
        linkedObjectiveId: { type: ["string", "null"] }
        linkedPlay: { type: ["string", "null"] }

    AtelierCreateAccountRiskInput:
      type: object
      required: [description]
      properties:
        description: { type: string }
        kind: { $ref: "#/components/schemas/AtelierAccountRiskKind" }
        severity: { $ref: "#/components/schemas/AtelierAccountRiskSeverity" }
