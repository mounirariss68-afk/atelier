      type: object
      required: [runId, primary, alternatives, talkingPoints, risks, marginLockChip, partnerOverrideRequired, twoPartnerRequired, confidence]
      properties:
        runId: { type: string }
        primary: { $ref: "#/components/schemas/AtelierPricingStrategistPrimary" }
