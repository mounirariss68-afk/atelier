        rateCardId: { type: string }
        pricingModel: { type: string }
        durationWeeks: { type: number }
        teamMix:
          type: array
          items: { $ref: "#/components/schemas/AtelierTeamMixEntry" }
        computedCostUsd: { type: number }
        computedPriceUsd: { type: number }
        computedMarginPct: { type: number }
        targetMarginPct: { type: number }
        marginLockStatus: { $ref: "#/components/schemas/AtelierMarginLockStatus" }
        partnerOverrideId: { type: ["string", "null"] }
        partnerOverrideAt: { type: ["string", "null"], format: date-time }
        partnerOverrideRationale: { type: ["string", "null"] }
        countersignPartnerId: { type: ["string", "null"] }
        countersignAt: { type: ["string", "null"], format: date-time }
        countersignRationale: { type: ["string", "null"] }
        alternativeStructures:
          type: array
          items:
            type: object
            additionalProperties: true

