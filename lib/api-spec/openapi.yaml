      type: object
      required: [rationale]
      properties:
        rationale: { type: string, minLength: 1 }

    AtelierPricingStrategistAlternative:
      type: object
      required: [pricingModel, durationWeeks, teamMix, cost, price, marginPct, marginLockStatus, story]
      properties:
        pricingModel: { type: string }
        durationWeeks: { type: number }
        teamMix:
          type: array
          items: { $ref: "#/components/schemas/AtelierTeamMixEntry" }
        cost: { type: number }
        price: { type: number }
        marginPct: { type: number }
        marginLockStatus: { $ref: "#/components/schemas/AtelierMarginLockStatus" }
        story: { type: string }

    AtelierPricingStrategistInput:
      type: object
      description: |
        Optional spec-contract input forwarded to the Pricing Strategist.
        opportunity_id from the path takes precedence; the body fields are
        narrative + alt-selection hints. target_margin_pct (when provided)
        overrides the firm-default policy target for the duration of this run.
      properties:
        primary_intent:
          type: string
          description: e.g. "land_and_expand", "defend_margin", "displace_incumbent"
        target_margin_pct:
          type: number
          minimum: 0
          maximum: 1
        alternative_lenses:
          type: array
          items:
            type: string
            enum: [fixed_fee, outcome_based, retainer]

    AtelierPricingStrategistPrimary:
      type: object
      required: [pricingModel, durationWeeks, teamMix, cost, price, marginPct, marginLockStatus, narrative]
      properties:
        pricingModel: { type: string }
        durationWeeks: { type: number }
        teamMix:
          type: array
          items: { $ref: "#/components/schemas/AtelierTeamMixEntry" }
        cost: { type: number }
        price: { type: number }
        marginPct: { type: number }
        marginLockStatus: { $ref: "#/components/schemas/AtelierMarginLockStatus" }
        narrative: { type: string }

    AtelierPricingStrategistResult:
      type: object
      required: [runId, primary, alternatives, talkingPoints, risks, marginLockChip, partnerOverrideRequired, twoPartnerRequired, confidence]
      properties:
        runId: { type: string }
        primary: { $ref: "#/components/schemas/AtelierPricingStrategistPrimary" }
        alternatives:
          type: array
          items: { $ref: "#/components/schemas/AtelierPricingStrategistAlternative" }
        talkingPoints:
          type: array
          items: { type: string }
        risks:
          type: array
          items: { type: string }
        marginLockChip: { $ref: "#/components/schemas/AtelierMarginLockStatus" }
        partnerOverrideRequired: { type: boolean }
        twoPartnerRequired: { type: boolean }
        confidence: { $ref: "#/components/schemas/Confidence" }
        primary_pricing:
          description: Spec-canonical alias of `primary` (snake_case).
          $ref: "#/components/schemas/AtelierPricingStrategistPrimary"
        talking_points_for_partner:
          description: Spec-canonical alias of `talkingPoints` (snake_case).
          type: array
          items: { type: string }
        margin_lock_chip:
          description: Spec-canonical alias of `marginLockChip`.
          $ref: "#/components/schemas/AtelierMarginLockStatus"
        partner_override_required:
          description: Spec-canonical alias of `partnerOverrideRequired`.
          type: boolean
        two_partner_required:
          description: Spec-canonical alias of `twoPartnerRequired`.
          type: boolean

    AtelierAgentRunSummary:
      type: object
      required: [id, agentId, agentName, status, message, startedAt]
      properties:
        id: { type: string }
        agentId: { type: string }
        agentName: { type: string }
        status: { type: string, enum: [running, blocked, complete, error] }
        confidence:
          oneOf:
            - { $ref: "#/components/schemas/Confidence" }
            - { type: "null" }
        message: { type: string }
        targetType: { type: ["string", "null"] }
        targetId: { type: ["string", "null"] }
        targetLabel: { type: ["string", "null"] }
        startedAt: { type: string, format: date-time }
        progressPct: { type: ["integer", "null"] }
        sourcesCount: { type: ["integer", "null"] }
        costUsd: { type: ["number", "null"] }
        durationMs: { type: ["integer", "null"] }
