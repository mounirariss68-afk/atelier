        twoPartnerRequired: { type: boolean }
        confidence: { $ref: "#/components/schemas/Confidence" }
        primary_pricing:
          description: Spec-canonical alias of `primary` (snake_case).
          $ref: "#/components/schemas/AtelierPricingStrategistPrimary"
        talking_points_for_partner:
          description: Spec-canonical alias of `talkingPoints` (snake_case).
          type: array
          items: { type: string }
        margin_lock_chip:
          description: Spec-canonical alias of `marginLockChip`.
          $ref: "#/components/schemas/AtelierMarginLockStatus"
        partner_override_required:
          description: Spec-canonical alias of `partnerOverrideRequired`.
          type: boolean
        two_partner_required:
          description: Spec-canonical alias of `twoPartnerRequired`.
          type: boolean

