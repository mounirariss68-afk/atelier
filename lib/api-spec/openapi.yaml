        amberThresholdPct: { type: number }
        redThresholdPct: { type: number }
        twoPartnerThresholdPct: { type: number }

    AtelierMarginPolicyInput:
      type: object
      properties:
        targetMarginPct: { type: number }
        amberThresholdPct: { type: number }
        redThresholdPct: { type: number }
        twoPartnerThresholdPct: { type: number }

