openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: Site-wide AI chat assistant
  - name: atelier
    description: The Atelier — Cognirise Employee Portal
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /chat:
    post:
      operationId: chat
      tags: [chat]
      summary: Stream a reply from the Cognirise assistant
      description: |
        Streams an assistant reply as Server-Sent Events. Each `data:` payload is a
        `ChatStreamEvent` JSON object. The stream ends with an event of type `done`
        whose `suggestions` field contains optional follow-up links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: SSE stream of ChatStreamEvent JSON payloads
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatError"

  /atelier/me:
    get:
      operationId: atelierGetMe
      tags: [atelier]
      summary: Current persona for The Atelier session
      responses:
        "200":
          description: Current persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierPersona"
  /atelier/me/profile:
    get:
      operationId: atelierGetMyProfile
      tags: [atelier]
      summary: Me lens — the caller's own persona + roster record (self-scope)
      responses:
        "200":
          description: Self profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierSelfProfile"
    patch:
      operationId: atelierUpdateMyProfile
      tags: [atelier]
      summary: Me lens — edit the caller's own personal fields (self-scope)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierSelfProfilePatch"
      responses:
        "200":
          description: Updated self person record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierSelfProfilePatchResponse"
  /atelier/me/documents:
    post:
      operationId: atelierCreateMyDocument
      tags: [atelier]
      summary: Me lens — record a new ID/residency document (optional scan upload)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, title]
              properties:
                kind: { type: string, enum: [passport, national_id, residency, visa, dependent_doc, other] }
                title: { type: string, maxLength: 200 }
                docNumber: { type: string, maxLength: 100 }
                issuedAt: { type: string, format: date }
                expiresAt: { type: string, format: date }
                issuingCountry: { type: string, maxLength: 100 }
                dependentId: { type: string }
                notes: { type: string, maxLength: 2000 }
                file: { type: string, format: binary, description: "PDF/JPEG/PNG/WebP scan, ≤15 MB" }
      responses:
        "201":
          description: Created document (expiry countdown included)
          content:
            application/json:
              schema:
                type: object
                required: [document]
                properties:
                  document: { $ref: "#/components/schemas/AtelierSelfDocument" }
    get:
      operationId: atelierListMyDocuments
      tags: [atelier]
      summary: Me lens — the caller's own ID/residency documents (self-scope)
      responses:
        "200":
          description: Own documents, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierSelfDocumentList"
  /atelier/me/documents/{id}:
    patch:
      operationId: atelierUpdateMyDocument
      tags: [atelier]
      summary: Me lens — edit details of one of the caller's own documents
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierSelfDocumentPatch"
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                type: object
                required: [document]
                properties:
                  document: { $ref: "#/components/schemas/AtelierSelfDocument" }
    delete:
      operationId: atelierDeleteMyDocument
      tags: [atelier]
      summary: Me lens — remove one of the caller's own documents
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierOkResponse"
  /atelier/me/documents/{id}/file:
    post:
      operationId: atelierReplaceMyDocumentScan
      tags: [atelier]
      summary: Me lens — replace/attach the scan on an existing own document
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "PDF/JPEG/PNG/WebP scan, ≤15 MB" }
      responses:
        "200":
          description: Document with the new scan attached
          content:
            application/json:
              schema:
                type: object
                required: [document]
                properties:
                  document: { $ref: "#/components/schemas/AtelierSelfDocument" }
  /atelier/me/documents/{id}/download:
    get:
      operationId: atelierDownloadMyDocument
      tags: [atelier]
      summary: Me lens — stream the scan of one of the caller's own documents
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The stored scan bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /atelier/documents:
    get:
      operationId: atelierListDocuments
      tags: [atelier]
      summary: Document Library — list documents visible to the caller (ACL-filtered)
      parameters:
        - name: accountId
          in: query
          required: false
          schema: { type: string }
        - name: engagementId
          in: query
          required: false
          schema: { type: string }
        - name: category
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Visible documents, most recently updated first
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                properties:
                  documents:
                    type: array
                    items: { $ref: "#/components/schemas/AtelierLibraryDocument" }
    post:
      operationId: atelierCreateDocument
      tags: [atelier]
      summary: Document Library — upload a new document (multipart)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, file]
              properties:
                title: { type: string, maxLength: 200 }
                category: { type: string, enum: [proposal, client_deliverable, contract, template, other] }
                accountId: { type: string }
                engagementId: { type: string }
                notes: { type: string, maxLength: 2000 }
                aiRetrieval: { type: string, enum: ["true", "false"] }
                file: { type: string, format: binary, description: "Document file, ≤50 MB" }
      responses:
        "201":
          description: Created document with its first version
          content:
            application/json:
              schema:
                type: object
                required: [document]
                properties:
                  document: { $ref: "#/components/schemas/AtelierLibraryDocument" }
                  rag: { $ref: "#/components/schemas/AtelierLibraryRagResult" }
  /atelier/documents/{id}:
    get:
      operationId: atelierGetDocument
      tags: [atelier]
      summary: Document Library — one document with versions, grants and audit trail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Document detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierLibraryDocumentDetail"
    patch:
      operationId: atelierUpdateDocument
      tags: [atelier]
      summary: Document Library — edit title/category/notes or flip the AI-retrieval toggle
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                category: { type: string, enum: [proposal, client_deliverable, contract, template, other] }
                notes: { type: string, maxLength: 2000, nullable: true }
                aiRetrieval: { type: boolean }
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                type: object
                required: [document]
                properties:
                  document: { $ref: "#/components/schemas/AtelierLibraryDocument" }
    delete:
      operationId: atelierDeleteDocument
      tags: [atelier]
      summary: Document Library — delete a document (purges blobs, versions and embeddings)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [status, id]
                properties:
                  status: { type: string }
                  id: { type: string }
  /atelier/documents/{id}/versions:
    post:
      operationId: atelierUploadDocumentVersion
      tags: [atelier]
      summary: Document Library — upload a new version (supersedes prior version in retrieval)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "Document file, ≤50 MB" }
      responses:
        "201":
          description: Created version
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { $ref: "#/components/schemas/AtelierLibraryDocumentVersion" }
                  rag: { $ref: "#/components/schemas/AtelierLibraryRagResult" }
  /atelier/documents/{id}/download:
    get:
      operationId: atelierDownloadDocument
      tags: [atelier]
      summary: Document Library — stream a version's bytes (defaults to the current version)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: versionId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The stored document bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /atelier/documents/{id}/access:
    post:
      operationId: atelierGrantDocumentAccess
      tags: [atelier]
      summary: Document Library — grant a person access to an org-level document
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        "201":
          description: Granted
          content:
            application/json:
              schema:
                type: object
                required: [status, userId]
                properties:
                  status: { type: string }
                  userId: { type: string }
  /atelier/documents/{id}/access/{userId}:
    delete:
      operationId: atelierRevokeDocumentAccess
      tags: [atelier]
      summary: Document Library — revoke a person's access grant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                required: [status, userId]
                properties:
                  status: { type: string }
                  userId: { type: string }
  /atelier/me/photo:
    post:
      operationId: atelierUploadMyPhoto
      tags: [atelier]
      summary: Me lens — upload/replace the caller's own profile photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "JPEG/PNG/WebP, ≤8 MB" }
      responses:
        "200":
          description: New avatar URL
          content:
            application/json:
              schema:
                type: object
                required: [avatarUrl]
                properties:
                  avatarUrl: { type: string }
  /atelier/me/dependents:
    get:
      operationId: atelierListMyDependents
      tags: [atelier]
      summary: Me lens — the caller's own dependents (self-scope)
      responses:
        "200":
          description: Own dependents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierDependentList"
    post:
      operationId: atelierCreateMyDependent
      tags: [atelier]
      summary: Me lens — add a dependent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierDependentInput"
      responses:
        "201":
          description: Created dependent
          content:
            application/json:
              schema:
                type: object
                required: [dependent]
                properties:
                  dependent: { $ref: "#/components/schemas/AtelierDependent" }
  /atelier/me/dependents/{id}:
    patch:
      operationId: atelierUpdateMyDependent
      tags: [atelier]
      summary: Me lens — edit one of the caller's own dependents
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierDependentInput"
      responses:
        "200":
          description: Updated dependent
          content:
            application/json:
              schema:
                type: object
                required: [dependent]
                properties:
                  dependent: { $ref: "#/components/schemas/AtelierDependent" }
    delete:
      operationId: atelierDeleteMyDependent
      tags: [atelier]
      summary: Me lens — remove one of the caller's own dependents
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted (its documents are removed too)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierOkResponse"
  /atelier/me/emergency-contacts:
    get:
      operationId: atelierListMyEmergencyContacts
      tags: [atelier]
      summary: Me lens — the caller's own emergency contacts (self-scope)
      responses:
        "200":
          description: Own emergency contacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierEmergencyContactList"
    post:
      operationId: atelierCreateMyEmergencyContact
      tags: [atelier]
      summary: Me lens — add an emergency contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierEmergencyContactInput"
      responses:
        "201":
          description: Created emergency contact
          content:
            application/json:
              schema:
                type: object
                required: [contact]
                properties:
                  contact: { $ref: "#/components/schemas/AtelierEmergencyContact" }
  /atelier/me/emergency-contacts/{id}:
    patch:
      operationId: atelierUpdateMyEmergencyContact
      tags: [atelier]
      summary: Me lens — edit one of the caller's own emergency contacts
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierEmergencyContactInput"
      responses:
        "200":
          description: Updated emergency contact
          content:
            application/json:
              schema:
                type: object
                required: [contact]
                properties:
                  contact: { $ref: "#/components/schemas/AtelierEmergencyContact" }
    delete:
      operationId: atelierDeleteMyEmergencyContact
      tags: [atelier]
      summary: Me lens — remove one of the caller's own emergency contacts
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierOkResponse"
  /atelier/roster/people/{id}/personal:
    get:
      operationId: atelierGetRosterPersonPersonal
      tags: [atelier]
      summary: HR — personal-data view (dependents, emergency contacts, contact fields)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Personal data (owner or personnel-contract viewers only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierRosterPersonalView"
  /atelier/me/notifications:
    get:
      operationId: atelierListMyNotifications
      tags: [atelier]
      summary: Me lens — the caller's own self-service notification cards
      responses:
        "200":
          description: Active (non-dismissed) self notifications, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierSelfNotification"
  /atelier/me/notifications/{id}/dismiss:
    post:
      operationId: atelierDismissMyNotification
      tags: [atelier]
      summary: Me lens — dismiss one of the caller's own notification cards
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The dismissed notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierSelfNotification"
  /atelier/me/approvals:
    get:
      operationId: atelierGetMyApprovals
      tags: [atelier]
      summary: Me lens — pending items waiting on the caller's approval
      description: |
        Digest of submitted timesheets, pending leave requests and submitted
        expense claims that THIS caller may decide. Scoping mirrors the real
        decision gates (org-chart leave routing, engagement-scoped senior
        managers, no self-approval). Non-approver personas get total=0.
      responses:
        "200":
          description: Pending-approvals digest for the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierMyApprovals"
  /atelier/me/pay:
    get:
      operationId: atelierGetMyPay
      tags: [atelier]
      summary: Me lens — the caller's own Pay & Benefits bundle (self-scope)
      description: |
        Published pay/benefit documents, compensation summary, insurance
        scheme details, masked bank details and bank-change requests — all
        strictly for the signed-in person. File downloads go through
        `/api/atelier/me/pay/documents/{id}/download` (owner-gated).
      responses:
        "200":
          description: Self pay & benefits bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierMyPay"
  /atelier/me/performance:
    get:
      operationId: atelierGetMyPerformance
      tags: [atelier]
      summary: Me lens — the caller's own utilization + review posture (self-scope)
      responses:
        "200":
          description: Own performance snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierMyPerformance"
  /atelier/me/pay/bank-change-request:
    post:
      operationId: atelierCreateBankChangeRequest
      tags: [atelier]
      summary: Me lens — request a change to own payment details (HR must approve)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierBankChangeRequestInput"
      responses:
        "201":
          description: Pending change request (masked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierBankChangeRequest"
        "400":
          description: Invalid IBAN, no employee roster record, or a request is already pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierError"
  /atelier/me/reviews:
    get:
      operationId: atelierListMyReviews
      tags: [atelier]
      summary: Me lens — the caller's own RELEASED performance reviews (employees only)
      responses:
        "200":
          description: Released reviews for the caller's own employee record
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierSelfReview"
        "403":
          description: Contractors have no performance-review section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierError"
  /atelier/me/goals:
    get:
      operationId: atelierListMyGoals
      tags: [atelier]
      summary: Me lens — the caller's own goals (employees only)
      responses:
        "200":
          description: Goals for the caller's own employee record
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierSelfGoal"
        "403":
          description: Contractors have no performance section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierError"
  /atelier/me/learning:
    get:
      operationId: atelierListMyLearning
      tags: [atelier]
      summary: Me lens — training materials targeted at the caller
      responses:
        "200":
          description: Audience-filtered materials with own completion status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierSelfTrainingMaterial"
  /atelier/me/learning/{id}/complete:
    post:
      operationId: atelierCompleteMyTraining
      tags: [atelier]
      summary: Me lens — mark a training material as completed (idempotent)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The material with updated completion status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierSelfTrainingMaterial"
        "404":
          description: Not found or not targeted at the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierError"
  /atelier/people/performance/reviews:
    get:
      operationId: atelierListPerformanceReviews
      tags: [atelier]
      summary: HR — list performance reviews (drafts + released)
      parameters:
        - in: query
          name: employeeId
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Reviews with employee names
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierPerformanceReview"
    post:
      operationId: atelierCreatePerformanceReview
      tags: [atelier]
      summary: HR — create a draft performance review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierPerformanceReviewInput"
      responses:
        "201":
          description: Created draft review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierPerformanceReview"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierError"
  /atelier/roster/pay/people/{personId}/documents:
    get:
      operationId: atelierListPersonPayDocuments
      tags: [atelier]
      summary: HR — all pay/benefit documents for one person (incl. unpublished)
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Documents, newest period first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierPayDocumentAdmin"
        "404":
          description: Person not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierError"
  /atelier/roster/pay/documents/{docId}/publish:
    post:
      operationId: atelierPublishPayDocument
      tags: [atelier]
