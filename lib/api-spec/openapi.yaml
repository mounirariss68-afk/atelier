openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: Site-wide AI chat assistant
  - name: atelier
    description: The Atelier — AICo Employee Portal
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /chat:
    post:
      operationId: chat
      tags: [chat]
      summary: Stream a reply from the Cognirise assistant
      description: |
        Streams an assistant reply as Server-Sent Events. Each `data:` payload is a
        `ChatStreamEvent` JSON object. The stream ends with an event of type `done`
        whose `suggestions` field contains optional follow-up links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: SSE stream of ChatStreamEvent JSON payloads
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatError"

  /atelier/me:
    get:
      operationId: atelierGetMe
      tags: [atelier]
      summary: Current persona for The Atelier session
      responses:
        "200":
          description: Current persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierPersona"
  /atelier/personas:
    get:
      operationId: atelierListPersonas
      tags: [atelier]
      summary: List the seeded personas (Partner, Lead, SME, Engineer, BD)
      responses:
        "200":
          description: All seeded personas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierPersona"
  /atelier/users:
    get:
      operationId: atelierListUsers
      tags: [atelier]
      summary: List active atelier_users (for owner pickers etc.)
      responses:
        "200":
          description: Active atelier users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierPersona"
  /atelier/personas/switch:
    post:
      operationId: atelierSwitchPersona
      tags: [atelier]
      summary: Switch the active persona (mock auth for MVP shell)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierPersonaSwitchInput"
      responses:
        "200":
          description: Active persona after switch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierPersona"

  /atelier/home:
    get:
      operationId: atelierGetHome
      tags: [atelier]
      summary: The Atelier Home — Pane A / B / C bundle for the active persona
      responses:
        "200":
          description: Home dashboard payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierHome"

  /atelier/activity:
    get:
      operationId: atelierGetActivity
      tags: [atelier]
      summary: Persistent Agent Activity Stream (right rail)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent agent activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentActivityItem"

  /atelier/opportunities:
    get:
      operationId: atelierListOpportunities
      tags: [atelier]
      summary: All opportunities across PLM stages
      responses:
        "200":
          description: Opportunities with stage + account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Opportunity"
    post:
      operationId: atelierCreateOpportunity
      tags: [atelier]
      summary: Create a new opportunity (Pursuit Scout auto-runs)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierCreateOpportunityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierCreateOpportunityResponse"
  /atelier/opportunities/{oppId}:
    get:
      operationId: atelierGetOpportunity
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Single opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierError"
  /atelier/opportunities/{oppId}/stage:
    patch:
      operationId: atelierUpdateOpportunityStage
      tags: [atelier]
      summary: Move opportunity to a new PLM stage (5C gate enforced for `pursue`)
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierStageChangeInput"
      responses:
        "200":
          description: Updated opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
        "412":
          description: Gate not satisfied (5C qualifier missing or no_go)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierError"
  /atelier/opportunities/{oppId}/stage-transition:
    post:
      operationId: atelierCreateStageTransition
      tags: [atelier]
      summary: Move opportunity to a new sales stage with rationale + evidence
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierStageTransitionInput"
      responses:
        "200":
          description: Updated opportunity with new transition row
          content:
            application/json:
              schema:
                type: object
                required: [opportunity, transition]
                properties:
                  opportunity: { $ref: "#/components/schemas/Opportunity" }
                  transition: { $ref: "#/components/schemas/OpportunityStageTransition" }
        "412":
          description: Stage gate not satisfied (e.g. 5C missing for late stages)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierError"
  /atelier/opportunities/{oppId}/stage-history:
    get:
      operationId: atelierGetStageHistory
      tags: [atelier]
      summary: Stage transition history for an opportunity (most recent first)
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Transitions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OpportunityStageTransition" }
  /atelier/pipeline/forecast:
    get:
      operationId: atelierGetPipelineForecast
      tags: [atelier]
      summary: Weighted-pipeline + stage bucket roll-up (Pipeline Forecaster output)
      responses:
        "200":
          description: Forecast summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineForecastSummary"
  /atelier/pipeline/forecast/run:
    post:
      operationId: atelierRunPipelineForecaster
      tags: [atelier]
      summary: Trigger Pipeline Forecaster agent run (refreshes summary + flags stalled)
      responses:
        "200":
          description: Forecast summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineForecastSummary"
  /atelier/opportunities/{oppId}/qualifier:
    get:
      operationId: atelierGetQualifier
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 5C qualifier + go/no-go decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierQualifier"
    post:
      operationId: atelierSubmitQualifier
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierQualifierInput"
      responses:
        "200":
          description: Persisted qualifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierQualifier"
  /atelier/opportunities/{oppId}/brief:
    get:
      operationId: atelierGetBrief
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Latest Pursuit Scout brief, or null when never run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierBriefEnvelope"
  /atelier/opportunities/{oppId}/scout:
    post:
      operationId: atelierRunPursuitScout
      tags: [atelier]
      summary: (Re)run Pursuit Scout for an opportunity
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierScoutInput"
      responses:
        "200":
          description: Scout brief (synchronously synthesised)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierBriefEnvelope"
  /atelier/opportunities/{oppId}/research:
    get:
      operationId: atelierListResearchFacts
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: All research facts (promoted + unpromoted)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierResearchFact"
  /atelier/opportunities/{oppId}/research/{factId}/promote:
    post:
      operationId: atelierPromoteResearchFact
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
        - in: path
          name: factId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierPromoteFactInput"
      responses:
        "200":
          description: Updated fact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierResearchFact"
  /atelier/opportunities/{oppId}/povs:
    get:
      operationId: atelierListPovs
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: POVs for this opportunity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierPov"
    post:
      operationId: atelierStartPov
      tags: [atelier]
      summary: Start a POV — generates outline (POV Author phase A)
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierStartPovInput"
      responses:
        "201":
          description: POV with outline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierPov"
  /atelier/povs/{povId}/draft:
    post:
      operationId: atelierDraftPov
      tags: [atelier]
      summary: Generate full draft after outline approval (Phases B/C/D)
      parameters:
        - in: path
          name: povId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: New POV version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierPovVersion"
  /atelier/povs/{povId}/versions:
    get:
      operationId: atelierListPovVersions
      tags: [atelier]
      parameters:
        - in: path
          name: povId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: All versions of this POV
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierPovVersion"
  /atelier/opportunities/{oppId}/meetings:
    get:
      operationId: atelierListOpportunityMeetings
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: All meetings on this opportunity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierMeeting"
    post:
      operationId: atelierSubmitMeeting
      tags: [atelier]
      summary: Paste/upload a transcript and run Meeting Scribe
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierSubmitMeetingInput"
      responses:
        "201":
          description: Created meeting with structured output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierMeeting"
  /atelier/agent-runs/{runId}:
    get:
      operationId: atelierGetAgentRun
      tags: [atelier]
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Run details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierAgentRunDetail"
  /atelier/agent-runs/{runId}/decision:
    post:
      operationId: atelierRecordAgentDecision
      tags: [atelier]
      summary: Record an Approve / Edit / Reject checkpoint decision
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierAgentDecisionInput"
      responses:
        "200":
          description: Updated run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierAgentRunDetail"

  /atelier/engagements:
    get:
      operationId: atelierListEngagements
      tags: [atelier]
      summary: Active engagements
      responses:
        "200":
          description: Engagements with stage + account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Engagement"
  /atelier/engagements/{engId}:
    get:
      operationId: atelierGetEngagement
      tags: [atelier]
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Single engagement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Engagement"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierError"

  # ---- Charter (Charter Architect) -------------------------------
  /atelier/engagements/{engId}/charter/versions:
    get:
      operationId: atelierListCharterVersions
      tags: [atelier]
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Charter versions, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AtelierCharterVersion" }
  /atelier/engagements/{engId}/charter/redraft:
    post:
      operationId: atelierRedraftCharter
      tags: [atelier]
      summary: Run Charter Architect to draft a new charter version
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtelierCharterRedraftInput" }
      responses:
        "200":
          description: New version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierCharterVersion" }
  /atelier/engagements/{engId}/charter/versions/{versionId}/approve:
    post:
      operationId: atelierApproveCharterVersion
      tags: [atelier]
      summary: Approve a charter version (lead or partner)
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
        - in: path
          name: versionId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtelierCharterApproveInput" }
      responses:
        "200":
          description: Updated version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierCharterVersion" }

  # ---- RAID -------------------------------------------------------
  /atelier/engagements/{engId}/raid:
    get:
      operationId: atelierListRaid
      tags: [atelier]
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: RAID items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AtelierRaidItem" }
    post:
      operationId: atelierCreateRaidItem
      tags: [atelier]
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtelierRaidItemInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierRaidItem" }
  /atelier/engagements/{engId}/raid/{raidId}:
    patch:
      operationId: atelierUpdateRaidItem
      tags: [atelier]
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
        - in: path
          name: raidId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtelierRaidItemPatch" }
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierRaidItem" }

  # ---- Hypothesis tree -------------------------------------------
  /atelier/engagements/{engId}/hypothesis-tree:
    get:
      operationId: atelierGetHypothesisTree
      tags: [atelier]
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Hypothesis tree (root)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierHypothesisTree" }

  # ---- Deliverables (incl. Diagnostic Memo) -----------------------
  /atelier/engagements/{engId}/deliverables:
    get:
      operationId: atelierListDeliverables
      tags: [atelier]
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deliverables
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AtelierDeliverable" }
    post:
      operationId: atelierCreateDeliverable
      tags: [atelier]
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtelierDeliverableInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierDeliverable" }
  /atelier/deliverables/{delId}:
    get:
      operationId: atelierGetDeliverable
      tags: [atelier]
      parameters:
        - in: path
          name: delId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deliverable detail (with versions)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierDeliverableDetail" }
  /atelier/deliverables/{delId}/draft:
    post:
      operationId: atelierDraftDeliverable
      tags: [atelier]
      summary: Append a new version (scaffolds from hypothesis tree if no body)
      parameters:
        - in: path
          name: delId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtelierDeliverableDraftInput" }
      responses:
        "200":
          description: New version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierDeliverableVersion" }
  /atelier/deliverables/{delId}/critique:
    post:
      operationId: atelierCritiqueDeliverable
      tags: [atelier]
      summary: Run Synthesis Critic on the current version
      parameters:
        - in: path
          name: delId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtelierCritiqueInput" }
      responses:
        "200":
          description: Critic output + updated readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierCritiqueResult" }
  /atelier/deliverables/{delId}/send:
    post:
      operationId: atelierSendDeliverable
      tags: [atelier]
      summary: Send to client (Partner Authority Lock — green or override)
      parameters:
        - in: path
          name: delId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtelierSendDeliverableInput" }
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierDeliverable" }
        "423":
          description: Locked — readiness not green and no override rationale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierError" }

  # ---- Artifacts (per engagement, bilingual) ---------------------
  /atelier/engagements/{engId}/artifacts:
    get:
      operationId: atelierListArtifacts
      tags: [atelier]
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Artifacts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AtelierArtifact" }
    post:
      operationId: atelierCreateArtifact
      tags: [atelier]
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtelierArtifactInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierArtifact" }
  /atelier/artifacts/{artifactId}/translate:
    post:
      operationId: atelierTranslateArtifact
      tags: [atelier]
      summary: Stub-translate an artifact (AR↔EN); preserves original
      parameters:
        - in: path
          name: artifactId
