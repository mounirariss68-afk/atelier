openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: Site-wide AI chat assistant
  - name: atelier
    description: The Atelier — AICo Employee Portal
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /chat:
    post:
      operationId: chat
      tags: [chat]
      summary: Stream a reply from the Maven AI assistant
      description: |
        Streams an assistant reply as Server-Sent Events. Each `data:` payload is a
        `ChatStreamEvent` JSON object. The stream ends with an event of type `done`
        whose `suggestions` field contains optional follow-up links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: SSE stream of ChatStreamEvent JSON payloads
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatError"

  /atelier/me:
    get:
      operationId: atelierGetMe
      tags: [atelier]
      summary: Current persona for The Atelier session
      responses:
        "200":
          description: Current persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierPersona"
  /atelier/personas:
    get:
      operationId: atelierListPersonas
      tags: [atelier]
      summary: List the seeded personas (Partner, Lead, SME, Engineer, BD)
      responses:
        "200":
          description: All seeded personas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierPersona"
  /atelier/personas/switch:
    post:
      operationId: atelierSwitchPersona
      tags: [atelier]
      summary: Switch the active persona (mock auth for MVP shell)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierPersonaSwitchInput"
      responses:
        "200":
          description: Active persona after switch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierPersona"

  /atelier/home:
    get:
      operationId: atelierGetHome
      tags: [atelier]
      summary: The Atelier Home — Pane A / B / C bundle for the active persona
      responses:
        "200":
          description: Home dashboard payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierHome"

  /atelier/activity:
    get:
      operationId: atelierGetActivity
      tags: [atelier]
      summary: Persistent Agent Activity Stream (right rail)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent agent activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentActivityItem"

  /atelier/opportunities:
    get:
      operationId: atelierListOpportunities
      tags: [atelier]
      summary: All opportunities across PLM stages
      responses:
        "200":
          description: Opportunities with stage + account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Opportunity"
    post:
      operationId: atelierCreateOpportunity
      tags: [atelier]
      summary: Create a new opportunity (Pursuit Scout auto-runs)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierCreateOpportunityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierCreateOpportunityResponse"
  /atelier/opportunities/{oppId}:
    get:
      operationId: atelierGetOpportunity
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Single opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierError"
  /atelier/opportunities/{oppId}/stage:
    patch:
      operationId: atelierUpdateOpportunityStage
      tags: [atelier]
      summary: Move opportunity to a new PLM stage (5C gate enforced for `pursue`)
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierStageChangeInput"
      responses:
        "200":
          description: Updated opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
        "412":
          description: Gate not satisfied (5C qualifier missing or no_go)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierError"
  /atelier/opportunities/{oppId}/qualifier:
    get:
      operationId: atelierGetQualifier
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 5C qualifier + go/no-go decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierQualifier"
    post:
      operationId: atelierSubmitQualifier
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierQualifierInput"
      responses:
        "200":
          description: Persisted qualifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierQualifier"
  /atelier/opportunities/{oppId}/brief:
    get:
      operationId: atelierGetBrief
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Latest Pursuit Scout brief, or null when never run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierBriefEnvelope"
  /atelier/opportunities/{oppId}/scout:
    post:
      operationId: atelierRunPursuitScout
      tags: [atelier]
      summary: (Re)run Pursuit Scout for an opportunity
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierScoutInput"
      responses:
        "200":
          description: Scout brief (synchronously synthesised)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierBriefEnvelope"
  /atelier/opportunities/{oppId}/research:
    get:
      operationId: atelierListResearchFacts
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: All research facts (promoted + unpromoted)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierResearchFact"
  /atelier/opportunities/{oppId}/research/{factId}/promote:
    post:
      operationId: atelierPromoteResearchFact
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
        - in: path
          name: factId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierPromoteFactInput"
      responses:
        "200":
          description: Updated fact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierResearchFact"
  /atelier/opportunities/{oppId}/povs:
    get:
      operationId: atelierListPovs
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: POVs for this opportunity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierPov"
    post:
      operationId: atelierStartPov
      tags: [atelier]
      summary: Start a POV — generates outline (POV Author phase A)
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierStartPovInput"
      responses:
        "201":
          description: POV with outline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierPov"
  /atelier/povs/{povId}/draft:
    post:
      operationId: atelierDraftPov
      tags: [atelier]
      summary: Generate full draft after outline approval (Phases B/C/D)
      parameters:
        - in: path
          name: povId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: New POV version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierPovVersion"
  /atelier/povs/{povId}/versions:
    get:
      operationId: atelierListPovVersions
      tags: [atelier]
      parameters:
        - in: path
          name: povId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: All versions of this POV
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierPovVersion"
  /atelier/opportunities/{oppId}/meetings:
    get:
      operationId: atelierListOpportunityMeetings
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: All meetings on this opportunity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierMeeting"
    post:
      operationId: atelierSubmitMeeting
      tags: [atelier]
      summary: Paste/upload a transcript and run Meeting Scribe
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierSubmitMeetingInput"
      responses:
        "201":
          description: Created meeting with structured output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierMeeting"
  /atelier/agent-runs/{runId}:
    get:
      operationId: atelierGetAgentRun
      tags: [atelier]
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Run details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierAgentRunDetail"
  /atelier/agent-runs/{runId}/decision:
    post:
      operationId: atelierRecordAgentDecision
      tags: [atelier]
      summary: Record an Approve / Edit / Reject checkpoint decision
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierAgentDecisionInput"
      responses:
        "200":
          description: Updated run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierAgentRunDetail"

  /atelier/engagements:
    get:
      operationId: atelierListEngagements
      tags: [atelier]
      summary: Active engagements
      responses:
        "200":
          description: Engagements with stage + account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Engagement"
  /atelier/engagements/{engId}:
    get:
      operationId: atelierGetEngagement
      tags: [atelier]
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Single engagement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Engagement"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierError"

  # ---- Charter (Charter Architect) -------------------------------
  /atelier/engagements/{engId}/charter/versions:
    get:
      operationId: atelierListCharterVersions
      tags: [atelier]
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Charter versions, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AtelierCharterVersion" }
  /atelier/engagements/{engId}/charter/redraft:
    post:
      operationId: atelierRedraftCharter
      tags: [atelier]
      summary: Run Charter Architect to draft a new charter version
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtelierCharterRedraftInput" }
      responses:
        "200":
          description: New version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierCharterVersion" }
  /atelier/engagements/{engId}/charter/versions/{versionId}/approve:
    post:
      operationId: atelierApproveCharterVersion
      tags: [atelier]
      summary: Approve a charter version (lead or partner)
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
        - in: path
          name: versionId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtelierCharterApproveInput" }
      responses:
        "200":
          description: Updated version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierCharterVersion" }

  # ---- RAID -------------------------------------------------------
  /atelier/engagements/{engId}/raid:
    get:
      operationId: atelierListRaid
      tags: [atelier]
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: RAID items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AtelierRaidItem" }
    post:
      operationId: atelierCreateRaidItem
      tags: [atelier]
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtelierRaidItemInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierRaidItem" }
  /atelier/engagements/{engId}/raid/{raidId}:
    patch:
      operationId: atelierUpdateRaidItem
      tags: [atelier]
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
        - in: path
          name: raidId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtelierRaidItemPatch" }
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierRaidItem" }

  # ---- Hypothesis tree -------------------------------------------
  /atelier/engagements/{engId}/hypothesis-tree:
    get:
      operationId: atelierGetHypothesisTree
      tags: [atelier]
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Hypothesis tree (root)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierHypothesisTree" }

  # ---- Deliverables (incl. Diagnostic Memo) -----------------------
  /atelier/engagements/{engId}/deliverables:
    get:
      operationId: atelierListDeliverables
      tags: [atelier]
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deliverables
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AtelierDeliverable" }
    post:
      operationId: atelierCreateDeliverable
      tags: [atelier]
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtelierDeliverableInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierDeliverable" }
  /atelier/deliverables/{delId}:
    get:
      operationId: atelierGetDeliverable
      tags: [atelier]
      parameters:
        - in: path
          name: delId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deliverable detail (with versions)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierDeliverableDetail" }
  /atelier/deliverables/{delId}/draft:
    post:
      operationId: atelierDraftDeliverable
      tags: [atelier]
      summary: Append a new version (scaffolds from hypothesis tree if no body)
      parameters:
        - in: path
          name: delId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtelierDeliverableDraftInput" }
      responses:
        "200":
          description: New version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierDeliverableVersion" }
  /atelier/deliverables/{delId}/critique:
    post:
      operationId: atelierCritiqueDeliverable
      tags: [atelier]
      summary: Run Synthesis Critic on the current version
      parameters:
        - in: path
          name: delId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtelierCritiqueInput" }
      responses:
        "200":
          description: Critic output + updated readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierCritiqueResult" }
  /atelier/deliverables/{delId}/send:
    post:
      operationId: atelierSendDeliverable
      tags: [atelier]
      summary: Send to client (Partner Authority Lock — green or override)
      parameters:
        - in: path
          name: delId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtelierSendDeliverableInput" }
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierDeliverable" }
        "423":
          description: Locked — readiness not green and no override rationale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierError" }

  # ---- Artifacts (per engagement, bilingual) ---------------------
  /atelier/engagements/{engId}/artifacts:
    get:
      operationId: atelierListArtifacts
      tags: [atelier]
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Artifacts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AtelierArtifact" }
    post:
      operationId: atelierCreateArtifact
      tags: [atelier]
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtelierArtifactInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierArtifact" }
  /atelier/artifacts/{artifactId}/translate:
    post:
      operationId: atelierTranslateArtifact
      tags: [atelier]
      summary: Stub-translate an artifact (AR↔EN); preserves original
      parameters:
        - in: path
          name: artifactId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Translated artifact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierArtifact" }

  /atelier/accounts:
    get:
      operationId: atelierListAccounts
      tags: [atelier]
      summary: Firm accounts
      responses:
        "200":
          description: All accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"

  /atelier/agents:
    get:
      operationId: atelierListAgents
      tags: [atelier]
      summary: The full agent catalog (22 named agents)
      responses:
        "200":
          description: Agent registry
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentCatalogEntry"

  /atelier/assets:
    get:
      operationId: atelierListAssets
      tags: [atelier]
      summary: Knowledge Atelier reusable assets
      responses:
        "200":
          description: Reusable assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierAsset"

  /atelier/audit:
    get:
      operationId: atelierListAudit
      tags: [atelier]
      summary: Append-only audit feed for an entity
      parameters:
        - in: query
          name: entityType
          schema:
            type: string
            enum: [opportunity, engagement, deliverable, agent_run, atelier]
        - in: query
          name: entityId
          schema: { type: string }
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Audit events (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"

  # ============================================================
  # Task #223 — Processes / Agent Designs / Prototypes / Proposals
  # ============================================================
  /atelier/engagements/{engId}/processes:
    get:
      operationId: atelierListProcesses
      tags: [atelier]
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Captured processes for the engagement
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AtelierProcess" }
    post:
      operationId: atelierAnalyzeProcess
      tags: [atelier]
      summary: Run Agent Architect on a captured process
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtelierAnalyzeProcessInput" }
      responses:
        "201":
          description: Process + candidate agent designs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierAnalyzeProcessResponse" }
  /atelier/engagements/{engId}/agent-designs:
    get:
      operationId: atelierListAgentDesigns
      tags: [atelier]
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Candidate agent designs for the engagement
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AtelierAgentDesign" }
  /atelier/engagements/{engId}/agent-designs/{designId}/approve:
    post:
      operationId: atelierApproveAgentDesign
      tags: [atelier]
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
        - in: path
          name: designId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated design
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierAgentDesign" }
  /atelier/opportunities/{oppId}/prototypes:
    get:
      operationId: atelierListPrototypes
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Prototypes for the opportunity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AtelierPrototype" }
  /atelier/opportunities/{oppId}/prototype:
    post:
      operationId: atelierForgePrototype
      tags: [atelier]
      summary: Run Prototype Forge to produce a Replit-ready prompt
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtelierForgePrototypeInput" }
      responses:
        "201":
          description: Created prototype
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierForgePrototypeResponse" }
  /atelier/opportunities/{oppId}/proposal:
    get:
      operationId: atelierGetProposal
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Latest proposal + sections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierProposalDetail" }
        "404":
          description: No proposal yet
    post:
      operationId: atelierComposeProposal
      tags: [atelier]
      summary: Run Proposal Composer
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtelierComposeProposalInput" }
      responses:
        "201":
          description: Created proposal + sections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierProposalDetail" }
  /atelier/proposal-sections/{sectionId}/approve:
    post:
      operationId: atelierApproveProposalSection
      tags: [atelier]
      parameters:
        - in: path
          name: sectionId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated section
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtelierProposalSection" }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ChatMessage:
      type: object
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, minLength: 1, maxLength: 4000 }
      required: [role, content]
    ChatRequest:
      type: object
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 24
          items:
            $ref: "#/components/schemas/ChatMessage"
        language:
          type: string
          enum: [en, ar]
          default: en
      required: [messages]
    ChatSuggestion:
      type: object
      properties:
        kind: { type: string, enum: [service, insight, assessment, industry, page] }
        href: { type: string }
        label: { type: string }
      required: [kind, href, label]
    ChatStreamEvent:
      type: object
      properties:
        type: { type: string, enum: [token, done, error] }
        token: { type: string }
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/ChatSuggestion"
        message: { type: string }
      required: [type]
    ChatError:
      type: object
      properties:
        error: { type: string }
        retryAfterSeconds: { type: number }
      required: [error]

    # ===================== ATELIER =====================
    AtelierError:
      type: object
      properties:
        error: { type: string }
        reason: { type: ["string", "null"] }
        readiness: { type: ["string", "null"] }
      required: [error]

    AtelierPersonaRole:
      type: string
      enum: [partner, engagement_lead, sme, ai_engineer, business_developer]

    AtelierPersona:
      type: object
      required: [id, name, email, role, roleLabel, title, initials]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/AtelierPersonaRole" }
        roleLabel: { type: string }
        title: { type: string }
        initials: { type: string }
        avatarUrl: { type: ["string", "null"] }

    AtelierPersonaSwitchInput:
      type: object
      required: [personaId]
      properties:
        personaId: { type: string }

    PlmStage:
      type: string
      enum: [identify, shape, pursue, mobilize, deliver, compound, won, lost, no_go, closed]

    Account:
      type: object
      required: [id, name, country, sector]
      properties:
        id: { type: string }
        name: { type: string }
        country: { type: string }
        sector: { type: string }
        notes: { type: ["string", "null"] }

    Opportunity:
      type: object
      required:
        - id
        - slug
        - name
        - accountId
        - accountName
        - plmStage
        - partnerOwnerName
        - engagementLeadName
        - dealSizeUsd
        - probabilityPct
        - weightedValueUsd
        - daysInStage
        - nextMilestone
        - sourceLead
        - createdAt
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        accountId: { type: string }
        accountName: { type: string }
        plmStage: { $ref: "#/components/schemas/PlmStage" }
        buyerPersona: { type: ["string", "null"] }
        offeringAnchor: { type: ["string", "null"] }
        partnerOwnerName: { type: string }
        engagementLeadName: { type: string }
        dealSizeUsd: { type: number }
        probabilityPct: { type: number }
        weightedValueUsd: { type: number }
        daysInStage: { type: integer }
        nextMilestone: { type: string }
        sourceLead: { type: string }
        createdAt: { type: string, format: date-time }

    Engagement:
      type: object
      required:
        - id
        - slug
        - name
        - accountId
        - accountName
        - plmStage
        - partnerOwnerName
        - engagementLeadName
        - startDate
        - plannedEndDate
        - raidStatus
        - deliverablesDueThisWeek
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        accountId: { type: string }
        accountName: { type: string }
        plmStage: { $ref: "#/components/schemas/PlmStage" }
        partnerOwnerName: { type: string }
        engagementLeadName: { type: string }
        startDate: { type: string }
        plannedEndDate: { type: string }
        raidStatus: { type: string, enum: [green, amber, red] }
        deliverablesDueThisWeek: { type: integer }

    AgentCatalogEntry:
      type: object
      required: [id, name, group, stage, purpose, model, starred, status, runsLast30d]
      properties:
        id: { type: string }
        name: { type: string }
        group: { type: string }
        stage: { type: string }
        purpose: { type: string }
        model: { type: string }
        starred: { type: boolean }
        status: { type: string, enum: [registered, mvp, stub] }
        runsLast30d: { type: integer }

    AgentActivityItem:
      type: object
      required: [id, agentId, agentName, status, message, startedAt]
      properties:
        id: { type: string }
        agentId: { type: string }
        agentName: { type: string }
        status: { type: string, enum: [running, blocked, complete, error] }
        confidence: { type: ["string", "null"], enum: [green, amber, red, null] }
        message: { type: string }
        targetType: { type: ["string", "null"] }
        targetId: { type: ["string", "null"] }
        targetLabel: { type: ["string", "null"] }
        startedAt: { type: string, format: date-time }
        progressPct: { type: ["integer", "null"] }
        sourcesCount: { type: ["integer", "null"] }

    AtelierAsset:
      type: object
      required: [id, kind, title, abstract, provenance, tags, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [pov, prompt, framework, case_study, template, code, learning] }
        title: { type: string }
        abstract: { type: string }
        provenance: { type: string }
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        bodyOrFileUrl: { type: ["string", "null"] }

    PaneAItem:
      type: object
      required: [id, title, summary, priority, hrefKind, hrefTargetId, dueLabel]
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string }
        priority: { type: string, enum: [high, medium, low] }
        hrefKind: { type: string, enum: [opportunity, engagement, deliverable, atelier] }
        hrefTargetId: { type: string }
        dueLabel: { type: string }

    PipelineStageCount:
      type: object
      required: [stage, count, weightedValueUsd, agedRedCount]
      properties:
        stage: { $ref: "#/components/schemas/PlmStage" }
        count: { type: integer }
        weightedValueUsd: { type: number }
        agedRedCount: { type: integer }

    EngagementSummary:
      type: object
      required: [activeCount, deliverablesDueThisWeek, raidAmberCount, raidRedCount]
      properties:
        activeCount: { type: integer }
        deliverablesDueThisWeek: { type: integer }
        raidAmberCount: { type: integer }
        raidRedCount: { type: integer }

    AtelierHome:
      type: object
      required: [eyebrowDate, greeting, persona, paneA, pipeline, engagements, paneC]
      properties:
        eyebrowDate: { type: string }
        greeting: { type: string }
        persona: { $ref: "#/components/schemas/AtelierPersona" }
        paneA:
          type: array
          items: { $ref: "#/components/schemas/PaneAItem" }
        pipeline:
          type: array
          items: { $ref: "#/components/schemas/PipelineStageCount" }
        engagements: { $ref: "#/components/schemas/EngagementSummary" }
        paneC:
          type: array
          items: { $ref: "#/components/schemas/AtelierAsset" }

    AuditEvent:
      type: object
      required: [id, entityType, entityId, actorType, actorLabel, action, ts]
      properties:
        id: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        actorType: { type: string, enum: [human, agent, system] }
        actorLabel: { type: string }
        action: { type: string }
        payloadSummary: { type: ["string", "null"] }
        ts: { type: string, format: date-time }

    Confidence:
      type: string
      enum: [green, amber, red]

    AtelierCreateOpportunityInput:
      type: object
      required: [name, accountName, accountCountry, accountSector]
      properties:
        name: { type: string }
        accountName: { type: string }
        accountCountry: { type: string }
        accountSector: { type: string }
        contextBlurb: { type: string, default: "" }
        dealSizeUsd: { type: number, default: 250000 }
        runScout: { type: boolean, default: true }

    AtelierCreateOpportunityResponse:
      type: object
      required: [opportunity]
      properties:
        opportunity: { $ref: "#/components/schemas/Opportunity" }
        scoutRunId: { type: ["string", "null"] }

    AtelierStageChangeInput:
      type: object
      required: [toStage]
      properties:
        toStage: { $ref: "#/components/schemas/PlmStage" }
        rationale: { type: string, default: "" }

    AtelierFiveC:
      type: object
      required: [client, competition, capability, capacity, contract]
      properties:
        client: { type: string }
        competition: { type: string }
        capability: { type: string }
        capacity: { type: string }
        contract: { type: string }

    AtelierQualifier:
      type: object
      required: [oppId, fiveC]
      properties:
        oppId: { type: string }
        fiveC: { $ref: "#/components/schemas/AtelierFiveC" }
        decision:
          type: ["object", "null"]
          required: [decision, decider, rationale, ts]
          properties:
            decision: { type: string, enum: [go, no_go] }
            decider: { type: string }
            rationale: { type: string }
            ts: { type: string, format: date-time }

    AtelierQualifierInput:
      type: object
      required: [fiveC, decision]
      properties:
        fiveC: { $ref: "#/components/schemas/AtelierFiveC" }
        decision: { type: string, enum: [go, no_go] }
        rationale: { type: string, default: "" }

    AtelierFact:
      type: object
      required: [topic, statement, confidence]
      properties:
        id: { type: string }
        topic: { type: string }
        statement: { type: string }
        sourceUrl: { type: ["string", "null"] }
        sourceTitle: { type: ["string", "null"] }
        snippet: { type: ["string", "null"] }
        confidence: { $ref: "#/components/schemas/Confidence" }

    AtelierBrief:
      type: object
      required: [accountSnapshot, buyerLandscape, fiveCDraft, openQuestions, facts]
      properties:
        accountSnapshot:
          type: object
          required: [oneLiner, scaleHint, recentMoves]
          properties:
            oneLiner: { type: string }
            scaleHint: { type: string }
            recentMoves:
              type: array
              items: { type: string }
        buyerLandscape:
          type: object
          required: [likelyBuyers, powerMap]
          properties:
            likelyBuyers:
              type: array
              items:
                type: object
                required: [title, rationale]
                properties:
                  title: { type: string }
                  rationale: { type: string }
            powerMap: { type: string }
        fiveCDraft: { $ref: "#/components/schemas/AtelierFiveC" }
        openQuestions:
          type: array
          items: { type: string }
        facts:
          type: array
          items: { $ref: "#/components/schemas/AtelierFact" }
        confidence: { $ref: "#/components/schemas/Confidence" }

    AtelierBriefEnvelope:
      type: object
      properties:
        brief: { $ref: "#/components/schemas/AtelierBrief" }
        runId: { type: ["string", "null"] }
        createdAt: { type: ["string", "null"], format: date-time }
        confidence: { $ref: "#/components/schemas/Confidence" }
      required: []

    AtelierScoutInput:
      type: object
      properties:
        contextBlurb: { type: string, default: "" }

    AtelierResearchFact:
      type: object
      required: [id, oppId, topic, statement, confidence, promoted, createdAt]
      properties:
        id: { type: string }
        oppId: { type: string }
        topic: { type: string }
        statement: { type: string }
        sourceUrl: { type: ["string", "null"] }
        sourceTitle: { type: ["string", "null"] }
        snippet: { type: ["string", "null"] }
        confidence: { $ref: "#/components/schemas/Confidence" }
        promoted: { type: boolean }
        promotedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        runId: { type: ["string", "null"] }

    AtelierPromoteFactInput:
      type: object
      required: [promote]
      properties:
        promote: { type: boolean }

    AtelierStartPovInput:
      type: object
      required: [title, audience, objective]
      properties:
        title: { type: string }
        audience: { type: string }
        objective: { type: string }

    AtelierPovOutlineSection:
      type: object
      required: [id, heading, intent, factIds]
      properties:
        id: { type: string }
        heading: { type: string }
        intent: { type: string }
        factIds:
          type: array
          items: { type: string }

    AtelierPov:
      type: object
      required: [id, oppId, title, status, outline, createdAt]
      properties:
        id: { type: string }
        oppId: { type: string }
        title: { type: string }
        audience: { type: ["string", "null"] }
        objective: { type: ["string", "null"] }
        status: { type: string, enum: [outline, drafting, drafted, approved] }
        outline:
          type: array
          items: { $ref: "#/components/schemas/AtelierPovOutlineSection" }
        currentVersionId: { type: ["string", "null"] }
        runId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    AtelierPovVersion:
      type: object
      required: [id, povId, versionNumber, body, sections, createdAt]
      properties:
        id: { type: string }
        povId: { type: string }
        versionNumber: { type: integer }
        body: { type: string }
        sections:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              heading: { type: string }
              body: { type: string }
              citationIds:
                type: array
                items: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/AtelierFact" }
        citationCoverage: { type: ["number", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    AtelierMeeting:
      type: object
      required: [id, oppId, kind, mode, title, date, attendees, summary, decisions, actionItems, createdAt]
      properties:
        id: { type: string }
        oppId: { type: string }
        kind: { type: string, enum: [discovery, workshop, steering, kickoff] }
        mode: { type: string, enum: [paste, upload, live_bot] }
        title: { type: string }
        date: { type: string }
        attendees:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              org: { type: string }
        summary: { type: ["string", "null"] }
        decisions:
          type: array
          items:
            type: object
        actionItems:
          type: array
          items:
            type: object
        runId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    AtelierSubmitMeetingInput:
      type: object
      required: [transcript, kind]
      properties:
        title: { type: string, default: "Untitled meeting" }
        kind: { type: string, enum: [discovery, workshop, steering, kickoff] }
        mode: { type: string, enum: [paste, upload, live_bot], default: paste }
        date: { type: string, default: "" }
        transcript: { type: string }

    AtelierAgentRunDetail:
      type: object
      required: [id, agentId, status, createdAt]
      properties:
        id: { type: string }
        agentId: { type: string }
        status: { type: string, enum: [running, blocked, complete, error] }
        statusMessage: { type: ["string", "null"] }
        progressPct: { type: ["integer", "null"] }
        confidence: { type: ["string", "null"] }
        targetType: { type: ["string", "null"] }
        targetId: { type: ["string", "null"] }
        targetLabel: { type: ["string", "null"] }
        output: {}
        steps:
          type: array
          items: {}
        humanDecisions:
          type: array
          items: {}
        costUsd: { type: ["number", "null"] }
        durationMs: { type: ["integer", "null"] }
        sourcesCount: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }

    AtelierAgentDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, edit, reject] }
        rationale: { type: string, default: "" }

    AtelierHypothesisBranch:
      type: object
      required: [hypothesis]
      properties:
        hypothesis: { type: string }
        subHypotheses:
          type: array
          items: { type: string }
        evidenceRequired:
          type: array
          items: { type: string }
        status:
          type: ["string", "null"]

    AtelierHypothesisTree:
      type: object
      required: [engagementId, root]
      properties:
        engagementId: { type: string }
        treeId: { type: ["string", "null"] }
        root:
          type: object
          required: [rootIssue, branches]
          properties:
            rootIssue: { type: string }
            branches:
              type: array
              items: { $ref: "#/components/schemas/AtelierHypothesisBranch" }

    AtelierCharterBody:
      type: object
      required: [objectives, scope, outOfScope, successMetrics, governance, valueHypothesis]
      properties:
        objectives:
          type: array
          items: { type: string }
        scope:
          type: array
          items: { type: string }
        outOfScope:
          type: array
          items: { type: string }
        successMetrics:
          type: array
          items:
            type: object
            required: [name, baseline, target]
            properties:
              name: { type: string }
              baseline: { type: string }
              target: { type: string }
        governance: { type: string }
        valueHypothesis: { type: string }

    AtelierCharterVersion:
      type: object
      required: [id, engagementId, versionNumber, status, body, hypothesisTree, raidBaseline, proposedWorkstreams, meceFlags, createdAt]
      properties:
        id: { type: string }
        engagementId: { type: string }
        versionNumber: { type: integer }
        status: { type: string, enum: [draft, lead_approved, live, superseded] }
        runId: { type: ["string", "null"] }
        body: { $ref: "#/components/schemas/AtelierCharterBody" }
        hypothesisTree:
          type: object
          properties:
            rootIssue: { type: string }
            branches:
              type: array
              items: { $ref: "#/components/schemas/AtelierHypothesisBranch" }
        raidBaseline:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [risk, assumption, issue, dependency] }
              severity: { type: string, enum: [green, amber, red] }
              ownerRole: { type: string }
              description: { type: string }
              dueClass: { type: string, enum: [wk1, wk2, wk4, monthly] }
        proposedWorkstreams:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              leadRole: { type: string }
              linkedHypothesis: { type: string }
        meceFlags:
          type: array
          items: { type: string }
        leadApprovedByName: { type: ["string", "null"] }
        leadApprovedAt: { type: ["string", "null"], format: date-time }
        partnerApprovedByName: { type: ["string", "null"] }
        partnerApprovedAt: { type: ["string", "null"], format: date-time }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    AtelierCharterRedraftInput:
      type: object
      properties:
        wonProposalSummary: { type: string, default: "" }
        kickoffTranscriptExcerpt: { type: ["string", "null"], default: null }

    AtelierCharterApproveInput:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [lead, partner] }
        notes: { type: string, default: "" }

    AtelierRaidItem:
      type: object
      required: [id, engagementId, kind, severity, status, description, createdAt]
      properties:
        id: { type: string }
        engagementId: { type: string }
        kind: { type: string, enum: [risk, assumption, issue, dependency] }
        severity: { type: string, enum: [green, amber, red] }
        status: { type: string, enum: [open, mitigated, closed] }
        ownerUserId: { type: ["string", "null"] }
        ownerName: { type: ["string", "null"] }
        description: { type: string }
        mitigation: { type: ["string", "null"] }
