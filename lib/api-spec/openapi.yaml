openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: Site-wide AI chat assistant
  - name: atelier
    description: The Atelier — AICo Employee Portal
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /chat:
    post:
      operationId: chat
      tags: [chat]
      summary: Stream a reply from the Maven AI assistant
      description: |
        Streams an assistant reply as Server-Sent Events. Each `data:` payload is a
        `ChatStreamEvent` JSON object. The stream ends with an event of type `done`
        whose `suggestions` field contains optional follow-up links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: SSE stream of ChatStreamEvent JSON payloads
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatError"

  /atelier/me:
    get:
      operationId: atelierGetMe
      tags: [atelier]
      summary: Current persona for The Atelier session
      responses:
        "200":
          description: Current persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierPersona"
  /atelier/personas:
    get:
      operationId: atelierListPersonas
      tags: [atelier]
      summary: List the seeded personas (Partner, Lead, SME, Engineer, BD)
      responses:
        "200":
          description: All seeded personas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierPersona"
  /atelier/personas/switch:
    post:
      operationId: atelierSwitchPersona
      tags: [atelier]
      summary: Switch the active persona (mock auth for MVP shell)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierPersonaSwitchInput"
      responses:
        "200":
          description: Active persona after switch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierPersona"

  /atelier/home:
    get:
      operationId: atelierGetHome
      tags: [atelier]
      summary: The Atelier Home — Pane A / B / C bundle for the active persona
      responses:
        "200":
          description: Home dashboard payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierHome"

  /atelier/activity:
    get:
      operationId: atelierGetActivity
      tags: [atelier]
      summary: Persistent Agent Activity Stream (right rail)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent agent activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentActivityItem"

  /atelier/opportunities:
    get:
      operationId: atelierListOpportunities
      tags: [atelier]
      summary: All opportunities across PLM stages
      responses:
        "200":
          description: Opportunities with stage + account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Opportunity"
    post:
      operationId: atelierCreateOpportunity
      tags: [atelier]
      summary: Create a new opportunity (Pursuit Scout auto-runs)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierCreateOpportunityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierCreateOpportunityResponse"
  /atelier/opportunities/{oppId}:
    get:
      operationId: atelierGetOpportunity
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Single opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierError"
  /atelier/opportunities/{oppId}/stage:
    patch:
      operationId: atelierUpdateOpportunityStage
      tags: [atelier]
      summary: Move opportunity to a new PLM stage (5C gate enforced for `pursue`)
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierStageChangeInput"
      responses:
        "200":
          description: Updated opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
        "412":
          description: Gate not satisfied (5C qualifier missing or no_go)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierError"
  /atelier/opportunities/{oppId}/qualifier:
    get:
      operationId: atelierGetQualifier
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 5C qualifier + go/no-go decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierQualifier"
    post:
      operationId: atelierSubmitQualifier
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierQualifierInput"
      responses:
        "200":
          description: Persisted qualifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierQualifier"
  /atelier/opportunities/{oppId}/brief:
    get:
      operationId: atelierGetBrief
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Latest Pursuit Scout brief, or null when never run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierBriefEnvelope"
  /atelier/opportunities/{oppId}/scout:
    post:
      operationId: atelierRunPursuitScout
      tags: [atelier]
      summary: (Re)run Pursuit Scout for an opportunity
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierScoutInput"
      responses:
        "200":
          description: Scout brief (synchronously synthesised)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierBriefEnvelope"
  /atelier/opportunities/{oppId}/research:
    get:
      operationId: atelierListResearchFacts
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: All research facts (promoted + unpromoted)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierResearchFact"
  /atelier/opportunities/{oppId}/research/{factId}/promote:
    post:
      operationId: atelierPromoteResearchFact
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
        - in: path
          name: factId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierPromoteFactInput"
      responses:
        "200":
          description: Updated fact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierResearchFact"
  /atelier/opportunities/{oppId}/povs:
    get:
      operationId: atelierListPovs
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: POVs for this opportunity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierPov"
    post:
      operationId: atelierStartPov
      tags: [atelier]
      summary: Start a POV — generates outline (POV Author phase A)
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierStartPovInput"
      responses:
        "201":
          description: POV with outline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierPov"
  /atelier/povs/{povId}/draft:
    post:
      operationId: atelierDraftPov
      tags: [atelier]
      summary: Generate full draft after outline approval (Phases B/C/D)
      parameters:
        - in: path
          name: povId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: New POV version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierPovVersion"
  /atelier/povs/{povId}/versions:
    get:
      operationId: atelierListPovVersions
      tags: [atelier]
      parameters:
        - in: path
          name: povId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: All versions of this POV
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierPovVersion"
  /atelier/opportunities/{oppId}/meetings:
    get:
      operationId: atelierListOpportunityMeetings
      tags: [atelier]
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: All meetings on this opportunity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierMeeting"
    post:
      operationId: atelierSubmitMeeting
      tags: [atelier]
      summary: Paste/upload a transcript and run Meeting Scribe
      parameters:
        - in: path
          name: oppId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierSubmitMeetingInput"
      responses:
        "201":
          description: Created meeting with structured output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierMeeting"
  /atelier/agent-runs/{runId}:
    get:
      operationId: atelierGetAgentRun
      tags: [atelier]
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Run details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierAgentRunDetail"
  /atelier/agent-runs/{runId}/decision:
    post:
      operationId: atelierRecordAgentDecision
      tags: [atelier]
      summary: Record an Approve / Edit / Reject checkpoint decision
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierAgentDecisionInput"
      responses:
        "200":
          description: Updated run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierAgentRunDetail"

  /atelier/engagements:
    get:
      operationId: atelierListEngagements
      tags: [atelier]
      summary: Active engagements
      responses:
        "200":
          description: Engagements with stage + account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Engagement"
  /atelier/engagements/{engId}:
    get:
      operationId: atelierGetEngagement
      tags: [atelier]
      parameters:
        - in: path
          name: engId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Single engagement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Engagement"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierError"

  /atelier/accounts:
    get:
      operationId: atelierListAccounts
      tags: [atelier]
      summary: Firm accounts
      responses:
        "200":
          description: All accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"

  /atelier/agents:
    get:
      operationId: atelierListAgents
      tags: [atelier]
      summary: The full agent catalog (22 named agents)
      responses:
        "200":
          description: Agent registry
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentCatalogEntry"

  /atelier/assets:
    get:
      operationId: atelierListAssets
      tags: [atelier]
      summary: Knowledge Atelier reusable assets
      responses:
        "200":
          description: Reusable assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierAsset"

  /atelier/audit:
    get:
      operationId: atelierListAudit
      tags: [atelier]
      summary: Append-only audit feed for an entity
      parameters:
        - in: query
          name: entityType
          schema:
            type: string
            enum: [opportunity, engagement, deliverable, agent_run, atelier]
        - in: query
          name: entityId
          schema: { type: string }
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Audit events (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ChatMessage:
      type: object
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, minLength: 1, maxLength: 4000 }
      required: [role, content]
    ChatRequest:
      type: object
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 24
          items:
            $ref: "#/components/schemas/ChatMessage"
        language:
          type: string
          enum: [en, ar]
          default: en
      required: [messages]
    ChatSuggestion:
      type: object
      properties:
        kind: { type: string, enum: [service, insight, assessment, industry, page] }
        href: { type: string }
        label: { type: string }
      required: [kind, href, label]
    ChatStreamEvent:
      type: object
      properties:
        type: { type: string, enum: [token, done, error] }
        token: { type: string }
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/ChatSuggestion"
        message: { type: string }
      required: [type]
    ChatError:
      type: object
      properties:
        error: { type: string }
        retryAfterSeconds: { type: number }
      required: [error]

    # ===================== ATELIER =====================
    AtelierError:
      type: object
      properties:
        error: { type: string }
      required: [error]

    AtelierPersonaRole:
      type: string
      enum: [partner, engagement_lead, sme, ai_engineer, business_developer]

    AtelierPersona:
      type: object
      required: [id, name, email, role, roleLabel, title, initials]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/AtelierPersonaRole" }
        roleLabel: { type: string }
        title: { type: string }
        initials: { type: string }
        avatarUrl: { type: ["string", "null"] }

    AtelierPersonaSwitchInput:
      type: object
      required: [personaId]
      properties:
        personaId: { type: string }

    PlmStage:
      type: string
      enum: [identify, shape, pursue, mobilize, deliver, compound, won, lost, no_go, closed]

    Account:
      type: object
      required: [id, name, country, sector]
      properties:
        id: { type: string }
        name: { type: string }
        country: { type: string }
        sector: { type: string }
        notes: { type: ["string", "null"] }

    Opportunity:
      type: object
      required:
        - id
        - slug
        - name
        - accountId
        - accountName
        - plmStage
        - partnerOwnerName
        - engagementLeadName
        - dealSizeUsd
        - probabilityPct
        - weightedValueUsd
        - daysInStage
        - nextMilestone
        - sourceLead
        - createdAt
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        accountId: { type: string }
        accountName: { type: string }
        plmStage: { $ref: "#/components/schemas/PlmStage" }
        buyerPersona: { type: ["string", "null"] }
        offeringAnchor: { type: ["string", "null"] }
        partnerOwnerName: { type: string }
        engagementLeadName: { type: string }
        dealSizeUsd: { type: number }
        probabilityPct: { type: number }
        weightedValueUsd: { type: number }
        daysInStage: { type: integer }
        nextMilestone: { type: string }
        sourceLead: { type: string }
        createdAt: { type: string, format: date-time }

    Engagement:
      type: object
      required:
        - id
        - slug
        - name
        - accountId
        - accountName
        - plmStage
        - partnerOwnerName
        - engagementLeadName
        - startDate
        - plannedEndDate
        - raidStatus
        - deliverablesDueThisWeek
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        accountId: { type: string }
        accountName: { type: string }
        plmStage: { $ref: "#/components/schemas/PlmStage" }
        partnerOwnerName: { type: string }
        engagementLeadName: { type: string }
        startDate: { type: string }
        plannedEndDate: { type: string }
        raidStatus: { type: string, enum: [green, amber, red] }
        deliverablesDueThisWeek: { type: integer }

    AgentCatalogEntry:
      type: object
      required: [id, name, group, stage, purpose, model, starred, status, runsLast30d]
      properties:
        id: { type: string }
        name: { type: string }
        group: { type: string }
        stage: { type: string }
        purpose: { type: string }
        model: { type: string }
        starred: { type: boolean }
        status: { type: string, enum: [registered, mvp, stub] }
        runsLast30d: { type: integer }

    AgentActivityItem:
      type: object
      required: [id, agentId, agentName, status, message, startedAt]
      properties:
        id: { type: string }
        agentId: { type: string }
        agentName: { type: string }
        status: { type: string, enum: [running, blocked, complete, error] }
        confidence: { type: ["string", "null"], enum: [green, amber, red, null] }
        message: { type: string }
        targetType: { type: ["string", "null"] }
        targetId: { type: ["string", "null"] }
        targetLabel: { type: ["string", "null"] }
        startedAt: { type: string, format: date-time }
        progressPct: { type: ["integer", "null"] }
        sourcesCount: { type: ["integer", "null"] }

    AtelierAsset:
      type: object
      required: [id, kind, title, abstract, provenance, tags, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [pov, prompt, framework, case_study, template, code, learning] }
        title: { type: string }
        abstract: { type: string }
        provenance: { type: string }
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        bodyOrFileUrl: { type: ["string", "null"] }

    PaneAItem:
      type: object
      required: [id, title, summary, priority, hrefKind, hrefTargetId, dueLabel]
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string }
        priority: { type: string, enum: [high, medium, low] }
        hrefKind: { type: string, enum: [opportunity, engagement, deliverable, atelier] }
        hrefTargetId: { type: string }
        dueLabel: { type: string }

    PipelineStageCount:
      type: object
      required: [stage, count, weightedValueUsd, agedRedCount]
      properties:
        stage: { $ref: "#/components/schemas/PlmStage" }
        count: { type: integer }
        weightedValueUsd: { type: number }
        agedRedCount: { type: integer }

    EngagementSummary:
      type: object
      required: [activeCount, deliverablesDueThisWeek, raidAmberCount, raidRedCount]
      properties:
        activeCount: { type: integer }
        deliverablesDueThisWeek: { type: integer }
        raidAmberCount: { type: integer }
        raidRedCount: { type: integer }

    AtelierHome:
      type: object
      required: [eyebrowDate, greeting, persona, paneA, pipeline, engagements, paneC]
      properties:
        eyebrowDate: { type: string }
        greeting: { type: string }
        persona: { $ref: "#/components/schemas/AtelierPersona" }
        paneA:
          type: array
          items: { $ref: "#/components/schemas/PaneAItem" }
        pipeline:
          type: array
          items: { $ref: "#/components/schemas/PipelineStageCount" }
        engagements: { $ref: "#/components/schemas/EngagementSummary" }
        paneC:
          type: array
          items: { $ref: "#/components/schemas/AtelierAsset" }

    AuditEvent:
      type: object
      required: [id, entityType, entityId, actorType, actorLabel, action, ts]
      properties:
        id: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        actorType: { type: string, enum: [human, agent, system] }
        actorLabel: { type: string }
        action: { type: string }
        payloadSummary: { type: ["string", "null"] }
        ts: { type: string, format: date-time }

    Confidence:
      type: string
      enum: [green, amber, red]

    AtelierCreateOpportunityInput:
      type: object
      required: [name, accountName, accountCountry, accountSector]
      properties:
        name: { type: string }
        accountName: { type: string }
        accountCountry: { type: string }
        accountSector: { type: string }
        contextBlurb: { type: string, default: "" }
        dealSizeUsd: { type: number, default: 250000 }
        runScout: { type: boolean, default: true }

    AtelierCreateOpportunityResponse:
      type: object
      required: [opportunity]
      properties:
        opportunity: { $ref: "#/components/schemas/Opportunity" }
        scoutRunId: { type: ["string", "null"] }

    AtelierStageChangeInput:
      type: object
      required: [toStage]
      properties:
        toStage: { $ref: "#/components/schemas/PlmStage" }
        rationale: { type: string, default: "" }

    AtelierFiveC:
      type: object
      required: [client, competition, capability, capacity, contract]
      properties:
        client: { type: string }
        competition: { type: string }
        capability: { type: string }
        capacity: { type: string }
        contract: { type: string }

    AtelierQualifier:
      type: object
      required: [oppId, fiveC]
      properties:
