        reviewedOn: { type: ["string", "null"] }
        selfRating: { type: ["string", "null"] }
        managerRating: { type: ["string", "null"] }
        strengths: { type: string }
        growthAreas: { type: string }
        managerSummary: { type: string }
        hrNotes: { type: string }
        status: { type: string, enum: [draft, released] }
        releasedAt: { type: ["string", "null"] }

    AtelierPerformanceReviewInput:
      type: object
      required: [employeeId, cycle]
      properties:
        employeeId: { type: string }
        cycle: { type: string, minLength: 1, maxLength: 100 }
        reviewedOn: { type: string, maxLength: 10 }
        selfRating: { type: string, maxLength: 50 }
        managerRating: { type: string, maxLength: 50 }
        strengths: { type: string, maxLength: 8000 }
        growthAreas: { type: string, maxLength: 8000 }
        managerSummary: { type: string, maxLength: 8000 }
        hrNotes: { type: string, maxLength: 8000 }

    AtelierPerformanceReviewPatch:
      type: object
      properties:
        cycle: { type: string, minLength: 1, maxLength: 100 }
        reviewedOn: { type: string, maxLength: 10 }
        selfRating: { type: string, maxLength: 50 }
        managerRating: { type: string, maxLength: 50 }
        strengths: { type: string, maxLength: 8000 }
        growthAreas: { type: string, maxLength: 8000 }
        managerSummary: { type: string, maxLength: 8000 }
        hrNotes: { type: string, maxLength: 8000 }

    AtelierReviewReleaseInput:
      type: object
      required: [released]
      properties:
        released: { type: boolean }

    AtelierPerformanceGoal:
      type: object
      required: [id, employeeId, employeeName, cycle, title, description, weightPct, status]
      properties:
        id: { type: string }
        employeeId: { type: string }
        employeeName: { type: string }
        cycle: { type: string }
        title: { type: string }
        description: { type: string }
        weightPct: { type: integer }
        status: { type: string, enum: [on_track, at_risk, complete] }

    AtelierPerformanceGoalInput:
      type: object
      required: [employeeId, cycle, title]
      properties:
        employeeId: { type: string }
        cycle: { type: string, minLength: 1, maxLength: 100 }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 4000 }
        weightPct: { type: integer, minimum: 0, maximum: 100 }
        status: { type: string, enum: [on_track, at_risk, complete] }

    AtelierPerformanceGoalPatch:
      type: object
      properties:
        cycle: { type: string, minLength: 1, maxLength: 100 }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 4000 }
        weightPct: { type: integer, minimum: 0, maximum: 100 }
        status: { type: string, enum: [on_track, at_risk, complete] }

    AtelierTrainingMaterial:
      type: object
      required: [id, title, description, topic, kind, audience, completionCount]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        topic: { type: string }
        kind: { type: string, enum: [link, file] }
        url: { type: ["string", "null"] }
        fileName: { type: ["string", "null"] }
        mime: { type: ["string", "null"] }
        sizeBytes: { type: ["integer", "null"] }
        audience: { type: string, enum: [all, employees, contractors] }
        completionCount: { type: integer }
        createdAt: { type: ["string", "null"] }

    AtelierTrainingMaterialInput:
      type: object
      required: [title, kind]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 4000 }
        topic: { type: string, maxLength: 200 }
        kind: { type: string, enum: [link] }
        url: { type: string, minLength: 1, maxLength: 2000 }
        audience: { type: string, enum: [all, employees, contractors] }

    AtelierTrainingMaterialPatch:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 4000 }
        topic: { type: string, maxLength: 200 }
        url: { type: string, minLength: 1, maxLength: 2000 }
        audience: { type: string, enum: [all, employees, contractors] }

    AtelierTrainingCompletionRow:
      type: object
      required: [userId, name, workerType, completed]
      properties:
        userId: { type: string }
        name: { type: string }
        workerType: { type: string, enum: [employee, contractor] }
        completed: { type: boolean }
        completedAt: { type: ["string", "null"] }

    PlmStage:
      type: string
      enum: [identify, shape, pursue, mobilize, deliver, compound, won, lost, no_go, closed]

    SalesStage:
      type: string
      description: |
        Canonical 5-stage funnel + 3 terminals (Task #295). plmStage is
        derived. Working: suspect → prospect → convert → runner → contract.
        Terminals: lost · no_decision · withdrawn.
      enum:
        - suspect
        - prospect
        - convert
        - runner
        - contract
        - lost
        - no_decision
        - withdrawn

    Account:
      type: object
      required: [id, name, country, sector]
      properties:
        id: { type: string }
        name: { type: string }
        country: { type: string }
        sector: { type: string }
        notes: { type: ["string", "null"] }

    Opportunity:
      type: object
      required:
        - id
        - slug
        - name
        - accountId
        - accountName
        - salesStage
        - partnerOwnerName
        - engagementLeadName
        - dealSizeUsd
        - probabilityPct
        - weightedValueUsd
        - daysInStage
        - nextMilestone
        - sourceLead
        - createdAt
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        accountId: { type: string }
        accountName: { type: string }
        salesStage: { $ref: "#/components/schemas/SalesStage" }
        buyerPersona: { type: ["string", "null"] }
        offeringAnchor: { type: ["string", "null"] }
        partnerOwnerName: { type: string }
        engagementLeadName: { type: string }
        dealSizeUsd: { type: number }
        # Task #8 — the account's primaryCurrency; deal values are denominated
        # in this currency (no client-side FX is ever fabricated).
        currency: { type: string }
        probabilityPct: { type: number }
        weightedValueUsd: { type: number }
        daysInStage: { type: integer }
        nextMilestone: { type: string }
        nextMilestoneDate: { type: ["string", "null"] }
        closeDate: { type: ["string", "null"] }
        forecastCategory: { $ref: "#/components/schemas/ForecastCategory" }
        sourceLead: { type: string }
        stalled: { type: boolean }
        # Task #295/#296 — sub-status chip for kanban + sticky stage timestamps.
        subStatus: { type: ["string", "null"] }
        runnerEnteredAt: { type: ["string", "null"], format: date-time }
        contractSignedAt: { type: ["string", "null"], format: date-time }
        # Task #540 — structured weighted qualification rubric (null until scored).
        qualificationRubric:
          oneOf:
            - $ref: "#/components/schemas/QualificationRubric"
            - type: "null"
        createdAt: { type: string, format: date-time }

    OpportunityStageTransition:
      type: object
      required: [id, opportunityId, toStage, transitionedByUserId, createdAt]
      properties:
        id: { type: string }
        opportunityId: { type: string }
        fromStage: { oneOf: [{ $ref: "#/components/schemas/SalesStage" }, { type: "null" }] }
        toStage: { $ref: "#/components/schemas/SalesStage" }
        transitionedByUserId: { type: string }
        transitionedByName: { type: ["string", "null"] }
        rationaleText: { type: ["string", "null"] }
        evidenceArtifactIds:
          type: array
          items: { type: string }
        priorProbabilityPct: { type: ["number", "null"] }
        newProbabilityPct: { type: ["number", "null"] }
        nextMilestone: { type: ["string", "null"] }
        nextMilestoneDate: { type: ["string", "null"] }
        agentRecommended: { type: boolean }
        partnerOverride: { type: boolean }
        createdAt: { type: string, format: date-time }

    AtelierStageTransitionInput:
      type: object
      required: [toStage, rationaleText]
      properties:
        toStage: { $ref: "#/components/schemas/SalesStage" }
        rationaleText: { type: string, minLength: 1 }
        evidenceArtifactIds:
          type: array
          items: { type: string }
          default: []
        newProbabilityPct: { type: ["number", "null"] }
        nextMilestone: { type: ["string", "null"] }
        nextMilestoneDate: { type: ["string", "null"] }
        partnerOverride: { type: boolean, default: false }
        # Task #295 — per-transition gate fields.
        # Sub-status under the new stage (taxonomy in pipeline.ts SUB_STATUS_BY_STAGE).
        subStatus: { type: ["string", "null"] }
        # Convert→Runner gate: named decider + verbal-commit date + signature path.
        decider: { type: ["string", "null"] }
        verbalCommitDate: { type: ["string", "null"] }
        signaturePath: { type: ["string", "null"] }
        # Runner→Contract gate: signed instrument upload (artifact id).
        signedInstrumentFileId: { type: ["string", "null"] }
        # Terminal stage gate: reason code (taxonomy in pipeline.ts TERMINAL_REASON_CODES).
        reasonCode: { type: ["string", "null"] }

    PipelineStageBucket:
      type: object
      required: [stage, count, dealSumUsd, weightedSumUsd, avgDaysInStage]
      properties:
        stage: { $ref: "#/components/schemas/SalesStage" }
        count: { type: integer }
        dealSumUsd: { type: number }
        weightedSumUsd: { type: number }
        avgDaysInStage: { type: number }

    PipelineForecastSummary:
      type: object
      required:
        - totalCount
        - totalDealSumUsd
        - weightedPipelineUsd
        - stalledCount
        - asOf
        - buckets
      properties:
        totalCount: { type: integer }
        totalDealSumUsd: { type: number }
        weightedPipelineUsd: { type: number }
        stalledCount: { type: integer }
        asOf: { type: string, format: date-time }
        buckets:
          type: array
          items: { $ref: "#/components/schemas/PipelineStageBucket" }

    Engagement:
      type: object
      required:
        - id
        - slug
        - name
        - accountId
        - accountName
        - plmStage
        - partnerOwnerName
        - engagementLeadName
        - startDate
        - plannedEndDate
        - raidStatus
        - deliverablesDueThisWeek
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        accountId: { type: string }
        accountName: { type: string }
        plmStage: { $ref: "#/components/schemas/PlmStage" }
        partnerOwnerName: { type: string }
        engagementLeadName: { type: string }
        startDate: { type: string }
        plannedEndDate: { type: string }
        raidStatus: { type: string, enum: [green, amber, red] }
        deliverablesDueThisWeek: { type: integer }

    AgentCatalogEntry:
      type: object
      required: [id, name, group, stage, purpose, model, starred, status, runsLast30d]
      properties:
        id: { type: string }
        name: { type: string }
        group: { type: string }
        stage: { type: string }
        purpose: { type: string }
        model: { type: string }
        starred: { type: boolean }
        status: { type: string, enum: [registered, mvp, stub] }
        runsLast30d: { type: integer }
        inputs:
          type: array
          items: { $ref: "#/components/schemas/AtelierAgentSchemaField" }
        outputs:
          type: array
          items: { $ref: "#/components/schemas/AtelierAgentSchemaField" }

    AgentActivityItem:
      type: object
      required: [id, agentId, agentName, status, message, startedAt]
      properties:
        id: { type: string }
        agentId: { type: string }
        agentName: { type: string }
        status: { type: string, enum: [running, blocked, complete, error] }
        confidence: { type: ["string", "null"], enum: [green, amber, red, null] }
        message: { type: string }
        targetType: { type: ["string", "null"] }
        targetId: { type: ["string", "null"] }
        targetLabel: { type: ["string", "null"] }
        startedAt: { type: string, format: date-time }
        progressPct: { type: ["integer", "null"] }
        sourcesCount: { type: ["integer", "null"] }

    AtelierAsset:
      type: object
      required: [id, kind, title, abstract, provenance, tags, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [pov, prompt, framework, case_study, template, code, learning] }
        title: { type: string }
        abstract: { type: string }
        provenance: { type: string }
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        bodyOrFileUrl: { type: ["string", "null"] }

    PaneAItem:
      type: object
      required: [id, title, summary, priority, hrefKind, hrefTargetId, dueLabel]
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string }
        priority: { type: string, enum: [high, medium, low] }
        hrefKind: { type: string, enum: [opportunity, engagement, deliverable, atelier] }
        hrefTargetId: { type: string }
        dueLabel: { type: string }

    PipelineStageCount:
      type: object
      required: [stage, count, weightedValueUsd, agedRedCount]
      properties:
        stage: { $ref: "#/components/schemas/PlmStage" }
        count: { type: integer }
        weightedValueUsd: { type: number }
        agedRedCount: { type: integer }

    EngagementSummary:
      type: object
      required: [activeCount, deliverablesDueThisWeek, raidAmberCount, raidRedCount]
      properties:
        activeCount: { type: integer }
        deliverablesDueThisWeek: { type: integer }
        raidAmberCount: { type: integer }
        raidRedCount: { type: integer }

    AtelierHome:
      type: object
      required: [eyebrowDate, greeting, persona, paneA, pipeline, engagements, paneC]
      properties:
        eyebrowDate: { type: string }
        greeting: { type: string }
        persona: { $ref: "#/components/schemas/AtelierPersona" }
        paneA:
          type: array
          items: { $ref: "#/components/schemas/PaneAItem" }
        pipeline:
          type: array
          items: { $ref: "#/components/schemas/PipelineStageCount" }
        engagements: { $ref: "#/components/schemas/EngagementSummary" }
        paneC:
          type: array
          items: { $ref: "#/components/schemas/AtelierAsset" }

    AuditEvent:
      type: object
      required: [id, entityType, entityId, actorType, actorLabel, action, ts]
      properties:
        id: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        actorType: { type: string, enum: [human, agent, system] }
        actorLabel: { type: string }
        action: { type: string }
        payloadSummary: { type: ["string", "null"] }
        ts: { type: string, format: date-time }

    Confidence:
      type: string
      enum: [green, amber, red]

    ForecastCategory:
      type: string
      description: |
        Task #653 — standard sales forecast band. `omitted` deals are excluded
        from the roll-up; `pipeline` is the working default; `best_case` /
        `commit` are graduated confidence; `closed` is booked.
      enum: [omitted, pipeline, best_case, commit, closed]

    AtelierCreateOpportunityInput:
      type: object
      required: [name, description]
      properties:
        name: { type: string, minLength: 1 }
        description:
          type: string
          minLength: 1
          description: |
            Free-text description of what we're pursuing. This is what Pursuit
            Scout reads first; persisted as the opportunity's offering anchor.
        accountId:
          type: ["string", "null"]
          description: |
            Existing atelier_accounts.id. Required when not creating a new
            account. When omitted, accountName/accountCountry/accountSector
            must be provided to create a new account.
        accountName: { type: ["string", "null"] }
        accountCountry: { type: ["string", "null"] }
        accountSector: { type: ["string", "null"] }
        accountTier:
          oneOf:
            - { $ref: "#/components/schemas/AtelierAccountTier" }
            - { type: "null" }
        partnerOwnerId:
          type: ["string", "null"]
          description: atelier_users.id of the partner owner. Defaults to creator if omitted.
        engagementLeadId:
          type: ["string", "null"]
          description: atelier_users.id of the engagement lead. Defaults to creator if omitted.
        sourceLead:
          type: ["string", "null"]
          description: |
            Lead origin. One of inbound, referral, outbound, existing_client,
            event, manual. Free-form fallback allowed.
        dealSizeUsd: { type: ["number", "null"], default: 250000 }
        probabilityPct: { type: ["number", "null"], minimum: 0, maximum: 100 }
        nextMilestone: { type: ["string", "null"] }
        nextMilestoneDate: { type: ["string", "null"] }
        closeDate: { type: ["string", "null"] }
        forecastCategory:
          oneOf:
            - { $ref: "#/components/schemas/ForecastCategory" }
            - { type: "null" }
        contextBlurb:
          type: string
          default: ""
          description: Deprecated alias for description; retained for backwards compatibility.
        scoutFocus:
          type: ["string", "null"]
          description: Optional steering text passed to Pursuit Scout alongside the description.
        runScout: { type: boolean, default: true }
        allowDuplicate:
          type: boolean
          default: false
          description: |
            Explicit override for duplicate detection. When an open (non-archived)
            opportunity on the same account has a matching normalized name, the
            create is rejected with 409 unless this flag is true.
        allowDuplicateAccount:
          type: boolean
          default: false
          description: |
            Explicit override for duplicate-ACCOUNT detection (Task #38). Only
            relevant on the create-with-new-account branch: when a non-archived
            account in the org has a matching normalized name, the create is
            rejected with 409 `duplicate-account` unless this flag is true (or
            `accountId` is passed to reuse the existing account).

    # Task #30 — structured duplicate-opportunity conflict (mirrors the
    # account duplicate-name 409 contract, enriched with fuzzy near-matches).
    AtelierOpportunityDuplicateMatch:
      type: object
      required: [id, name, salesStage, score, confidence, exact]
      properties:
        id: { type: string }
        name: { type: string }
        salesStage: { type: ["string", "null"] }
        score: { type: number }
        confidence: { $ref: "#/components/schemas/AtelierDuplicateConfidence" }
        exact:
          type: boolean
          description: True when the normalized names are identical (this is what blocked the create).

    AtelierOpportunityDuplicateCandidates:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          description: Likely duplicates, exact matches first then by score.
          items: { $ref: "#/components/schemas/AtelierOpportunityDuplicateMatch" }

    AtelierOpportunityDuplicateError:
      type: object
      required: [error, existing, message]
      properties:
        error: { type: string, enum: [duplicate-opportunity] }
        existing: { $ref: "#/components/schemas/AtelierOpportunityDuplicateMatch" }
        similar:
          type: array
          description: Fuzzy near-matches on the same account (may include the exact match).
          items: { $ref: "#/components/schemas/AtelierOpportunityDuplicateMatch" }
        message: { type: string }

    AtelierCreateOpportunityResponse:
      type: object
      required: [opportunity]
      properties:
        opportunity: { $ref: "#/components/schemas/Opportunity" }
        scoutRunId: { type: ["string", "null"] }
        scout:
          type: object
          description: >-
            Pursuit Scout outcome for this create. The opportunity is created
            regardless; this surfaces whether a usable research brief was
            produced so a failed/empty run is not swallowed by a bare 201.
          required: [status]
          properties:
            status:
              type: string
              enum: [completed, empty, failed, skipped]
              description: >-
                completed = usable brief persisted; empty = run returned an
                empty/soft-refusal brief (not persisted); failed = the run threw
                (see error); skipped = runScout:false, no run attempted.
            error: { type: string }

    AtelierStageChangeInput:
      type: object
      required: [toStage]
      properties:
        toStage: { $ref: "#/components/schemas/PlmStage" }
        rationale: { type: string, default: "" }

    AtelierFiveC:
      type: object
      required: [client, competition, capability, capacity, contract]
      properties:
        client: { type: string }
        competition: { type: string }
        capability: { type: string }
        capacity: { type: string }
        contract: { type: string }

    AtelierQualifier:
      type: object
      required: [oppId, fiveC]
      properties:
        oppId: { type: string }
        fiveC: { $ref: "#/components/schemas/AtelierFiveC" }
        decision:
          type: ["object", "null"]
          required: [decision, decider, rationale, ts]
          properties:
            decision: { type: string, enum: [go, no_go] }
            decider: { type: string }
            rationale: { type: string }
            ts: { type: string, format: date-time }
        # Task #540 — structured weighted rubric surfaced alongside the 5C.
        rubric:
          oneOf:
            - $ref: "#/components/schemas/QualificationRubric"
            - type: "null"

    AtelierQualifierInput:
      type: object
      required: [fiveC, decision]
      properties:
        fiveC: { $ref: "#/components/schemas/AtelierFiveC" }
        decision: { type: string, enum: [go, no_go] }
        rationale: { type: string, default: "" }

    AtelierUpdateOpportunityInput:
      type: object
      description: |
        Task #540 — partial edit of an opportunity's core details. All fields
        optional; only supplied fields are updated.
      properties:
        name: { type: string, minLength: 1 }
        dealSizeUsd: { type: number, minimum: 0 }
        probabilityPct: { type: number, minimum: 0, maximum: 100 }
        nextMilestone: { type: ["string", "null"] }
        nextMilestoneDate: { type: ["string", "null"] }
        closeDate: { type: ["string", "null"] }
        forecastCategory:
          oneOf:
            - { $ref: "#/components/schemas/ForecastCategory" }
            - { type: "null" }
        buyerPersona: { type: ["string", "null"] }
        offeringAnchor: { type: ["string", "null"] }
        partnerOwnerId: { type: string }
        engagementLeadId: { type: string }

    AtelierArchiveOpportunityInput:
      type: object
      properties:
        rationale: { type: string, default: "" }

    AtelierArchivedOpportunity:
      type: object
      required: [ok, id]
      properties:
        ok: { type: boolean }
        id: { type: string }

    AtelierQualificationRubricInput:
      type: object
      required: [attachmentIds]
      properties:
        attachmentIds:
          type: array
          items: { type: string }
          minItems: 1
        offeringAnchors:
          type: array
          items: { type: string }
          default: []

    QualificationRubricDimension:
      type: object
      required: [key, score, weight, rationale, chunkIds]
      properties:
        key:
          type: string
          enum:
            - strategicFit
            - clientQuality
            - dealEconomics
            - winProbability
            - deliverability
            - riskInverted
        score: { type: number }
        weight: { type: number }
        rationale: { type: string }
        chunkIds:
          type: array
          items: { type: string }

    QualificationRubric:
      type: object
      required: [composite, band, dimensions, attachmentIds, generatedAt]
      properties:
        composite: { type: number }
        band: { type: string, enum: [pursue, watch, decline] }
        dimensions:
          type: array
          items: { $ref: "#/components/schemas/QualificationRubricDimension" }
        attachmentIds:
          type: array
          items: { type: string }
        generatedAt: { type: string }

    AtelierFact:
      type: object
      required: [topic, statement, confidence]
      properties:
        id: { type: string }
        topic: { type: string }
        statement: { type: string }
        sourceUrl: { type: ["string", "null"] }
        sourceTitle: { type: ["string", "null"] }
        snippet: { type: ["string", "null"] }
        confidence: { $ref: "#/components/schemas/Confidence" }

    AtelierBrief:
      type: object
      required: [accountSnapshot, buyerLandscape, fiveCDraft, openQuestions, facts]
      properties:
        accountSnapshot:
          type: object
          required: [oneLiner, scaleHint, recentMoves]
          properties:
            oneLiner: { type: string }
            scaleHint: { type: string }
            recentMoves:
              type: array
              items: { type: string }
        buyerLandscape:
          type: object
          required: [likelyBuyers, powerMap]
          properties:
            likelyBuyers:
              type: array
              items:
                type: object
                required: [title, rationale]
                properties:
                  title: { type: string }
                  rationale: { type: string }
            powerMap: { type: string }
        fiveCDraft: { $ref: "#/components/schemas/AtelierFiveC" }
        openQuestions:
          type: array
          items: { type: string }
        facts:
          type: array
          items: { $ref: "#/components/schemas/AtelierFact" }
        confidence: { $ref: "#/components/schemas/Confidence" }

    AtelierBriefEnvelope:
      type: object
      properties:
        brief: { $ref: "#/components/schemas/AtelierBrief" }
        runId: { type: ["string", "null"] }
