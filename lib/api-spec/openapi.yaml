      type: object
      required: [pricingModel, durationWeeks, teamMix, cost, price, marginPct, marginLockStatus, narrative]
      properties:
        pricingModel: { type: string }
        durationWeeks: { type: number }
        teamMix:
          type: array
          items: { $ref: "#/components/schemas/AtelierTeamMixEntry" }
        cost: { type: number }
        price: { type: number }
        marginPct: { type: number }
        marginLockStatus: { $ref: "#/components/schemas/AtelierMarginLockStatus" }
        narrative: { type: string }

