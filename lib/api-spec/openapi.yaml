        story: { type: string }

    AtelierPricingStrategistInput:
      type: object
      description: |
        Optional spec-contract input forwarded to the Pricing Strategist.
        opportunity_id from the path takes precedence; the body fields are
        narrative + alt-selection hints. target_margin_pct (when provided)
        overrides the firm-default policy target for the duration of this run.
      properties:
        primary_intent:
          type: string
          description: e.g. "land_and_expand", "defend_margin", "displace_incumbent"
        target_margin_pct:
          type: number
          minimum: 0
          maximum: 1
        alternative_lenses:
          type: array
          items:
            type: string
            enum: [fixed_fee, outcome_based, retainer]

