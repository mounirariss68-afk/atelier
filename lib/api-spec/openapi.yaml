  /atelier/contacts/{contactId}/merge:
    post:
      operationId: atelierMergeContacts
      tags: [atelier]
      summary: Merge a duplicate contact into this (survivor) contact
      description: |
        Consolidates a duplicate contact into the survivor identified by the
        path. Both contacts must live on the same account. Relationship edges,
        activities and audit history are re-pointed to the survivor and the
        duplicate is soft-deleted. Audit-logged and org-scoped. Partner /
        Senior Manager only, gated by visibility on the owning account.
      parameters:
        - in: path
          name: contactId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierMergeContactsInput"
      responses:
        "200":
          description: Merge result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierMergeContactResult"
        "400":
          description: Invalid body / different accounts / merging a record into itself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierError"
        "403":
          description: Not allowed (non-partner persona, or account not visible)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierError"
        "404":
          description: Survivor or duplicate contact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierError"
