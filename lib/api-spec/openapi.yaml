        [id, accountId, parentType, parentId, type, title, status, overdue, createdAt, updatedAt]
      properties:
        id: { type: string }
        accountId: { type: string }
        # Cross-account roll-ups stamp these so the row links back to its
        # account; null inside a single account's timeline.
        accountName: { type: ["string", "null"] }
        parentType: { $ref: "#/components/schemas/AtelierActivityParentType" }
        parentId: { type: string }
        parentLabel: { type: ["string", "null"] }
        type: { $ref: "#/components/schemas/AtelierActivityType" }
        title: { type: string }
        body: { type: ["string", "null"] }
        ownerId: { type: ["string", "null"] }
        ownerName: { type: ["string", "null"] }
        ownerInitials: { type: ["string", "null"] }
        dueDate: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/AtelierActivityStatus" }
        # True when an open task's dueDate is in the past.
        overdue: { type: boolean }
        completedAt: { type: ["string", "null"] }
        createdByUserId: { type: ["string", "null"] }
        createdByName: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }

