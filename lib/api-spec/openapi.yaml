      type: object
      required: [accountId, offerings, personas, cells]
      properties:
        accountId: { type: string }
        offerings:
          type: array
          items: { type: string }
        personas:
          type: array
          items: { type: string }
        cells:
          type: array
          items: { $ref: "#/components/schemas/AtelierWhitespaceCell" }
        priorityMoves:
          type: array
          items: { type: string }
        generatedAt: { type: ["string", "null"] }

    AtelierQbrSection:
      type: object
      required: [heading, body]
      properties:
        heading: { type: string }
        body: { type: string }

    AtelierQbrCanvas:
      type: object
      required: [accountId, periodLabel, sections]
      properties:
        accountId: { type: string }
