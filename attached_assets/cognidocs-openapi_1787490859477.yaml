    get:
      operationId: getInvoiceTemplate
      tags: [invoice-templates]
      summary: Get an invoice template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The invoice template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceTemplate"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    patch:
      operationId: updateInvoiceTemplate
      tags: [invoice-templates]
      summary: Update an invoice template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceTemplateUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceTemplate"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteInvoiceTemplate
      tags: [invoice-templates]
      summary: Delete an invoice template lineage
      description: >
        Permanently removes every template version for the selected vendor
        lineage. Parsed invoices, line items, merchants, categories, and audit
        history are preserved. Super-admin access is required.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/AuthenticatedForbiddenResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

