          oneOf:
            - $ref: "#/components/schemas/InvoiceReconciliation"
            - type: "null"
        sourceParser:
          type: string
        arithmeticModel:
          type: ["string", "null"]
          description: >
            Arithmetic convention the validator matched, e.g. "tax-inclusive(5%)".
            Null when no arithmetic model was identified.
        paymentMethod:
          type: ["string", "null"]
        paymentReference:
          type: ["string", "null"]
          description: >
            Receipt transaction, authorization, or approval reference copied
            from the document. Null when the receipt prints none. Always null
            for invoices.
        associatedInvoiceRefs:
          type: array
          description: >
            Every invoice reference explicitly printed as paid by a receipt.
            Empty when none are shown and for invoice documents. These values
            are evidence only and are not database links.
          items:
            type: string
        bankingDetails:
          description: >
            Supplier banking/payment details captured verbatim from the
            document, or null when the invoice prints none. Fields are never
            fabricated.
          oneOf:
            - $ref: "#/components/schemas/InvoiceBankingDetails"
            - type: "null"
        templateRouting:
          description: >
            Non-sensitive deterministic-template routing evidence. Null for
            receipts and legacy result envelopes.
          oneOf:
            - $ref: "#/components/schemas/InvoiceTemplateRouting"
            - type: "null"
        merchantId:
          type: ["string", "null"]
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceLineItem"

