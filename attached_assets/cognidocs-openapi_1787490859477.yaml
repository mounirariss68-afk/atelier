        confidence:
          type: number
          minimum: 0
          maximum: 1

    InvoiceResult:
      type: object
      required:
        - id
        - vendorKey
        - vendorName
        - invoiceRef
        - normalizedInvoiceRef
        - issueDate
        - dueDate
        - currency
        - subtotalAmount10k
        - taxAmount10k
        - totalAmount10k
        - categoryKey
        - categoryProfileVersion
        - categoryFacts
        - detailTier
        - fieldConfidence
        - fieldsMissing
        - reconciliation
        - sourceParser
        - arithmeticModel
        - paymentMethod
        - paymentReference
        - associatedInvoiceRefs
        - bankingDetails
        - templateRouting
        - merchantId
        - lineItems
      properties:
        id:
          type: string
        vendorKey:
          type: string
        vendorName:
          type: ["string", "null"]
        invoiceRef:
          type: ["string", "null"]
        normalizedInvoiceRef:
          type: ["string", "null"]
          description: >
            Normalized form of invoiceRef used for deduplication (lowercased,
            whitespace-collapsed). Null when invoiceRef is null.
