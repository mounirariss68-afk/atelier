x-non-contract-handlers:
  "GET /design-system/export": Console-only binary export of the internal Cognirise Atelier design system; it is not an external CogniDocs integration operation.
  "PATCH /statement-templates/{id}": Compatibility-only handler that always returns 409 and directs callers to POST /statement-templates/{id}/versions.
  "GET /merchants/unmatched": Privacy tombstone that always returns 404; the raw observation queue is no longer an API surface.
  "POST /merchants/unmatched/dismiss": Privacy tombstone that always returns 404; unmatched observation mutation is no longer supported.
  "POST /merchants/backfill": Privacy tombstone that always returns 404; document-derived directory backfill is no longer supported.
  "POST /merchants/corrections": Privacy tombstone that always returns 404; document observations are never submitted to the global directory.
  "GET /merchants/absorptions/recent": Privacy tombstone that always returns 404; raw absorption history is no longer an API surface.
  "GET /merchants/{id}/absorptions": Privacy tombstone that always returns 404; raw absorbed aliases are no longer returned.
  "DELETE /merchants/{id}/absorptions": Privacy tombstone that always returns 404; raw absorption records are no longer user-manageable.

x-legal-acceptance-enforcement:
  description: >
    Every authenticated product operation mounted after the shared session-or-API-key
    guard requires the owning user to have accepted the current Terms and acknowledged
    the current Privacy Policy. This applies to both session cookies and API keys.
    A stale or missing acceptance returns HTTP 403 with code
    LEGAL_ACCEPTANCE_REQUIRED and the current required versions. Login, logout,
    current-user discovery, policy review/acceptance, password recovery/change, and
    2FA operations remain available so users can regain access or secure the account.
  response:
    status: 403
    schema:
      $ref: "#/components/schemas/LegalAcceptanceRequiredError"
