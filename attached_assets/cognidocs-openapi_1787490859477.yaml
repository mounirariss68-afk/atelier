          type: ["integer", "null"]
        taxAmount10k:
          type: ["integer", "null"]
        totalAmount10k:
          type: integer
        categoryKey:
          type: ["string", "null"]
        categoryProfileVersion:
          type: ["integer", "null"]
          minimum: 1
          description: Exact active extraction-profile version applied to this result.
        categoryFacts:
          type: array
          description: >
            Source-grounded category-specific facts permitted by the applied
            profile. Missing facts remain absent and values never replace line
            descriptions or financial fields.
          items:
            $ref: "#/components/schemas/InvoiceCategoryFactResult"
        detailTier:
          type: string
          enum: [itemized, summary, hybrid]
        fieldConfidence:
          type: ["object", "null"]
          additionalProperties:
            type: number
        fieldsMissing:
          type: ["array", "null"]
          items:
            type: string
