    ParseResultEnvelope:
      type: object
      required:
        - documentType
        - parserPath
        - confidence
        - statement
        - invoice
      properties:
        documentType:
          type: string
          enum: [invoice, receipt, bank_statement, credit_card_statement]
        parserPath:
          type: string
        confidence:
          # null = unknown (e.g. legacy jobs whose original score was unrecoverable)
          type: ["integer", "null"]
        statement:
          oneOf:
            - $ref: "#/components/schemas/StatementResult"
            - type: "null"
        invoice:
          oneOf:
            - $ref: "#/components/schemas/InvoiceResult"
            - type: "null"

    StatementResult:
      type: object
      required:
        - bankId
        - bankName
        - statementType
        - currency
        - accountRef
        - periodStart
        - periodEnd
        - templateId
        - templateGenerated
        - partialImportWarning
        - transactions
      properties:
        bankId:
          type: ["integer", "null"]
        bankName:
          type: ["string", "null"]
        statementType:
          type: string
          enum:
            - bank_statement
            - credit_card_statement
            - unknown
            - bank
            - credit_card
          description: >
            Current parsers emit bank_statement, credit_card_statement, or
            unknown. Persisted jobs created by older parsers can still contain
            the legacy values bank or credit_card.
        currency:
          type: string
        accountRef:
          type: ["string", "null"]
        periodStart:
          type: ["string", "null"]
          format: date
        periodEnd:
          type: ["string", "null"]
          format: date
        templateId:
          type: ["string", "null"]
        templateGenerated:
          type: boolean
        partialImportWarning:
          description: >
            Privacy-safe partial CSV import warning. Null for complete imports,
            non-CSV statements, and legacy jobs without this diagnostic. This
            object never contains rejected row values or transaction text.
          oneOf:
            - $ref: "#/components/schemas/CsvPartialImportWarning"
            - type: "null"
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/StatementTransaction"

    CsvPartialImportWarning:
      type: object
      additionalProperties: false
      required: [code, skippedRowCount, message]
      properties:
        code:
          type: string
          enum: [csv_rows_skipped]
        skippedRowCount:
          type: integer
          minimum: 1
        message:
          type: string
          enum:
            - Some CSV rows could not be imported because their required date or amount values were invalid.

    StatementTransaction:
      type: object
      required:
        - id
        - date
        - description
        - rawDescription
        - amount10k
        - currency
        - direction
        - type
        - category
        - subcategory
        - merchantId
        - balance10k
        - page
        - operationType
        - operationLabel
        - sourceMerchant
        - sourceText
        - sourceAmount
        - currencySource
        - directionSource
        - normalizedMerchant
        - parsedMerchant
        - categoryGroup
        - parserCategory
        - directoryCategory
        - effectiveCategory
        - categoryProvenance
        - parserConfidence
        - parserVersion
        - matchConfidence
        - matchProvenance
        - matchMethod
        - matchEvidence
        - matchAlternatives
        - matchBlockedReason
        - tenantOverride
        - stableMerchantId
        - entityType
        - flow
        - directionClassified
        - instrument
        - rail
        - tag
        - notes
        - sourcePage
        - documentIndex
        - sourceLineIndex
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        description:
          type: string
        rawDescription:
          type: ["string", "null"]
        amount10k:
          type: integer
        currency:
          type: string
        direction:
          type: ["string", "null"]
          enum: [debit, credit, null]
          description: >
            Account-level direction. Always use this field to distinguish money
            out from money in. Bank debits normally have negative amount10k;
            credit-card purchases are debit direction with positive amount10k,
            while card payments and refunds are credit direction with negative
            amount10k.
        type:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        subcategory:
          type: ["string", "null"]
          description: >
            Taxonomy subcategory compatible with category, or null when no
            trustworthy compatible classification is available.
        merchantId:
          type: ["string", "null"]
        balance10k:
          type: ["integer", "null"]
        page:
          type: ["integer", "null"]
        operationType:
          type: ["string", "null"]
          description: >
            Machine-readable banking operation type retained independently from
            the user-facing transaction description.
        operationLabel:
          type: ["string", "null"]
          description: >
            Generic banking operation label retained as metadata when a cleaned
            merchant or counterparty is used as the transaction description.
        sourceMerchant:
          type: ["string", "null"]
          description: >
            Raw merchant text extracted from the statement row before any
            cleaning or normalization. Preserved verbatim from the source
            document for audit and CSV export.
        sourceText:
          type: ["string", "null"]
          description: >
            Full raw text of the statement row, when available from the parser.
            Equivalent to rawDescription for most parsers.
        sourceAmount:
          type: ["string", "null"]
          description: Amount text as it appeared in the source row, before numeric parsing.
        currencySource:
          type: ["string", "null"]
          description: Currency evidence retained by the parser from the source row.
        directionSource:
          type: ["string", "null"]
          description: Direction evidence retained by the parser from the source row.
        normalizedMerchant:
          type: ["string", "null"]
          description: >
            Normalized (lowercased, punctuation-stripped) merchant name used
            for directory matching. Derived from sourceMerchant.
        parsedMerchant:
          type: ["string", "null"]
          description: >
            Cleaned merchant name output by the parser, before directory
            lookup. Null when the parser did not produce a distinct cleaned name.
        categoryGroup:
          type: ["string", "null"]
          description: >
            High-level taxonomy group for the transaction category, e.g.
            "Food & Dining". Null when no category is assigned.
        parserCategory:
          type: ["string", "null"]
          description: >
            Category assigned by the parser or AI model before merchant
            directory lookup. Null when the parser did not assign a category.
        directoryCategory:
          type: ["string", "null"]
          description: >
            Category from the merchant directory match. Null when no merchant
            was matched or the directory entry carries no category.
        effectiveCategory:
          type: ["string", "null"]
          description: >
            Final authoritative category after parser, directory, and tenant
            override resolution. This is the same effective value as category.
        categoryProvenance:
          type: ["string", "null"]
          enum: [user_override, directory, parser, default, null]
          description: Source that supplied effectiveCategory.
        parserConfidence:
          type: ["number", "null"]
          description: Parser confidence for the canonical source row.
        parserVersion:
          type: ["string", "null"]
          enum: [v1, v2, v3, null]
        matchConfidence:
          type: ["number", "null"]
          description: >
            Confidence score (0–1) for merchant matching. Null when no matcher
            evidence was persisted.
        matchProvenance:
          type: ["string", "null"]
          description: >
            Safe matcher provenance label, such as v3_classifier. Internal
            directory revision identifiers are never exposed.
        matchMethod:
          type: ["string", "null"]
          description: Matcher method label, when persisted.
        matchEvidence:
          type: array
          items: { type: string }
          default: []
          description: Safe evidence labels retained from merchant matching.
        matchAlternatives:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/StatementMatchAlternative"
          description: Ranked alternative merchant candidates retained by the matcher.
        matchBlockedReason:
          type: ["string", "null"]
        tenantOverride:
          type: ["boolean", "null"]
          description: True when the tenant's merchant override supplied the result.
        stableMerchantId:
          type: ["string", "null"]
          description: Cross-system merchant identity supplied by the matcher, when available.
        entityType:
          type: ["string", "null"]
          enum: [merchant, counterparty, operation, null]
          description: >
            Semantic entity type of the transaction description. "merchant" for
            retail/service vendors, "counterparty" for P2P or bank transfers,
            "operation" for internal banking operations (fees, interest, etc.).
        flow:
          type: ["string", "null"]
          enum: [expense, income, unknown, null]
        directionClassified:
          type: ["string", "null"]
          enum: [incoming, outgoing, null]
        instrument:
          type: ["string", "null"]
          enum: [debit_card, credit_card, bank_account, cash, null]
        rail:
          type: ["string", "null"]
          enum: [card, internal_transfer, swift, eft, direct_debit, billpay, unknown, null]
        tag:
          type: ["string", "null"]
        notes:
          type: array
          items:
            type: string
          description: >
            Parser or enrichment notes attached to this transaction. Empty
            array when none.
          default: []
        sourcePage:
          type: ["integer", "null"]
          description: >
            Page number within the source document where this transaction
            row appeared, when available. Equivalent to page.
        documentIndex:
          type: ["integer", "null"]
          description: Parser-provided document/page index for the source row.
        sourceLineIndex:
          type: ["integer", "null"]
          description: Parser-provided line index for the source row.

    StatementMatchAlternative:
      type: object
      required: [name, confidence]
      properties:
        name:
