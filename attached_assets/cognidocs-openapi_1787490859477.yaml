openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CogniDocs — API-first document parsing service
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: documents
    description: Document ingestion and parse jobs
  - name: merchants
    description: Merchant directory and corrections
  - name: banks
    description: Bank directory
  - name: statement-templates
    description: Bank statement templates
  - name: invoice-templates
    description: Invoice vendor templates
  - name: invoice-categories
    description: Invoice categories
  - name: api-keys
    description: API key management
  - name: billing
    description: Plans, quotas and billing
  - name: docs
    description: API documentation downloads
  - name: chat
    description: Console chat natural-language routing
  - name: auth
    description: User accounts, sessions, email OTP, 2FA, and legal-policy acceptance
  - name: admin
    description: Admin console — user management, usage monitoring and audit log
security:
  - apiKeyAuth: []
  - bearerAuth: []
  - sessionCookieAuth: []

x-operation-access:
  public:
    - GET /healthz
    - GET /auth/legal-requirements
    - POST /auth/register
    - POST /auth/verify-email
    - POST /auth/resend-verification
    - POST /auth/login
    - POST /auth/login/2fa
    - POST /auth/logout
    - POST /auth/password/forgot
    - POST /auth/password/reset
  session-only:
    - GET /auth/me
    - POST /auth/legal-acceptance
    - PATCH /auth/profile
    - GET /auth/profile/photo
    - POST /auth/profile/photo
    - DELETE /auth/profile/photo
    - POST /auth/password/change
    - POST /auth/2fa/setup
    - POST /auth/2fa/enable
    - POST /auth/2fa/disable
    - POST /auth/2fa/recovery-codes
    - POST /billing/checkout
    - POST /billing/portal
    - POST /billing/cancel
  session-only-super-admin:
    - PATCH /auth/users/{id}/role
    - GET /admin/maintenance/production-test-data-purge/manifest
    - POST /admin/maintenance/production-test-data-purge
    - GET /admin/maintenance/production-admin-test-cleanup/manifest
    - POST /admin/maintenance/production-admin-test-cleanup
  session-or-api-key:
    - POST /documents
    - GET /jobs
    - POST /jobs/export.zip
    - GET /document-archive
    - GET /jobs/{jobId}
    - DELETE /jobs/{jobId}
    - GET /jobs/{jobId}/export.csv
    - GET /merchants/taxonomy
    - GET /merchants/regions
    - GET /my/merchants
    - POST /my/merchants
    - PATCH /my/merchants/{id}
    - DELETE /my/merchants/{id}
    - GET /banks
    - GET /banks/{id}
    - GET /invoice-categories
    - POST /chat/route
    - GET /api-keys
    - POST /api-keys
    - DELETE /api-keys/{id}
    - GET /plans
    - GET /billing
    - GET /billing/history
    - POST /billing/plan
  session-or-api-key-api-access-plan:
    - GET /docs/openapi.yaml
    - GET /docs/api-guide
  session-or-api-key-admin:
    - GET /merchants
    - POST /merchants
    - POST /merchants/{id}/merge
    - GET /merchants/{id}
    - PATCH /merchants/{id}
    - DELETE /merchants/{id}
    - POST /banks
    - PATCH /banks/{id}
    - POST /banks/{id}/aliases
    - GET /statement-templates
    - GET /statement-templates/recoverable-lineages
    - GET /statement-templates/{id}
    - DELETE /statement-templates/{id}
    - GET /statement-templates/{id}/versions
    - POST /statement-templates/{id}/versions
    - POST /statement-templates/{id}/activate
    - POST /statement-templates/{id}/rollback
    - GET /statement-templates/{id}/health
    - GET /invoice-templates
    - POST /invoice-templates
    - GET /invoice-templates/{id}
    - PATCH /invoice-templates/{id}
    - POST /invoice-templates/{id}/activate
    - POST /invoice-templates/{id}/rollback
    - POST /invoice-categories
    - PATCH /invoice-categories/{key}
    - GET /invoice-categories/{key}/profiles
    - POST /invoice-categories/{key}/profiles/{version}/activate
    - GET /admin/users
    - POST /admin/users/{id}/password-reset
    - POST /admin/users/{id}/suspend
    - POST /admin/users/{id}/reactivate
    - POST /admin/users/{id}/2fa/reset
    - POST /admin/users/{id}/sessions/revoke
    - POST /admin/users/{id}/api-keys/revoke
    - GET /admin/usage
    - GET /admin/users/{id}/usage
    - GET /admin/email-log
    - POST /admin/email-log/{id}/resend
    - GET /admin/audit-log
  session-or-api-key-super-admin:
    - PATCH /plans/{key}
    - GET /billing/users
    - PATCH /billing/users/{id}/plan
    - DELETE /invoice-templates/{id}
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /documents:
    post:
      operationId: submitDocument
      tags: [documents]
      summary: Submit a document for parsing
      description: >
        Submit a document either as multipart/form-data (file upload) or as a
        JSON payload with a base64-encoded file. Responds with a queued ParseJob.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DocumentUpload"
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentSubmission"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseJob"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/AuthenticatedForbiddenResponse"
        "413":
          description: The decoded file exceeds the 20 MB document limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Content-Type is not multipart/form-data or application/json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The submitted PDF requires a password, or the supplied password was incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentPasswordError"

  /jobs:
    get:
      operationId: listJobs
      tags: [documents]
      summary: List parse jobs
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [queued, processing, completed, failed]
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [invoice, receipt, bank_statement, credit_card_statement, auto]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        "200":
          description: A list of parse jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParseJob"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /jobs/export.zip:
    post:
      operationId: exportJobsZip
      tags: [documents]
      summary: Export several completed parse jobs as CSV files in a ZIP archive
      description: >
        Creates one canonical CSV per selected parse job and streams them in a
        ZIP archive. Every selected job must belong to the authenticated user,
        be completed, and contain a valid exportable structured result. The
        request is atomic: if any selected job is unavailable or unexportable,
        no partial archive is returned. Batch count and total uncompressed CSV
        bytes are bounded by the service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobExportSelection"
      responses:
        "200":
          description: ZIP archive containing one canonical CSV per selected parse job
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"

  /document-archive:
    get:
      operationId: listDocumentArchive
      tags: [documents]
      summary: List metadata-only permanent-deletion receipts
      description: >
        Returns only the closed, allowlisted receipt projection for documents
        permanently deleted by the authenticated owner. It never reuses the
        parse-job serializer and never contains source or parsed content.
      responses:
        "200":
          description: Permanent-deletion receipts newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentDeletionReceipt"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /jobs/{jobId}:
    get:
      operationId: getJob
      tags: [documents]
      summary: Get a parse job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The parse job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseJob"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: permanentlyDeleteDocument
      tags: [documents]
      summary: Permanently delete an owned document and all derived content
      description: >
        Idempotent and existence-hiding. Owned, already-deleted, foreign, and
        nonexistent identifiers all receive the same empty response.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deletion request safely completed
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /jobs/{jobId}/export.csv:
    get:
      operationId: exportJobCsv
      tags: [documents]
      summary: Export a completed parse job as CSV
      description: >
        Returns the structured result of a completed parse job as a UTF-8
        RFC4180 CSV file. Statement jobs produce one row per transaction;
        invoice/receipt jobs produce one row per line item (or one summary
        row when no line items are present). Job and document header metadata
        are repeated on every row. Arrays are JSON-encoded; null cells are
        empty. Integer amount10k values are preserved as integers.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CSV export of the parse job
          content:
            text/csv:
              schema:
                type: string
                format: binary
                description: >
                  UTF-8 RFC4180 CSV. Content-Disposition header sets an
                  attachment filename derived from the original document name.
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /merchants:
    get:
      operationId: listMerchants
      tags: [merchants]
      summary: List merchants
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: A list of merchants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Merchant"
    post:
      operationId: createMerchant
      tags: [merchants]
      summary: Create a merchant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /merchants/taxonomy:
    get:
      operationId: listMerchantTaxonomy
      tags: [merchants]
      summary: List the controlled merchant category taxonomy
      responses:
        "200":
          description: Category taxonomy entries (group → category → subcategory)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MerchantTaxonomyEntry"

  /merchants/regions:
    get:
      operationId: listMerchantRegions
      tags: [merchants]
      summary: List merchant region codes
      responses:
        "200":
          description: Region codes and names
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MerchantRegion"

  /merchants/{id}/merge:
    post:
      operationId: mergeMerchants
      tags: [merchants]
      summary: Merge active merchants into one canonical merchant
      description: >
        Atomically moves aliases and canonical pointers from one or more active
        source merchants into the active target merchant identified by id, then
        tombstones each source. Admin-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantMergeInput"
      responses:
        "200":
          description: Merchants merged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantMergeResult"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /merchants/{id}:
    get:
      operationId: getMerchant
      tags: [merchants]
      summary: Get a merchant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The merchant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    patch:
      operationId: updateMerchant
      tags: [merchants]
      summary: Update a merchant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteMerchant
      tags: [merchants]
      summary: Delete a merchant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /my/merchants:
    get:
      operationId: listMyMerchants
      tags: [my-merchants]
      summary: List my merchant overrides
      description: >
        The authenticated user's own merchant overrides. Overrides take
        precedence over the global directory during classification.
      responses:
        "200":
          description: The user's overrides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyMerchant"
    post:
      operationId: createMyMerchant
      tags: [my-merchants]
      summary: Create (or upsert) a merchant override
      description: Re-adding an existing alias updates it and re-activates it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MyMerchantInput"
      responses:
        "201":
          description: Created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyMerchant"
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /my/merchants/{id}:
    patch:
      operationId: updateMyMerchant
      tags: [my-merchants]
      summary: Update a merchant override
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MyMerchantUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyMerchant"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteMyMerchant
      tags: [my-merchants]
      summary: Delete a merchant override
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /banks:
    get:
      operationId: listBanks
      tags: [banks]
      summary: List banks
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: country
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: A list of banks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bank"
    post:
      operationId: createBank
      tags: [banks]
      summary: Create a bank
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bank"
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /banks/{id}:
    get:
      operationId: getBank
      tags: [banks]
      summary: Get a bank
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The bank with aliases and products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bank"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    patch:
      operationId: updateBank
      tags: [banks]
      summary: Update a bank
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bank"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /banks/{id}/aliases:
    post:
      operationId: addBankAlias
      tags: [banks]
      summary: Add a bank alias
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankAliasInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bank"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /statement-templates:
    get:
      operationId: listStatementTemplates
      tags: [statement-templates]
      summary: List statement templates
      description: >
        Without a status filter, returns one active representative per template lineage.
        Explicit status filters return every matching version.
      parameters:
        - name: bankId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: A list of statement template summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatementTemplateSummary"

  /statement-templates/recoverable-lineages:
    get:
      operationId: listRecoverableStatementTemplateLineages
      tags: [statement-templates]
      summary: List statement template lineages needing activation
      description: >
        Returns the newest activation-ready version for each lineage that has no
        active version. Structurally incompatible history is excluded.
      responses:
        "200":
          description: Recoverable statement template lineages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecoverableStatementTemplateLineage"

  /statement-templates/{id}:
    get:
      operationId: getStatementTemplate
      tags: [statement-templates]
      summary: Get a statement template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The full statement template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementTemplate"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteStatementTemplate
      tags: [statement-templates]
      summary: Delete a statement template lineage
      description: Permanently deletes the selected template and every version in its lineage.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /statement-templates/{id}/versions:
    get:
      operationId: listStatementTemplateVersions
      tags: [statement-templates]
      summary: List statement template versions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A list of statement template versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatementTemplate"
    post:
      operationId: createStatementTemplateRevision
      tags: [statement-templates]
      summary: Create a reviewable statement template revision
      description: Creates a new needs_review child version without changing the active parser configuration or any prior version. Name, region, and statement type must match the source lineage.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementTemplateUpdate"
      responses:
        "201":
          description: Created statement template revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementTemplate"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /statement-templates/{id}/activate:
    post:
      operationId: activateStatementTemplate
      tags: [statement-templates]
      summary: Activate a statement template version
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateActivation"
      responses:
        "200":
          description: Activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementTemplate"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /statement-templates/{id}/rollback:
    post:
      operationId: rollbackStatementTemplate
      tags: [statement-templates]
      summary: Roll back a statement template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rolled back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementTemplate"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /statement-templates/{id}/health:
    get:
      operationId: getStatementTemplateHealth
      tags: [statement-templates]
      summary: Get statement template health
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Template health
          content:
            application/json:
              schema:
