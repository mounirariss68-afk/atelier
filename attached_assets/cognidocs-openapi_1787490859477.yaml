components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Recommended for external integrations. Keys are user-owned and inherit the owner's current role and plan entitlements.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: CogniDocs API key
      description: Compatibility alternative used by generated browser clients; the bearer value is the same user-owned API key accepted by X-API-Key.
    sessionCookieAuth:
      type: apiKey
      in: cookie
      name: cognidocs_session
      description: Signed-in browser session. Account, profile, password, and 2FA operations require this mode and do not accept API keys.
  responses:
    ErrorResponse:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AuthenticatedForbiddenResponse:
      description: >
        Access denied because current legal acceptance is required, the
        authenticated role or plan is insufficient, an API key entitlement is
        unavailable, or a document quota is exhausted. LEGAL_ACCEPTANCE_REQUIRED
        includes the exact current policy versions the owning user must accept
        through a browser session.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/LegalAcceptanceRequiredError"
    RateLimitResponse:
      description: Too many attempts from this caller; wait before retrying
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    DocumentPasswordError:
      type: object
      required: [code, error]
      properties:
        code:
          type: string
          enum: [pdf_password_required, pdf_password_incorrect]
        error:
          type: string

    DocumentUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: PDF, PNG, JPEG, WEBP, or statement CSV; maximum 20 MB.
        declaredType:
          type: string
          enum: [invoice, receipt, bank_statement, credit_card_statement, auto]
          default: auto
        password:
          type: string
          maxLength: 4096

    DocumentSubmission:
      type: object
      required: [fileBase64, fileName, mimeType]
      properties:
        fileBase64:
          type: string
          maxLength: 27962028
          contentEncoding: base64
          contentMediaType: application/octet-stream
          description: >
            Canonical RFC 4648 base64 with required padding. Data URLs and
            whitespace are not accepted. Decoded content must not exceed 20 MB.
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        mimeType:
          type: string
          minLength: 1
          maxLength: 255
        declaredType:
          type: string
          enum: [invoice, receipt, bank_statement, credit_card_statement, auto]
          default: auto
        password:
          type: string
          maxLength: 4096

    JobExportSelection:
      type: object
      additionalProperties: false
      required: [jobIds]
      properties:
        jobIds:
          type: array
          minItems: 2
          maxItems: 25
          uniqueItems: true
          items:
            type: string
            minLength: 1

    DocumentDeletionReceipt:
      type: object
      additionalProperties: false
      required:
        - receiptId
        - submittedAt
        - deletedAt
        - declaredType
        - deletionState
        - deletionPolicyVersion
        - aiPromptTokens
        - aiCompletionTokens
        - aiCostAmount10k
      properties:
        receiptId:
          type: string
          format: uuid
        submittedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
        declaredType:
          type: string
          enum: [invoice, receipt, bank_statement, credit_card_statement, auto]
        deletionState:
          type: string
          const: deleted
        deletionPolicyVersion:
          type: integer
          minimum: 1
        aiPromptTokens:
          type: ["integer", "null"]
          minimum: 0
        aiCompletionTokens:
          type: ["integer", "null"]
          minimum: 0
        aiCostAmount10k:
          type: ["integer", "null"]
          minimum: 0

    ParseJob:
      type: object
      required:
        - id
        - declaredType
        - detectedType
        - status
        - fileName
        - mimeType
        - fileSizeBytes
        - startedAt
        - parserPath
        - confidence
        - error
        - result
        - createdAt
        - completedAt
        - aiPromptTokens
        - aiCompletionTokens
        - aiCostAmount10k
        - sandbox
        - timingTrace
      properties:
        id:
          type: string
        declaredType:
          type: string
          enum: [invoice, receipt, bank_statement, credit_card_statement, auto]
        detectedType:
          type: ["string", "null"]
          enum: [invoice, receipt, bank_statement, credit_card_statement, null]
        status:
          type: string
          enum: [queued, processing, completed, failed]
        fileName:
          type: string
        mimeType:
          type: ["string", "null"]
          description: MIME type of the submitted document as reported by the upload.
        fileSizeBytes:
          type: ["integer", "null"]
          description: >
            Size of the submitted document in bytes. Null for jobs created
            before this field was tracked.
        startedAt:
          type: ["string", "null"]
          format: date-time
          description: >
            Timestamp when the job transitioned from queued to processing.
            Null while the job is still queued or for jobs created before
            this field was tracked.
        parserPath:
          type: ["string", "null"]
          description: >
            Parser implementation path selected for the job. Invoice and receipt
            values include vendor_template, ai_text, and ai_vision. Statement
            values include template_match:<parser>, template_generated:<parser>,
            ai:<parser>, and unknown. Treat this as diagnostic metadata rather
            than a stable workflow state.
        confidence:
          type: ["integer", "null"]
        error:
          type: ["string", "null"]
        aiPromptTokens:
          # AI prompt tokens consumed while parsing; null for pre-tracking jobs
          type: ["integer", "null"]
        aiCompletionTokens:
          type: ["integer", "null"]
        aiCostAmount10k:
          # Total AI cost in USD ×10000 ($0.0142 → 142); null when unknown
          type: ["integer", "null"]
        sandbox:
          # True when submitted via a sandbox-environment API key. Sandbox
          # jobs are excluded from monthly quota and platform analytics.
          type: boolean
        timingTrace:
          oneOf:
            - $ref: "#/components/schemas/StatementTimingTrace"
            - type: "null"
          description: Privacy-safe statement lifecycle timings. Contains stage names and milliseconds only; never document text or transactions.
        result:
          oneOf:
            - $ref: "#/components/schemas/ParseResultEnvelope"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time

    StatementTimingStageDurations:
      type: object
      properties:
        document_detection: { type: ["integer", "null"] }
        pdf_text_ocr: { type: ["integer", "null"] }
        region_classification: { type: ["integer", "null"] }
        template_lookup: { type: ["integer", "null"] }
        v3_extraction: { type: ["integer", "null"] }
        v2_ai_fallback: { type: ["integer", "null"] }
        template_lifecycle: { type: ["integer", "null"] }
        canonical_mapping: { type: ["integer", "null"] }
        merchant_resolution: { type: ["integer", "null"] }
        database_commit: { type: ["integer", "null"] }

    StatementTimingDetailDurations:
      type: object
      properties:
        document_text_analysis: { type: ["integer", "null"] }
        family_scoring: { type: ["integer", "null"] }
        image_family_classification: { type: ["integer", "null"] }
        pdf_page_count: { type: ["integer", "null"] }
        template_matching_text: { type: ["integer", "null"] }
        v3_pdf_load: { type: ["integer", "null"] }
        v3_coordinate_extraction: { type: ["integer", "null"] }
        v3_thumbnail_wait: { type: ["integer", "null"] }
        v3_template_lookup: { type: ["integer", "null"] }
        v3_row_extraction: { type: ["integer", "null"] }
        v3_transaction_processing: { type: ["integer", "null"] }
        merchant_directory_load: { type: ["integer", "null"] }
        merchant_overrides_load: { type: ["integer", "null"] }
        merchant_matching: { type: ["integer", "null"] }

    StatementRoutingEvidenceGroups:
      type: object
      required:
        - statementIdentity
        - accountIdentity
        - ledgerStructure
        - signedAmountLedger
        - runningBalance
      properties:
        statementIdentity: { type: boolean }
        accountIdentity: { type: boolean }
        ledgerStructure: { type: boolean }
        signedAmountLedger: { type: boolean }
        runningBalance: { type: boolean }

    StatementRoutingScores:
      type: object
      required: [bank, creditCard, margin]
      properties:
        bank: { type: number }
        creditCard: { type: number }
        margin: { type: number }

    DocumentRoutingAlternative:
      type: object
      required: [family, confidence, evidenceGroups, eligible]
      properties:
        family:
          type: string
          enum: [invoice, receipt, bank_statement, credit_card_statement, other]
        confidence: { type: number }
        evidenceGroups:
          type: array
          items: { type: string }
        eligible: { type: boolean }

    PdfWorkStats:
      type: object
      required:
        - documentLoads
        - pageExtractions
        - peakCachedPageArtifacts
        - tempPdfWrites
        - ocrRuns
        - thumbnailRenders
      properties:
        documentLoads: { type: integer }
        pageExtractions: { type: integer }
        peakCachedPageArtifacts: { type: integer }
        tempPdfWrites: { type: integer }
        ocrRuns: { type: integer }
        thumbnailRenders: { type: integer }

    StatementRoutingDecision:
      type: object
      description: Privacy-safe document routing diagnostics. Contains no extracted text, account details, balances, or transaction descriptions.
      required:
        - selectedFamily
        - legacyFamily
        - classifierFamily
        - classifierConfidence
        - archetype
        - detectedCanonicalColumns
        - evidenceGroups
        - scores
        - veto
      properties:
        selectedFamily:
          type: string
          enum: [invoice, receipt, bank_statement, credit_card_statement, other, unknown]
        legacyFamily:
          type: string
          enum: [invoice, receipt, bank_statement, credit_card_statement, other, unknown]
        confidence: { type: number }
        margin: { type: number }
        evidenceCoverage: { type: integer }
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/DocumentRoutingAlternative"
        contradictions:
          type: array
          items: { type: string }
        abstentionReason:
          type: ["string", "null"]
          enum:
            - empty_or_unreadable
            - insufficient_evidence
