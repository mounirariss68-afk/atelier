kind = "web"
previewPath = "/launch/"
title = "Cognirise"
version = "1.0.0"
id = "artifacts/launch"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/launch/" ]
localPort = 20132

[services.development]
run = "pnpm --filter @workspace/launch run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/launch", "run", "build" ]
publicDir = "artifacts/launch/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20132"
BASE_PATH = "/launch/"
