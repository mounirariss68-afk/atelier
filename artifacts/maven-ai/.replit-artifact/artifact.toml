kind = "web"
previewPath = "/"
title = "Maven AI"
version = "1.0.0"
id = "artifacts/maven-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22132

[services.development]
run = "pnpm --filter @workspace/maven-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/maven-ai", "run", "build" ]
publicDir = "artifacts/maven-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22132"
BASE_PATH = "/"
