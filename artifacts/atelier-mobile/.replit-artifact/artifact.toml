kind = "mobile"
previewPath = "/mobile/"
title = "Atelier Mobile"
version = "1.0.0"
id = "artifacts/atelier-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 20039

[services.development]
run = "pnpm --filter @workspace/atelier-mobile run dev"

[services.production]
build = [ "sh", "-c", "pnpm --filter @workspace/api-server run test:riser-eval:canary && pnpm --filter @workspace/atelier-mobile run build && rm -rf node_modules \"$(pnpm store path)\" .git && mkdir -p /tmp/pkgs && cd /tmp/pkgs && npm init -y > /dev/null 2>&1 && npm install pdfjs-dist@6.1.200 heic-convert@2.1.0 mammoth@1.12.0 exceljs@4.4.0 @google-cloud/storage@7.21.0 unpdf@1.6.2 @huggingface/transformers@3.8.1 pdfkit@0.15.2 --no-save --omit=dev --no-package-lock > /dev/null 2>&1 && rm -rf /tmp/pkgs/node_modules/onnxruntime-node/bin/napi-v3/linux/x64/libonnxruntime_providers_cuda.so /tmp/pkgs/node_modules/onnxruntime-node/bin/napi-v3/linux/x64/libonnxruntime_providers_tensorrt.so /tmp/pkgs/node_modules/onnxruntime-node/bin/napi-v3/linux/arm64 /tmp/pkgs/node_modules/onnxruntime-node/bin/napi-v3/win32 /tmp/pkgs/node_modules/onnxruntime-node/bin/napi-v3/darwin /tmp/pkgs/node_modules/onnxruntime-web && mv /tmp/pkgs/node_modules /home/runner/workspace/" ]
run = [ "pnpm", "--filter", "@workspace/atelier-mobile", "run", "serve" ]

[services.env]
PORT = "20039"
BASE_PATH = "/mobile/"
