kind = "video"
previewPath = "/arcelik-demo-video/"
title = "Arçelik Pricing Intelligence — Demo Video"
version = "1.0.0"
id = "artifacts/arcelik-demo-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/arcelik-demo-video/" ]
localPort = 23742

[services.development]
run = "pnpm --filter @workspace/arcelik-demo-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/arcelik-demo-video", "run", "build" ]
publicDir = "artifacts/arcelik-demo-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23742"
BASE_PATH = "/arcelik-demo-video/"
