kind = "web"
previewPath = "/"
title = "Atelier — Cognirise Employee Portal"
version = "1.0.0"
id = "artifacts/atelier"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24797

[services.development]
run = "pnpm --filter @workspace/atelier run dev"

[services.production]
build = [ "sh", "-c", "pnpm --filter @workspace/api-server run test:riser-eval:canary && pnpm --filter @workspace/atelier run build" ]
publicDir = "artifacts/atelier/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24797"
BASE_PATH = "/"
