<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Atelier — Cognirise Employee Portal</title>
    <meta name="description" content="Atelier — internal employee portal for Cognirise. Senior-led, agentic-native consulting, end-to-end project lifecycle." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0A1230" />
    <link rel="icon" type="image/png" href="/cognirise-favicon.png" />
    <link rel="apple-touch-icon" href="/cognirise-favicon.png" />
    <meta property="og:title" content="Atelier — Cognirise Employee Portal" />
    <meta property="og:description" content="The internal employee portal for Cognirise. Senior-led, agentic-native consulting, end-to-end project lifecycle." />
    <meta property="og:image" content="/opengraph.jpg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Task #904: preload the dark-mode background so switching themes
         swaps the backdrop instantly without a flash. -->
    <link rel="preload" as="image" href="/dark-bg.webp" type="image/webp" />
    <!-- Task #911: preload the light-mode background too. -->
    <link rel="preload" as="image" href="/light-bg-wave.webp" type="image/webp" />
    <!-- Task #998: the sign-in screen keeps its own light artwork. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Task #1278: app-wide typography — Comfortaa (headings/display/
         wordmark) + Inter (body/UI), promoted from the Task #1277 preview.
         Plus Jakarta Sans / Quicksand no longer load. -->
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script>
      // Task #497 — pre-paint theme resolution. Runs synchronously before
      // first paint to avoid a flash of wrong theme. Order: localStorage →
      // OS prefers-color-scheme → "dark".
      (function () {
        try {
          var stored = localStorage.getItem('atelier-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc) tc.setAttribute('content', theme === 'light' ? '#F6F7FB' : '#0A1230');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        // Task #944 — pre-paint motion preference. "off" disables the
        // breathing backdrop via [data-motion="off"] CSS; OS
        // prefers-reduced-motion still wins regardless of this value.
        try {
          if (localStorage.getItem('atelier-motion') === 'off') {
            document.documentElement.setAttribute('data-motion', 'off');
          }
        } catch (e) {
          /* default: motion on */
        }
      })();
    </script>
  </head>
  <body>
    <!-- Task #966: the wave artwork (plus its readability scrim) lives on a
         dedicated fixed element so it can drift on a very slow, GPU-composited
         transform loop. body::before keeps only the color fallback below it;
         #bg-texture re-paints the static grid/dot/glow layers above it. -->
    <div id="bg-art" aria-hidden="true"></div>
    <div id="bg-texture" aria-hidden="true"></div>
    <!-- Task #942: dedicated fixed backdrop layers that "breathe" (slow
         transform/opacity keyframes). A real element (not body::before,
         whose background layers can't cheaply animate transforms) so the
         motion stays GPU-composited. Sits above the #bg-art artwork and
         #bg-texture layers and below #root (z-index 1). -->
    <div id="bg-breathe" aria-hidden="true">
      <i class="bb bb-1"></i>
      <i class="bb bb-2"></i>
      <i class="bb bb-3"></i>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
