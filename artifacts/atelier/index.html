<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>The Atelier — Cognirise Employee Portal</title>
    <meta name="description" content="The Atelier — internal employee portal for Cognirise. Senior-led, agentic-native consulting, end-to-end project lifecycle." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0A1230" />
    <link rel="icon" type="image/png" href="/cognirise-favicon.png" />
    <link rel="apple-touch-icon" href="/cognirise-favicon.png" />
    <meta property="og:title" content="The Atelier — Cognirise Employee Portal" />
    <meta property="og:description" content="The internal employee portal for Cognirise. Senior-led, agentic-native consulting, end-to-end project lifecycle." />
    <meta property="og:image" content="/opengraph.jpg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Task #904: preload the dark-mode background so switching themes
         swaps the backdrop instantly without a flash. -->
    <link rel="preload" as="image" href="/dark-bg.webp" type="image/webp" />
    <!-- Task #911: preload the light-mode background too. -->
    <link rel="preload" as="image" href="/light-bg.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&display=swap" rel="stylesheet">
    <script>
      // Task #497 — pre-paint theme resolution. Runs synchronously before
      // first paint to avoid a flash of wrong theme. Order: localStorage →
      // OS prefers-color-scheme → "dark".
      (function () {
        try {
          var stored = localStorage.getItem('atelier-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc) tc.setAttribute('content', theme === 'light' ? '#F6F7FB' : '#0A1230');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
